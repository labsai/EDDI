# CodeRabbit configuration. Settings here take precedence over the CodeRabbit UI.
# Schema: https://docs.coderabbit.ai/reference/configuration
language: en-US
reviews:
  # CHILL matches the setting reviews have used so far; switch to "assertive"
  # to also get style-level nitpicks.
  profile: chill
  auto_review:
    enabled: true
    # Only the first review is automatic. Later pushes (fixups, merges of main
    # into the branch) are re-reviewed only on request: comment
    # "@coderabbitai review" (new commits) or "@coderabbitai full review".
    # The review allowance is small, and re-reviewing every push used it up,
    # so the reviews that mattered came back "Review rate limited". Request a round for large or security-sensitive follow-ups.
    auto_incremental_review: false
    # Drafts are reviewed once they are marked ready for review.
    drafts: false
    # Review PRs into any branch, not only main. Stacked PRs (a PR based on
    # another feature branch) were skipped with "Auto reviews are disabled on
    # base/target branches other than the default branch".
    base_branches:
      - ".*"
