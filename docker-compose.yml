services:
  eddi:
    image: labsai/eddi:${EDDI_VERSION:-latest}
    environment:
      - "EDDI_VAULT_MASTER_KEY=${EDDI_VAULT_MASTER_KEY:-}"
      - "EDDI_DATASTORE_TYPE=${EDDI_DATASTORE_TYPE:-mongodb}"
      # ⚠️  Authentication escape hatch — defaults to "true" so the README
      # quick start works out of the box on a laptop. Every API endpoint is
      # then reachable WITHOUT a token, so this must be "false" for anything
      # reachable from outside localhost.
      #
      # Set it in .env (or the shell) to turn authentication back on:
      #   EDDI_SECURITY_ALLOW_UNAUTHENTICATED=false
      #   QUARKUS_OIDC_TENANT_ENABLED=true
      # and bring up docker-compose.auth.yml for a local Keycloak.
      #
      # EDDI already announces the unauthenticated state itself: AuthStartupGuard
      # logs a [SECURITY] ERROR banner at boot and a WARN reminder every hour
      # whenever OIDC is off in production mode.
      - "EDDI_SECURITY_ALLOW_UNAUTHENTICATED=${EDDI_SECURITY_ALLOW_UNAUTHENTICATED:-true}"
      # The MCP endpoint and the secrets vault need their own opt-in: inheriting
      # the flag above must not be enough to expose agent CRUD or vault writes.
      # HighValueSurfaceGuard refuses to boot without these while OIDC is off.
      - "EDDI_MCP_ALLOW_UNAUTHENTICATED=${EDDI_MCP_ALLOW_UNAUTHENTICATED:-true}"
      - "EDDI_SECRETSTORE_ALLOW_UNAUTHENTICATED=${EDDI_SECRETSTORE_ALLOW_UNAUTHENTICATED:-true}"
      # While authentication is off EDDI answers only requests addressed to
      # localhost, an IP address, host.docker.internal (and its Podman/gateway
      # siblings) or a host listed here (UnauthenticatedRequestGuard
      # — a DNS-rebinding page arrives with its own name), and refuses cross-site
      # POST/PUT/PATCH/DELETE. `eddi` is this service's name on the compose
      # network, which Prometheus (docker-compose.monitoring.yml) and other
      # containers use. Add the name you browse to when it is not localhost.
      - "EDDI_SECURITY_UNAUTHENTICATED_ALLOWED_HOSTS=${EDDI_SECURITY_UNAUTHENTICATED_ALLOWED_HOSTS:-eddi}"
      - "QUARKUS_OIDC_TENANT_ENABLED=${QUARKUS_OIDC_TENANT_ENABLED:-false}"
      - "MONGODB_CONNECTIONSTRING=mongodb://${MONGO_INITDB_ROOT_USERNAME:-eddi}:${MONGO_INITDB_ROOT_PASSWORD:-changeme}@mongodb:27017/eddi?authSource=admin&retryWrites=true&w=majority&connectTimeoutMS=10000&socketTimeoutMS=30000"
      # - "JAVA_OPTS_APPEND=-Dquarkus.http.cors.origins=http://localhost:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # EDDI ships unauthenticated by default (the escape hatch above), so it must
    # NOT be reachable from off-box out of the box. MongoDB is already bound to
    # 127.0.0.1 below; EDDI is bound the same way here. To expose it on the LAN
    # (or on 0.0.0.0), set EDDI_BIND=0.0.0.0 in .env — and turn authentication on
    # first (EDDI_SECURITY_ALLOW_UNAUTHENTICATED=false + QUARKUS_OIDC_TENANT_ENABLED=true,
    # via docker-compose.auth.yml). Exposing an unauthenticated instance is then an
    # explicit, deliberate choice rather than the default.
    ports:
      - "${EDDI_BIND:-127.0.0.1}:${EDDI_PORT:-7070}:7070"
      # 7443 is Quarkus' HTTPS port. Nothing listens on it until a TLS certificate
      # is configured (docs/security.md, "TLS Directly in Quarkus") — the mapping is
      # here for that case and refuses connections otherwise.
      - "${EDDI_BIND:-127.0.0.1}:${EDDI_HTTPS_PORT:-7443}:7443"
      # - "127.0.0.1:5005:5005"
    depends_on:
      mongodb:
        condition: service_healthy
      bind-guard:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7070/q/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Refuses to publish an UNAUTHENTICATED EDDI beyond loopback. The two
  # comments above explain the contract — "set EDDI_BIND=0.0.0.0 … and turn
  # authentication on first" — and this is what enforces it: a one-shot
  # container that exits 0 when EDDI_BIND is loopback or authentication is on,
  # and exits 1 (so `eddi` never starts) when EDDI_BIND names another interface
  # while EDDI_SECURITY_ALLOW_UNAUTHENTICATED is still "true". Overlays that
  # turn auth on (docker-compose.auth.yml) pass it without any change; so does
  # a deliberate, acknowledged public open-access install, which sets
  # EDDI_I_UNDERSTAND_PUBLIC=true (the GCP provisioner's --i-understand-public
  # does). Documented in docs/docker.md, "Publishing EDDI on the network".
  #
  # Runs on the mongo image, which this stack pulls anyway, so the guard costs
  # no extra image and works offline and with docker-compose.local.yml. `$$` is
  # compose's escape: these are shell variables, read from the environment the
  # service is given, not compose interpolation.
  bind-guard:
    image: mongo:7.0.43
    entrypoint: ["/bin/sh", "-c"]
    environment:
      - "EDDI_BIND=${EDDI_BIND:-127.0.0.1}"
      - "EDDI_SECURITY_ALLOW_UNAUTHENTICATED=${EDDI_SECURITY_ALLOW_UNAUTHENTICATED:-true}"
      - "EDDI_I_UNDERSTAND_PUBLIC=${EDDI_I_UNDERSTAND_PUBLIC:-false}"
    command:
      - |
        case "$$EDDI_BIND" in
          ""|127.0.0.1|localhost|::1|"[::1]") exit 0 ;;
        esac
        if [ "$$EDDI_SECURITY_ALLOW_UNAUTHENTICATED" != "true" ] || [ "$$EDDI_I_UNDERSTAND_PUBLIC" = "true" ]; then
          exit 0
        fi
        echo "" >&2
        echo "[SECURITY] Refusing to start: EDDI_BIND=$$EDDI_BIND would publish EDDI on a" >&2
        echo "  non-loopback interface while EDDI_SECURITY_ALLOW_UNAUTHENTICATED=true," >&2
        echo "  so every API endpoint — agents, conversations, the secrets vault, MCP —" >&2
        echo "  would be reachable from the network with no token at all." >&2
        echo "" >&2
        echo "  Turn authentication on first:" >&2
        echo "    EDDI_SECURITY_ALLOW_UNAUTHENTICATED=false   (in .env)" >&2
        echo "    QUARKUS_OIDC_TENANT_ENABLED=true" >&2
        echo "    docker compose -f docker-compose.yml -f docker-compose.auth.yml up" >&2
        echo "  or keep EDDI on loopback (EDDI_BIND=127.0.0.1, the default)." >&2
        echo "  To expose an UNAUTHENTICATED instance on purpose — an isolated network" >&2
        echo "  you alone can reach — set EDDI_I_UNDERSTAND_PUBLIC=true." >&2
        exit 1

  mongodb:
    image: mongo:7.0.43
    restart: always
    environment:
      - "MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME:-eddi}"
      - "MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD:-changeme}"
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb-db:/data/db
    healthcheck:
      # `ping` needs no authentication, so the probe carries no credentials: a
      # password here is interpolated into the container's healthcheck command,
      # where `docker inspect` and the host's process list show it.
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongodb-db:
