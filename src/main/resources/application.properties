systemRuntime.projectName=eddi
# Custom startup banner (replaces default Quarkus ASCII art)
quarkus.banner.path=banner.txt
systemRuntime.projectDomain=eddi.technology
# Derived from the Maven project version, never hand-copied. AGENTS.md makes
# pom.xml the single source of truth for versions, yet the release number used to
# be repeated verbatim in three properties in this file plus the Dockerfile's ARG
# default, so a release meant remembering five edits in the right combination and
# any miss shipped a mismatched version silently. quarkus.application.version is
# BUILD_AND_RUN_TIME_FIXED and defaults to the project version, so it resolves in
# both build-time properties (openapi, container-image) and runtime ones.
# ReleaseVersionSourceTest fails the build if a literal creeps back in.
systemRuntime.projectVersion=${quarkus.application.version}
systemRuntime.agentTimeoutInSeconds=60
%dev.systemRuntime.agentTimeoutInSeconds=600
%dev.eddi.conversations.maximumLifeTimeOfIdleConversationsInDays=10
eddi.conversations.maximumLifeTimeOfIdleConversationsInDays=90
%dev.eddi.conversations.deleteEndedConversationsOnceOlderThanDays=90
eddi.conversations.deleteEndedConversationsOnceOlderThanDays=365
# Longest turn input in characters; longer input is refused before any model call (0 disables)
eddi.conversations.max-input-chars=200000
# Per-category retention — set to -1 to disable automatic cleanup
# User memories (persistent facts, preferences, context)
eddi.usermemories.deleteOlderThanDays=-1
%dev.eddi.usermemories.deleteOlderThanDays=-1
# Audit ledger entries are deliberately NOT time-expired and have no retention
# property: IAuditStore is an append-only contract with no delete operation
# (GDPR Art. 17(3)(e), EU AI Act Arts. 17/19). Erasure is served by
# pseudonymization; archival/purge is an operational/database-level concern.
#
# Audit ledger — write buffering and tamper evidence
# Bound on the in-memory queue between submit() and the batch writer. Entries
# past the bound are DROPPED and counted on eddi_audit_entries_dropped_total
# rather than retained: the queue used to be unbounded while failed flushes
# re-queued their whole batch, so a slow or broken audit store grew the heap
# without limit and fed its own failure. Raise this if bursts are being dropped
# while the store is healthy.
eddi.audit.max-queue-size=100000
# Entries are HMAC-signed only when eddi.vault.master-key is set (see below).
# Without it the ledger is a log, not evidence — ComplianceStartupChecks warns
# at startup. Set this to true in regulated deployments to turn that warning
# into a hard startup failure.
eddi.compliance.audit-signing-required=false
eddi.migration.skipConversationMemories=false
eddi.migration.v6-qute.enabled=false

# Backup — how long a finished export archive stays downloadable.
# POST /backup/export/{agentId} writes a ZIP under tmp/archives/ and answers with
# a Location header; the client then GETs it. Nothing else deletes those files, so
# every export first sweeps archives older than this window. Raise it if a client
# may take longer than this between the POST and the GET; lower it to bound disk
# use on an instance that exports on a cron.
eddi.backup.export.retention-minutes=60
# How often that sweep runs on its own. Sweeping only from the export path left
# the last archives an instance produced on disk until its next export, which on
# a deployment that exports occasionally is indefinitely.
eddi.backup.export.sweep-interval=15m

# Qute — template engine (replaces Thymeleaf for native image support)
# Strict rendering is deliberately OFF in EVERY profile — do NOT add a %prod
# override. Templates are agent *data* loaded from the database, so a missing
# {properties.x} must render the same way everywhere: as an empty string.
# It used to be %prod=true, which meant a template that rendered fine in dev
# threw mid-conversation in production, and the two render call sites recovered
# differently (raw "{properties.x}" leaked into the reply on the output path,
# quick replies turned into null list entries). Template mistakes belong to
# write time, not to the middle of a user's turn; OutputTemplateTask logs any
# render failure and substitutes an empty string (its FAILED_TEMPLATE_SUBSTITUTE).
quarkus.qute.strict-rendering=false
# ...and "as an empty string" has to be stated, because strict-rendering=false
# only stops the THROW. A missing value still resolves to Qute's NotFound
# sentinel, whose default mapper writes the literal "NOT_FOUND" into the output —
# so a template referencing an optional property emitted
# "Your favourite language is: NOT_FOUND." into system prompts, HTTP call bodies
# and user-visible replies. (In dev mode the default is THROW_EXCEPTION instead,
# so dev and prod did not even agree.) NOOP renders nothing, in every profile.
quarkus.qute.property-not-found-strategy=NOOP

# Datastore — database backend for configuration and conversation storage
# Options: mongodb (default), postgres
eddi.datastore.type=mongodb

# PostgreSQL — only used when eddi.datastore.type=postgres
# Activate via Quarkus profile: -Dquarkus.profile=postgres (or env QUARKUS_PROFILE=postgres)
# DataStoreProducers selects the correct store implementation at runtime.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.active=false
quarkus.datasource.devservices.enabled=false
%postgres.quarkus.datasource.active=true
# jdbc.url, username, password are provided by DevServices for tests.
# For production, set all three explicitly:
# %postgres.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/eddi
# %postgres.quarkus.datasource.username=eddi
# %postgres.quarkus.datasource.password=eddi
%postgres.eddi.datastore.type=postgres

# Messaging — event bus for conversation ordering
# Options: in-memory (default, zero-dependency) or nats (JetStream, durable)
eddi.messaging.type=in-memory
# NATS configuration (only used when eddi.messaging.type=nats)
eddi.nats.url=nats://localhost:4222
eddi.nats.stream-name=EDDI_CONVERSATIONS
eddi.nats.max-retries=3
eddi.nats.ack-wait-seconds=60
eddi.nats.dead-letter-stream-name=EDDI_DEAD_LETTERS
# Bounds of the conversation stream. Its messages are ordering markers nothing
# consumes, so the oldest are discarded once any bound is reached.
eddi.nats.stream-max-age=1h
eddi.nats.stream-max-messages=100000
eddi.nats.stream-max-bytes=268435456

# Logging — in-memory ring buffer + optional DB persistence
# Ring buffer size (in-memory, for SSE live tail)
eddi.logs.buffer-size=10000
# DB persistence (set to false to disable — ring buffer + SSE only)
eddi.logs.db-enabled=true
# Flush interval for async batch DB writer (seconds)
eddi.logs.db-flush-interval-seconds=5
# Minimum log level to persist to DB (TRACE, DEBUG, INFO, WARN, ERROR)
eddi.logs.db-persist-min-level=WARN
# Attach log capture filter to console handler (captures every record into ring buffer)
quarkus.log.console.filter=eddi-log-capture

# Secrets Vault — envelope-encrypted secret storage
# Master key (KEK) — REQUIRED to enable vault. Set via env var:
#   EDDI_VAULT_MASTER_KEY=<your-32-char-passphrase>
# If not set, vault is DISABLED and plaintext configs pass through unchanged,
# AND the audit ledger is written UNSIGNED (no HMAC — tampering is undetectable).
# See eddi.compliance.audit-signing-required near the top of this file.
eddi.vault.master-key=
eddi.vault.cache-ttl-minutes=5
eddi.vault.cache-max-size=1000

# What happens when an agent's configuration names a vault secret whose
# SecretMetadata.allowedAgents does not grant it: off | warn | enforce.
# Checked at the single deployment boundary (AgentFactory#deployAgent), so it
# covers the scheduled redeploy poll, the REST deploy and deploy-on-demand alike.
#
# enforce BLOCKS the deployment. Two things make that safe to ship as the
# default here, and both are worth knowing before relying on it:
#   1. It is inert unless eddi.vault.master-key is set — with no master key the
#      vault is disabled and the check returns "no violations" without looking.
#   2. Every key AgentSetupService vaults carries allowedAgents = ["*"], which
#      grants every agent. Only a grant an operator has deliberately narrowed
#      can produce a violation.
# An unrecognised value fails startup rather than degrading to warn: a typo such
# as "enforced" must not leave a security control off while appearing on.
#
# Before enabling this on a deployment that HAS a master key and narrowed
# grants, run once with 'warn' and confirm the log is clean — in enforce mode a
# violation is an ERROR that stops the agent deploying, not a warning.
eddi.vault.grant-enforcement=enforce

# What the agent setup wizard does with a PLAINTEXT api key the vault already
# holds under some other name: checksum | never.
#
#   checksum (default) - reference the existing entry instead of writing a
#     second copy, so provisioning ten agents against one provider key leaves
#     one secret in the vault rather than ten. Matched on the SHA-256 checksum
#     the vault already stores per entry (nothing is decrypted to decide), and
#     only entries with allowedAgents unset or ["*"] are candidates - reusing a
#     narrowed grant would produce a config eddi.vault.grant-enforcement above
#     rejects at deploy time.
#   never - every setup writes its own setup.<agent>.<timestamp>.apiKey entry.
#     Choose this when two agents must be able to rotate the same-valued key
#     independently.
#
# Neither value touches an apiKey that is already a ${vault:...} reference, nor
# a request carrying an explicit vaultKeyName - those are caller decisions.
# An unrecognised value fails startup rather than degrading (same convention as
# grant-enforcement above): a typo must not silently switch de-duplication off.
eddi.setup.vault-key-reuse=checksum

# Tenant Quotas — SaaS foundation (per-tenant rate limits + usage metering)
# Set to -1 for unlimited. Disabled by default — zero impact on existing deployments.
eddi.tenant.default-id=default
eddi.tenant.quota.enabled=false
eddi.tenant.quota.max-conversations-per-day=-1
eddi.tenant.quota.max-agents-per-tenant=-1
eddi.tenant.quota.max-api-calls-per-minute=-1
eddi.tenant.quota.max-monthly-cost-usd=-1

# Scheduled Triggers — heartbeat / cron job configuration
# Master switch (set to false to disable all schedule polling)
eddi.schedule.enabled=true
# How often to check for due schedules (default: 15s)
eddi.schedule.poll-interval=15s
# How long until a claimed schedule is considered abandoned (crash recovery)
eddi.schedule.lease-timeout=5m
# Maximum retry attempts before dead-lettering
eddi.schedule.max-retries=5
# Exponential backoff: delay = base * multiplier^(attempt-1) seconds
eddi.schedule.backoff-base-seconds=15
eddi.schedule.backoff-multiplier=4
# Minimum allowed cron interval (prevents schedule bombing)
eddi.schedule.min-interval-seconds=60
# Instance ID for cluster claim tracking (auto-detected from hostname if empty)
eddi.schedule.instance-id=
# Default time zone for schedules (IANA format)
eddi.schedule.default-timezone=UTC
# Max schedules claimed per poll cycle. Claimed schedules are dispatched
# concurrently on virtual threads; raise this to drain large bursts of one-shot
# HITL approval timeouts faster (per-lease CAS gives a single claimant, but
# delivery is at-least-once — an expired lease can be re-claimed, so schedule
# targets like the HITL timeout handler are idempotent).
eddi.schedule.poll-batch-size=100
# How long a single conversation fire may run before it is abandoned as failed.
# Was hard-coded at 5 minutes; keep it at or below lease-timeout, since another
# instance may reclaim the schedule once the lease expires anyway.
eddi.schedule.fire-timeout=5m
# Opt-in: a persistent-strategy schedule ends its (idle) conversation and starts a
# new one after this many steps, so a heartbeat never grows one document to
# MongoDB's 16 MB limit. Conversation-scoped properties are carried over, the LLM
# history is not; the ended conversation stays readable. 0 (default) disables it
# and only warns once a persistent conversation passes 1000 steps.
eddi.schedule.persistent-conversation-max-steps=0
# Fire-log retention. Nothing used to prune eddi_schedule_fire_logs and a
# 60-second heartbeat writes ~525,600 rows a year on its own, so the table grew
# without bound and readFailedFireLogs scanned all of it. Set to 0 to keep
# everything (accepting that growth).
eddi.schedule.fire-log-retention=90d
# How often the retention sweep runs. The DELETE is by timestamp and therefore
# idempotent, so it needs no cluster claim.
eddi.schedule.fire-log-prune-interval=1h

# Human-in-the-loop (HITL) approval-timeout retention
# Optional auto-cancel of pending approvals older than this ISO-8601 duration
# (e.g. P30D). Empty = OFF (default): under WAIT_INDEFINITELY a pause never
# expires. Cancellation is audited and disarms the timeout schedule.
eddi.hitl.pending.max-age=
# How often the retention sweep runs (only active when max-age is set)
eddi.hitl.pending.sweep-interval=6h
# Tool-level HITL (tool-approval gate) kill-switch. When false the gate is inert
# (effective config forced to null) regardless of agent/task config — a
# rolling-upgrade control. Default true.
eddi.hitl.tool.enabled=true
# Tool-loop streaming kill-switch. When true (default), tool-enabled turns run
# their model rounds over the provider's streaming transport and the final
# answer reaches SSE clients token-by-token; false restores the previous
# single-chunk emit exactly.
eddi.llm.tool-loop.streaming.enabled=true
# TTL (on executedAt) for the write-ahead tool-execution journal
# (hitltoolexecutionjournal) that guarantees an approved tool call runs at
# most once across pod crashes and re-approvals. ISO-8601-ish duration
# accepted by MicroProfile Config (e.g. 30d, 720h).
eddi.hitl.tool.journal-retention=30d
# Cap (bytes) for serializing the frozen tool-call transcript into a pending
# HITL batch when a tool pause occurs. Raise this if large tool-call
# transcripts are being omitted (forcing the degraded fallback-rebuild path
# on resume). Default matches PendingToolCallBatch.TRANSCRIPT_MAX_BYTES_DEFAULT.
eddi.hitl.tool.transcript-max-bytes=2000000
# How a task-level toolApprovals (LlmConfiguration.Task.toolApprovals) combines
# with the agent-level hitlConfig.toolApprovals.
#   strict  (default): the task config can only STRENGTHEN the agent gate --
#           requireApproval patterns are united, task-level exempt entries are
#           ignored (exempt beats requireApproval, so a task-added exemption is
#           precisely the ungating vector), and task-level AUTO_APPROVE is
#           demoted to WAIT_INDEFINITELY unless the agent itself grants it.
#   replace (legacy): a present task config fully replaces the agent gate for
#           that task -- the pre-6.3.0 behavior, kept for designs that
#           deliberately loosen one task below its agent's gate.
eddi.hitl.tool.task-approvals.mode=strict

# EDDI's own documentation, served over REST (/administration/docs), as MCP
# resources (eddi://docs/*) and as MCP tools (list_docs/read_docs). One switch
# disables all of these surfaces together; the content is the public repository
# documentation, so this is an exposure policy, not a secrecy control.
eddi.docs.enabled=true

# Http Client
httpClient.maxConnectionPerRoute=200
httpClient.connectTimeoutInMillis=10000
httpClient.idleTimeoutInMillis=60000
httpClient.maxRedirects=5


# MongoDB
mongodb.database=eddi
%dev.mongodb.connectionString=mongodb://localhost:27017/eddi?retryWrites=true&w=majority&connectTimeoutMS=10000&socketTimeoutMS=30000
mongodb.connectionString=mongodb://mongodb:27017/eddi?retryWrites=true&w=majority&connectTimeoutMS=10000&socketTimeoutMS=30000

quarkus.mongodb.devservices.enabled=true
quarkus.mongodb.devservices.port=27017
# Under the postgres profile MongoDB is not the datastore and is usually absent entirely.
# The mongodb-client extension still contributes its health check, which then reports a
# "MongoDB connection health check: UP" line for a database nothing is talking to — noise
# that would also mask a genuine outage. Drop it from /q/health when Postgres is in charge.
#
# This has to go through smallrye-health rather than `quarkus.mongodb.health.enabled`:
# that one is fixed at build time, so a %postgres override can never apply to an image
# built once and pointed at either datastore. Keyed on the extension's check class.
%postgres.quarkus.smallrye-health.check."io.quarkus.mongodb.health.MongoHealthCheck".enabled=false
# Http
quarkus.http.port=7070
# The address EDDI can reach ITSELF at, for configs that must call this deployment's
# own API -- the Platform Operator's generated tools above all. Left unset, it is
# derived as http://127.0.0.1:${quarkus.http.port}, which is correct behind a reverse
# proxy and on a remapped published port precisely because it ignores both: a process
# reaches itself without going back out through whatever is in front of it. Set it only
# when loopback is genuinely wrong -- TLS terminated in-process, or a service name a
# mesh requires. NOT the address a browser uses to reach EDDI; that is what the operator
# used to be provisioned with, and it produced an agent whose every tool call failed on
# connect. See SelfUrlResolver and GET /administration/operator/self-url.
# With eddi.security.ssrf-protection.enabled=true, loopback, private and link-local
# targets are all refused by design, so such a deployment must set this to an address
# that passes the full SSRF target policy -- a name that resolves to a public address.
# An in-cluster service name usually resolves to a private address and stays blocked.
# The value must be a bare scheme://host[:port]; a path, query, fragment or credentials
# make it ignored. With quarkus.http.port=0 (random) nothing can be derived: until this
# is set the self URL is reported as unresolved and nothing is released to it.
# eddi.self.base-url=
# ${caller:token} is released to that address as well as to the caller's origin. The
# self address bypasses any reverse proxy in front of EDDI; turn this off if the proxy
# enforces restrictions EDDI's own authorization does not.
# eddi.caller-identity.self-release.enabled=true
# Immutable caching for hashed UI bundles. The pattern requires the content hash
# rather than assuming it: /(scripts|assets)/.* also matched
# /scripts/js/landing-redirect.js, which carries no hash and is loaded by the
# landing page every visitor hits first. A fix to it would then have gone unseen
# for up to a year, with no revalidation request even sent, because `immutable`
# suppresses one. /assets/ stays broad because it is machine-generated Manager
# build output and every file in it carries a hash (asserted by
# StaticAssetCachingTest); /scripts/ is hand-maintained, so it must prove the hash.
# Narrowing fails closed: a new un-hashed script simply gets normal caching.
quarkus.http.filter.ui-assets-immutable.header.Cache-Control=public, max-age=31536000, immutable
# NB the doubled backslashes: a .properties reader unescapes \\ to \, so a
# single one would reach the regex engine as a bare '.' meaning any character —
# and landing-redirect.js would match again, because 'redirect' happens to be
# eight characters between two separators.
quarkus.http.filter.ui-assets-immutable.matches=/assets/.*|/scripts/([^/]+/)*[^/]+\\.[A-Za-z0-9_-]{8}\\.[a-z0-9]+
quarkus.http.filter.ui-assets-immutable.methods=GET
quarkus.http.ssl-port=7443
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:3000,http://localhost:7070,https://localhost:7443
quarkus.http.cors.headers=accept, origin, authorization, content-type, x-requested-with
quarkus.http.cors.exposed-headers=Location
quarkus.http.cors.methods=OPTIONS,HEAD,GET,PUT,POST,DELETE,PATCH
# Multimodal Attachments — file upload + LLM forwarding
# Max size of a single uploaded attachment, in bytes (default 20 MB).
eddi.attachments.max-size-bytes=20971520
# Raise the HTTP request body limit above the caps that sit behind it: Quarkus'
# default is 10 MB, so larger uploads would die with a bare HTTP 413 before the
# layer that has something useful to say ever sees them.
#
# Two things sit behind it, and this must stay above BOTH plus multipart
# overhead: eddi.attachments.max-size-bytes (20 MB), and an ingestion source's
# upload.maxFileBytes — which defaults to 25 MB and is refused above 50 MB at
# save time, for exactly this reason. At 25M, a 25 MB knowledge-base document
# was refused by the server before the message explaining the limit could be
# produced.
quarkus.http.limits.max-body-size=60M
# Max characters of text extracted from a PDF / text attachment before truncation
# (shared by PdfReaderTool, the attachment forwarder and the readAttachment tool).
# ~12k tokens, matched to LlmConfiguration.ToolResponseLimits#defaultMaxChars —
# the next limit in the chain. readAttachment's result passes straight into the
# tool-response truncator, so anything extracted beyond that is cut there anyway;
# raising this above 50000 only wastes extraction work. The previous 10000 (~3
# pages) was 5x stricter than the truncator, clamping the tool long before the
# layer designed to protect the context window got a say — so a follow-up
# question saw far less of a document than the turn that uploaded it, which for
# a model with native PDF support was the whole file.
# Larger documents remain reachable: readAttachment takes a 1-based PDF page,
# and the truncator's paginate strategy hands out fetch_page cursors.
eddi.attachments.extraction.max-chars=50000
# Per-turn cap on how many attachments are forwarded to the LLM; extras are dropped
# with an attachments:errors note (never silently). Non-positive means unlimited.
eddi.attachments.max-per-turn=5
# Per-conversation storage quotas (0 or negative disables that limit).
eddi.attachments.max-per-conversation=50
eddi.attachments.max-total-bytes-per-conversation=104857600
# OpenAI-Compatible API Adapter (/v1) — presents deployed agents as OpenAI
# "models" for Open WebUI and any OpenAI-protocol client. See
# docs/open-webui-integration.md. Disabled by default: enabling exposes a new
# conversation surface, which should be a deliberate act.
eddi.openai-compat.enabled=false
# Shared secret clients send as `Authorization: Bearer <key>`. REQUIRED when
# http-policy=permit and authorization.enabled=true — OpenAiStartupGuard fails
# startup on that combination rather than serving conversations to anyone.
eddi.openai-compat.api-key=
# permit        -> the adapter enforces the static api-key itself (Open WebUI)
# authenticated -> Quarkus OIDC validates the bearer token; api-key is ignored
# Consumed by quarkus.http.auth.permission.openai-compat.policy below.
eddi.openai-compat.http-policy=permit
# Believe X-OpenWebUI-User-Id as the EDDI userId. Safe only because the caller
# already proved possession of the api-key (Open WebUI is a trusted proxy); a
# leaked key therefore permits impersonating any user.
eddi.openai-compat.trust-user-headers=true
# Serve callers with no resolvable identity. When true, ALL such callers share
# one conversation per (agent, chat) — and therefore each other's memory. Leave
# false in any multi-user deployment.
eddi.openai-compat.allow-anonymous=false
eddi.openai-compat.default-user=openai-anonymous
# Deployment environment whose agents are exposed as models.
eddi.openai-compat.environment=production
# How long to wait for one conversation turn before returning 504.
eddi.openai-compat.request-timeout-seconds=120
# Concurrent in-flight completions. Each holds a worker thread (the adapter
# blocks on the conversation turn, as the Slack handler does), so this bounds
# worker-pool consumption; excess requests get 429.
eddi.openai-compat.max-concurrent-requests=64
# TTL of the model list cache (agent deployments change rarely).
eddi.openai-compat.model-cache-seconds=30
# Also expose a "<model>:stateless" variant per agent — one-shot, no memory.
# Point Open WebUI's title/tag generation at these so utility prompts never
# land in the user's real conversation.
eddi.openai-compat.expose-stateless-variants=true
# Jackson JSON
json.prettyPrint=false
quarkus.jackson.write-dates-as-timestamps=true
# Quarkus 3.37+ enables reflection-free Jackson serializers by default.
# ConversationOutput extends LinkedHashMap — the generated serializer treats it
# as a bean (missing getters) instead of a Map, so map entries serialize as null.
# Disable until the domain model is refactored away from Map-extending classes.
quarkus.rest.jackson.optimization.enable-reflection-free-serializers=false
# Qute Templating — no %prod override on purpose: strict rendering stays off in
# production so dev and prod fail identically. See quarkus.qute.strict-rendering
# near the top of this file for the reasoning.
# Security response headers — defense-in-depth for SPA and API responses
quarkus.http.header.X-Content-Type-Options.value=nosniff
quarkus.http.header.X-Frame-Options.value=DENY
quarkus.http.header.Referrer-Policy.value=strict-origin-when-cross-origin
quarkus.http.header.X-XSS-Protection.value=0
quarkus.http.header.Permissions-Policy.value=camera=(), microphone=(), geolocation=()
# CSP: Two filters — strict default + relaxed override for Swagger UI.
# Uses quarkus.http.filter (regex path matching + order-based precedence).
# eddi.keycloak.public.url is set via EDDI_KEYCLOAK_PUBLIC_URL env var when auth is enabled.
# When auth is disabled (no env var) the placeholder expands to empty string — harmless.
#
# Default: strict CSP for the entire application (order=10, lower priority)
# Negative lookahead excludes /q/swagger-ui — its own relaxed CSP filter handles it.
# Without this exclusion both CSP headers are sent and the browser enforces the
# most-restrictive intersection, blocking Swagger UI's inline scripts.
# api.github.com in connect-src: the Manager's update check ("is a newer EDDI
# released?") reads api.github.com/repos/labsai/EDDI/releases/latest straight
# from the browser, without credentials and with no referrer. Under 'self'
# alone the browser refuses it, so the feature could only ever work in local
# dev. Read-only, one public endpoint, and the request carries nothing about
# this deployment; the check itself stays opt-in in the Manager.
quarkus.http.filter.csp-default.matches=/(?!q/swagger-ui(/|$)).*
quarkus.http.filter.csp-default.order=10
quarkus.http.filter.csp-default.header."Content-Security-Policy"=default-src 'self'; \
  script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; \
  connect-src 'self' https://api.github.com ${eddi.keycloak.public.url:}; \
  font-src 'self'; frame-ancestors 'none';
# Swagger UI: relaxed CSP (order=20, higher priority — overrides default)
# Swagger UI requires 'unsafe-inline' + 'unsafe-eval' for inline scripts and JSON schema rendering.
quarkus.http.filter.csp-swagger.matches=/q/swagger-ui(/.*)?
quarkus.http.filter.csp-swagger.order=20
quarkus.http.filter.csp-swagger.header."Content-Security-Policy"=default-src 'self'; \
  script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; \
  img-src 'self' data:; connect-src 'self' ${eddi.keycloak.public.url:}; \
  font-src 'self'; frame-ancestors 'none';
# OIDC Configuration
# quarkus.oidc.enabled is BUILD-TIME — extension must be active for token validation
quarkus.oidc.enabled=true
# quarkus.oidc.tenant-enabled is RUNTIME — controls whether auth is enforced
# Override at container start: QUARKUS_OIDC_TENANT_ENABLED=true
quarkus.oidc.tenant-enabled=false
quarkus.oidc.auth-server-url=http://localhost:8180/realms/eddi
quarkus.oidc.client-id=eddi-backend
quarkus.oidc.credentials.secret=
quarkus.oidc.authentication.user-info-required=true

# ── Which tokens EDDI accepts ────────────────────────────────────────────────
# Quarkus verifies `aud` on an ACCESS token only if this property is set (it is
# enforced for id tokens either way, and EDDI is bearer-only). Unset, EDDI
# accepted any token the realm issued, for any client in it — and roles come from
# realm_access/roles, which is client-independent, so such a token arrived with
# the user's full rights. That was tolerable while eddi-frontend was the only way
# to get one; it is not once clients can be added for MCP.
#
# The shipped realm gives eddi-frontend and eddi-mcp an `eddi-backend-audience`
# protocol mapper, so both mint tokens that satisfy this. A hand-built realm needs
# the same mapper on any client whose tokens EDDI should accept
# (oidc-audience-mapper, included.client.audience=eddi-backend) — or set this to
# the literal `any`, which quarkus-oidc treats as a sentinel for "skip audience
# validation" (OidcProvider.ANY_AUDIENCE) and returns to accepting every token in
# the realm.
quarkus.oidc.token.audience=eddi-backend

# user-info-required above costs one Keycloak round trip per request, which an
# MCP client makes many of. The cache is keyed on the token and does not replace
# any verification: signature, expiry and audience are checked per request, before
# the cache is consulted at all. What it DOES defer is the userinfo call itself,
# which doubles as a session-revocation check — Keycloak refuses userinfo for a
# session that has been logged out — so a killed session keeps working for up to
# the TTL below. That, not token expiry, is why the TTL is short.
quarkus.oidc.token-cache.max-size=1000
quarkus.oidc.token-cache.time-to-live=3M
quarkus.oidc.token-cache.clean-up-timer-interval=5M
# Roles come from the realm roles Keycloak puts in realm_access.roles — NOT from
# Quarkus's default, which is the `groups` claim.
#
# That default collided with a claim EDDI already owns: workspaces resolve
# `team:<group>` spaces from the groups claim (see WorkspaceSettings, whose
# eddi.workspaces.groups-claim also defaults to "groups"). Quarkus reads `groups`
# for roles whenever the claim is present and never falls back to realm_access,
# so ANY user who belongs to a Keycloak group had their EDDI roles replaced by
# their group paths, and every @RolesAllowed endpoint answered 403.
#
# This was not hypothetical: the realm this project ships
# (helm/eddi/files/eddi-realm.json, byte-identical to k8s/overlays/auth/) puts
# the seeded `eddi` administrator in the `engineering` group. Install the chart
# with keycloak.enabled=true, give `eddi` a password as NOTES.txt instructs, and
# the administrator authenticated successfully and was then denied everything —
# including /administration/*. The unprivileged fixtures belong to no group, so
# they behaved correctly, which is why the breakage was invisible.
#
# The auth E2E tier (ui/manager/e2e/auth, npm run test:e2e:auth) exercises
# exactly this: `eddi` is in a group AND holds eddi-admin, and must get 200.
quarkus.oidc.roles.role-claim-path=realm_access/roles
# Bearer-only: backend validates tokens, never initiates browser login.
# The Manager SPA handles login via JavaScript using the eddi-frontend client.
quarkus.oidc.application-type=service
# quarkus.oidc.token.lifespan-grace=3000

# ── MCP clients sign themselves in (RFC 9728 protected resource metadata) ────
# Advertise /mcp as an OAuth 2.0 protected resource, so an MCP client discovers
# where to authenticate and then holds and refreshes its OWN token. Without this
# the only way into an authenticated /mcp is an operator pasting a bearer token
# that Keycloak expires after five minutes, and a client that would log in by
# itself (a Claude Desktop connector, mcp-remote's OAuth) gets a bare 401 with
# nothing to discover. quarkus-oidc serves the document and appends
# resource_metadata="..." to the 401 challenge; no EDDI code is involved.
#
# Tracks tenant-enabled: an instance with authentication off has no authorization
# server to name, and the handler is not installed for a disabled tenant either.
quarkus.oidc.resource-metadata.enabled=${quarkus.oidc.tenant-enabled}
# A relative path publishes the document at
# /.well-known/oauth-protected-resource/mcp naming <origin>/mcp as the resource.
# Derived from the MCP root path rather than written twice: that setting is
# configurable, and an operator who moves the endpoint would otherwise leave
# discovery describing a path MCP is no longer served at, which a client either
# rejects or authenticates for the wrong resource. Move the root path and the
# permit rule below has to move with it — McpOAuthDiscoveryConfigTest fails if
# the three stop agreeing.
quarkus.oidc.resource-metadata.resource=${quarkus.mcp.server.http.root-path}
# The origin is otherwise taken from the request, and quarkus.http.proxy.* is not
# configured here, so behind a TLS-terminating ingress the identifier would go out
# as http:// — a downgrade an authenticated deployment should never advertise.
# Explicit rather than inherited because the one deployment this is wrong for is
# plain http with authentication on, which is the auth E2E tier: it overrides this
# to false (see ui/manager/docker-compose.integration-keycloak.yml), and any other
# http-with-auth deployment has to do the same.
quarkus.oidc.resource-metadata.force-https-scheme=true
# MUST be the PUBLIC Keycloak URL. The default would report auth-server-url,
# which in every shipped deployment is the cluster-internal address
# (http://keycloak:8080/realms/eddi) — a client on a laptop would be sent to
# authorize at a host it cannot resolve. token.issuer is already the public one,
# and RFC 8414 requires the advertised authorization server to equal the issuer.
quarkus.oidc.resource-metadata.authorization-server=${quarkus.oidc.token.issuer:${quarkus.oidc.auth-server-url}}
# Clients copy scopes_supported into their authorize request, and 'openid' is not
# decoration here: user-info-required=true above makes EDDI call userinfo on every
# request, and Keycloak refuses userinfo for a token issued without that scope.
quarkus.oidc.resource-metadata.scopes=openid

# Note: No callback permission needed — service mode returns 401 (no redirect).
# SPA entry points (/manage, /chat, /welcome, /workforce) and static assets
# (/scripts, /fonts, /img) are permitted so the SPA can load and handle
# Keycloak login via keycloak-js. All API endpoints remain behind the
# authenticated policy.
# Auth Permissions
# authorization.enabled tracks tenant-enabled — when OIDC is on, @RolesAllowed is enforced
authorization.enabled=${quarkus.oidc.tenant-enabled}
# Security escape hatch — MUST be explicitly set to true to allow unauthenticated access in prod
eddi.security.allow-unauthenticated=false

# ── Per-user workspaces ──────────────────────────────────────────────────────
# Whether configuration resources (agents, workflows, rule sets, LLM configs, …)
# are scoped to the user or team that created them. OFF by default: a single
# shared authoring workspace is the existing behaviour and stays the default.
#
# Ownership is recorded on every new resource whenever authentication is on,
# regardless of this flag — so an operator can upgrade, let attribution
# accumulate, verify it, and only then switch enforcement on. Enabling this
# against data that was never stamped is what would hide people's own work from
# them; WorkspaceAccessIndexMigration backfills that on first startup.
#
# Has no effect while authorization.enabled=false: with no authenticated
# principal there is nothing to scope resources to, and the app says so at boot.
eddi.workspaces.enabled=false
# JWT claim carrying the caller's Keycloak groups, which become team spaces.
# Needs a group-membership protocol mapper on the eddi-backend client; without
# one every user simply has a personal space and no teams, which is a correct
# answer rather than a failure.
eddi.workspaces.groups-claim=groups
# What happens to resources created before ownership was recorded.
#   shared     — visible to everyone (default; an upgrade hides nothing)
#   admin-only — visible only to eddi-admin, so an operator can migrate
#                deliberately and then close the door
eddi.workspaces.legacy-visibility=shared
# Where new resources are filed. Empty (default) = the creator's personal space.
# Set to a Keycloak group name for a team-first deployment, where colleagues see
# each other's work by default and personal spaces are opt-in.
#eddi.workspaces.default-space=
# The token endpoint advertised in A2A Agent Cards, for the case where the
# address EDDI uses to reach the IdP is not one an external peer can resolve —
# which is the shipped Keycloak shapes, where quarkus.oidc.auth-server-url is an
# in-cluster Service (Helm) or a compose hostname.
#
# The endpoint, not the issuer: the path is the provider-specific part, so an
# issuer-shaped setting could not express Okta's /oauth2/default/v1/token.
#
# Leave empty and EDDI derives it as <issuer>/protocol/openid-connect/token,
# where <issuer> comes from eddi.keycloak.public.url grafted onto the realm path,
# falling back to quarkus.oidc.auth-server-url. That derivation ASSUMES KEYCLOAK,
# which is what every shipped authenticated deployment runs. On any other IdP,
# set this property.
#eddi.a2a.public-token-endpoint=

# SSRF protection for agent-configured outbound calls (httpcalls + A2A peer fetch).
# When true, resolved target URLs are validated (no private/loopback/link-local/
# cloud-metadata addresses, http(s) only) and redirect-following is disabled on
# httpcalls so a 3xx cannot bounce to an internal host. Default OFF to preserve
# calls to internal/private APIs in self-hosted deployments — enable for
# multi-tenant / internet-facing deployments where agent configs are less trusted.
eddi.security.ssrf-protection.enabled=false
# Which instances live Agent Sync may read an agent FROM (POST /backup/import/sync*).
# The source URL is caller-supplied and the caller's X-Source-Authorization bearer
# travels to it, so the shipped policy is the strict one: HTTPS only, and no
# loopback/RFC 1918/ULA/CGNAT/link-local target. That strictness is also why two
# instances on one internal network — staging and production as neighbouring
# services, the ordinary self-hosted shape — could not sync at all until these
# existed. Dev and test mode always accept http:// regardless, so `quarkus:dev`
# needs none of this. Prefer naming exact origins over relaxing a rule globally.
# eddi.backup.sync.require-https=true
# eddi.backup.sync.allow-private-targets=false
# eddi.backup.sync.allowed-sources=https://staging.internal:7443,http://eddi-staging:7070
# Caller-identity forwarding: lets an apicall header use ${caller:token} /
# ${caller:userId} so an agent calls an API as the user it is talking to,
# instead of with a static credential that expires and flattens the audit trail.
# The token is only ever released to the same origin the caller addressed, only
# in a header (never a query string), and is scrubbed before the request is
# written to conversation memory. Set to false to forbid the feature outright.
eddi.caller-identity.enabled=true
# Static assets + SPA entry points — GET/HEAD only (no mutation allowed)
# Root-level icons/images must be listed explicitly because /* is caught by the authenticated policy
quarkus.http.auth.permission.static-assets.paths=\
  /,/index.html,/manage,/manage/*,/chat,/chat/*,/welcome,/welcome/*,/workforce,/workforce/*,\
  /scripts/*,/fonts/*,/css/*,/js/*,/img/*,/assets/*,\
  /eddi-icon.svg,/eddi-icon.ico,/favicon.ico,/robots.txt
quarkus.http.auth.permission.static-assets.policy=permit
quarkus.http.auth.permission.static-assets.methods=GET,HEAD
# Health endpoints — publicly readable (required for k8s probes)
quarkus.http.auth.permission.health.paths=/q/health/*
quarkus.http.auth.permission.health.policy=permit
quarkus.http.auth.permission.health.methods=GET
# Metrics — require authentication (leaks deployment shape)
# Removed from permit rules — falls through to authenticated policy
# Slack webhooks — POST only (signature verified in handler)
quarkus.http.auth.permission.slack.paths=/integrations/slack/*
quarkus.http.auth.permission.slack.policy=permit
quarkus.http.auth.permission.slack.methods=POST
# OpenAI-compatible adapter — REQUIRED: the catch-all below would otherwise
# capture /v1/* and reject the shared-API-key bearer token at the OIDC layer,
# before OpenAiAuthFilter ever runs. Default 'permit' delegates authentication
# to the adapter (shared api-key); set eddi.openai-compat.http-policy to
# 'authenticated' to have Quarkus OIDC validate per-user tokens instead.
quarkus.http.auth.permission.openai-compat.paths=/v1/*
quarkus.http.auth.permission.openai-compat.policy=${eddi.openai-compat.http-policy:permit}
quarkus.http.auth.permission.openai-compat.methods=GET,POST,OPTIONS
# MCP server + secrets vault — the two highest-value surfaces, given an explicit
# policy rather than inheriting the catch-all below. Both are also declaratively
# protected (@RolesAllowed), and both of those checks are no-ops when
# authorization.enabled=false; HighValueSurfaceGuard refuses a production boot in
# that state unless eddi.mcp.allow-unauthenticated / eddi.secretstore.allow-unauthenticated
# is explicitly set. Naming them here keeps their protection independent of the
# catch-all, so a future broad permit rule cannot silently open them.
quarkus.http.auth.permission.mcp.paths=/mcp,/mcp/*
quarkus.http.auth.permission.mcp.policy=authenticated
quarkus.http.auth.permission.secretstore.paths=/secretstore,/secretstore/*
quarkus.http.auth.permission.secretstore.policy=authenticated

# OAuth protected resource metadata (RFC 9728) — REQUIRED to be permit, and the
# feature does nothing without it. quarkus-oidc registers its handler as a Vert.x
# filter at priority 50, while SecurityHandlerPriorities.AUTHORIZATION is 100 and
# higher runs first: the handler therefore runs AFTER authorization, so the
# catch-all below would answer 401 and the client could never read the document
# that tells it where to log in. Exact paths and GET/HEAD only — a wildcard such
# as /.well-known/* would also pre-permit whatever else lands under there later,
# which is the mistake this file's other rules are written narrowly to avoid.
# For the same reason the second path is the exact path-inserted document rather
# than a /* under the prefix: a wildcard there would anonymously expose any
# future handler beneath it, and nothing decided that. The two paths are the bare
# form and the path-inserted one quarkus-oidc serves for the configured resource,
# so the second interpolates the SAME root path the resource above does. Spelling
# it /mcp here instead would strand the document behind the authenticated policy
# the moment an operator moved the MCP root: the metadata request would 401
# before discovery could start, and the 401 challenge would point at a path that
# answers 401 as well.
# The document discloses only the public Keycloak URL, which the Manager already
# serves unauthenticated at /manage/__auth_config__.js.
quarkus.http.auth.permission.oauth-resource-metadata.paths=\
  /.well-known/oauth-protected-resource,\
  /.well-known/oauth-protected-resource${quarkus.mcp.server.http.root-path}
quarkus.http.auth.permission.oauth-resource-metadata.policy=permit
quarkus.http.auth.permission.oauth-resource-metadata.methods=GET,HEAD

# OAuth callback for connections — REQUIRED to be permit, and permit is safe here.
# The provider redirects the user's BROWSER to this path as a top-level GET with
# no bearer token, and quarkus.oidc.application-type=service answers an
# unauthenticated request with 401 rather than a login redirect. Its guard is the
# single-use, short-TTL, server-stored `state`, which binds tenant, connection and
# principal — the handler never trusts a request parameter for identity.
quarkus.http.auth.permission.oauth-callback.paths=/connections/callback
quarkus.http.auth.permission.oauth-callback.policy=permit
quarkus.http.auth.permission.oauth-callback.methods=GET
# A2A discovery — the only endpoints on this deployment meant for callers that
# hold no EDDI credential at all. Quarkus evaluates these path policies BEFORE
# declarative RBAC, so @PermitAll on the JAX-RS method does NOT exempt a path
# from the catch-all below; without these entries every A2A peer got 401 (a bare
# one, since quarkus.oidc.application-type=service sends no login redirect) from
# an instance with quarkus.oidc.tenant-enabled=true. RestA2AEndpoint's @PermitAll
# annotations and this block must be read together — A2aEndpointPermissionsTest
# fails if they disagree.
#
# Deliberately enumerated rather than a /.well-known/* wildcard: RFC 9728
# protected-resource metadata is planned under that prefix
# (planning/saas-connectors-plan.md §6.3), and a wildcard would pre-permit it —
# and anything else later dropped there — without anyone deciding to.
#
# Agent Cards. A peer is handed a URL and fetches {url}/agent.json to learn what
# the agent can do; EDDI's own client does exactly that in
# A2AToolProviderManager.fetchAgentCard, with the apiKey optional, so a card
# behind authentication is a card no credential-less peer can read. The inner
# wildcard matches exactly one path segment (the agent id) and the /agent.json
# remainder must match, so this permits the card and nothing else under
# /a2a/agents — in particular not the JSON-RPC POST at /a2a/agents/{agentId},
# which stays @Authenticated.
quarkus.http.auth.permission.a2a-agent-card.paths=/.well-known/agent.json,/a2a/agents/*/agent.json
quarkus.http.auth.permission.a2a-agent-card.policy=permit
quarkus.http.auth.permission.a2a-agent-card.methods=GET
# Capability discovery. eddi.a2a.capabilities.public (default false) is the gate
# that decides this, and is not duplicated here: while it is off the handler
# answers 404 to everyone, authenticated or not, so permitting the path exposes
# nothing extra — and while it is on, "public" has to mean reachable without a
# token or the flag means nothing. One knob, in the place the operator already
# looks for it. (eddi.a2a.enabled gates these too, as it does every A2A endpoint,
# but neither flag inspects the caller — that is why permit is safe here.)
#
# GET /a2a/agents is NOT here. It enumerates every A2A-enabled agent with name,
# description, skills and URL — strictly more than the skill-name list that sits
# behind the flag above — and nothing in the protocol or in this codebase fetches
# it. It falls through to the catch-all and requires authentication.
quarkus.http.auth.permission.a2a-capabilities.paths=/.well-known/capabilities,/.well-known/capabilities/skills
quarkus.http.auth.permission.a2a-capabilities.policy=permit
quarkus.http.auth.permission.a2a-capabilities.methods=GET
# Catch-all — everything else requires authentication
quarkus.http.auth.permission.authenticated.paths=/,/*
quarkus.http.auth.permission.authenticated.policy=authenticated
quarkus.http.auth.permission.authenticated.methods=GET,HEAD,POST,PUT,DELETE,OPTIONS,PATCH
# Logging
quarkus.log.console.enabled=true
# %X prints the MDC that ContextLogger populates (environment, agentId,
# conversationId, userId). Without it that context was loaded and consumed
# in-process but never printed, so in the normal deployment shape — logs read
# from stdout via kubectl, Loki or CloudWatch — four of five ERROR lines named
# neither the conversation nor the agent, and a support ticket quoting one
# conversation id could not be traced. The doubled ']' was a typo.
#
# userId is deliberately NOT printed. ContextLogger still puts it in the MDC, where
# BoundedLogStore reads it behind the admin log surface, but stdout goes to whatever
# collector the cluster ships to and an end-user identifier there is CWE-532. The
# conversation id is the correlation key a support ticket carries anyway; resolving it
# to a user is an authenticated lookup, which is the right boundary for that step.
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss} %-5p [%c{3.}] (%t) [%X{agentId},%X{conversationId}] %s%e%n
quarkus.log.console.level=DEBUG
# Live Reload
quarkus.live-reload.instrumentation=true
# Micrometer
quarkus.micrometer.binder.http-server.max-uri-tags=200
# OpenAPI / Swagger
quarkus.swagger-ui.title=EDDI API
quarkus.swagger-ui.footer=&#169; LABS.AI 2026
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.doc-expansion=none
quarkus.swagger-ui.theme=original
quarkus.swagger-ui.tags-sorter=alpha
quarkus.smallrye-openapi.info-title=EDDI API
%dev.quarkus.smallrye-openapi.info-title=EDDI API (development)
quarkus.smallrye-openapi.info-version=${quarkus.application.version}
quarkus.smallrye-openapi.info-description=Enterprise-grade conversational AI platform. \
  Configure agents, orchestrate multi-agent group discussions, \
  and integrate with LLM providers via a unified REST API.
quarkus.smallrye-openapi.info-terms-of-service=
quarkus.smallrye-openapi.info-contact-email=contact@labs.ai
quarkus.smallrye-openapi.info-contact-name=LABS.AI
quarkus.smallrye-openapi.info-contact-url=https://eddi.labs.ai
quarkus.smallrye-openapi.info-license-name=Apache 2.0
quarkus.smallrye-openapi.info-license-url=https://www.apache.org/licenses/LICENSE-2.0.html
quarkus.smallrye-openapi.path=/openapi
# Auto-generate operationId from method name (SDK codegen friendly)
quarkus.smallrye-openapi.operation-id-strategy=METHOD
# OpenAPI Security Scheme (Keycloak OIDC)
# SmallRye auto-generates securityScheme + global securityRequirement.
# Swagger UI will show "Authorize" button.
# Only enforced at runtime when QUARKUS_OIDC_TENANT_ENABLED=true.
quarkus.smallrye-openapi.security-scheme=oidc
quarkus.smallrye-openapi.security-scheme-name=Keycloak OIDC
quarkus.smallrye-openapi.security-scheme-description=OAuth2 / OpenID Connect via Keycloak. \
  Only enforced when QUARKUS_OIDC_TENANT_ENABLED=true.
quarkus.smallrye-openapi.oidc-open-id-connect-url=\
  ${quarkus.oidc.auth-server-url}/.well-known/openid-configuration
quarkus.swagger-ui.oauth2-redirect-url=http://localhost:7070/q/swagger-ui/oauth2-redirect.html
# Docker
quarkus.container-image.group=labsai
quarkus.container-image.name=eddi
quarkus.container-image.tag=latest
quarkus.container-image.additional-tags=${quarkus.application.version}

# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║ SECURITY: MCP Server Authentication                                        ║
# ║                                                                            ║
# ║ By default, EDDI's MCP endpoint (/mcp) is UNAUTHENTICATED.                ║
# ║ All 84 MCP tools (agent CRUD, conversations, user memories, audit trails)  ║
# ║ are accessible to any MCP client that can reach this endpoint.             ║
# ║                                                                            ║
# ║ FOR PRODUCTION DEPLOYMENTS:                                                ║
# ║   1. Set QUARKUS_OIDC_TENANT_ENABLED=true                                 ║
# ║   2. Configure quarkus.oidc.auth-server-url to your Keycloak realm         ║
# ║   3. MCP clients must present valid Bearer tokens. With the                ║
# ║      resource-metadata block above they discover where to get one and      ║
# ║      refresh it themselves; see docs/mcp-server.md                         ║
# ║   4. Tools check realm roles — eddi-viewer, eddi-editor, eddi-admin or     ║
# ║      eddi-approver. There is NO role hierarchy: an admin does NOT satisfy  ║
# ║      a tool that names eddi-viewer. Most name one role; a few accept any   ║
# ║      of several, and the HITL tools also accept the conversation's owner   ║
# ║      (HitlAccessGuard). See docs/mcp-server.md                             ║
# ║                                                                            ║
# ║ Without OIDC enabled, authorization.enabled=false and role checks          ║
# ║ in McpConversationTools / McpMemoryTools are no-ops.                       ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
# MCP Server — Model Context Protocol (Phase 8a)
# Expose EDDI agents and admin API as MCP tools for AI assistants
# Streamable HTTP transport at /mcp endpoint. The namespace is quarkus.mcp.server.*
# with dots; the hyphenated quarkus.mcp-server.* that used to be here is not a key
# the extension knows, so changing it moved nothing and only logged an
# "Unrecognized configuration key" warning. Note the auth rule above pins /mcp
# independently — move both together or the old path stays guarded and the new one
# does not.
quarkus.mcp.server.http.root-path=/mcp

# HITL over MCP: when false, the MCP resume/approve/cancel tools refuse to mutate
# an approval gate (the read-only pending/status tools are unaffected). Ownership
# checks (owner/admin/eddi-approver) still apply when true. Set to false to make MCP
# a read-only HITL surface without touching the REST endpoints.
eddi.mcp.hitl.mutations.enabled=true

# Deliberate exposure switches for the two surfaces HighValueSurfaceGuard protects.
# These are NOT covered by eddi.security.allow-unauthenticated: that flag is set by
# every shipped compose file, so inheriting it must not be enough to ship an open
# MCP endpoint or an open credential store. Production boot fails while these are
# false and authorization.enabled is false.
eddi.mcp.allow-unauthenticated=false
eddi.secretstore.allow-unauthenticated=false

# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║ OBSERVABILITY: OpenTelemetry Distributed Tracing                           ║
# ║                                                                            ║
# ║ EDDI emits traces via OTLP protocol (backend-agnostic).                   ║
# ║ Works with Jaeger, Grafana Tempo, Datadog, Honeycomb, etc.                ║
# ║                                                                            ║
# ║ Traces include:                                                            ║
# ║   - JAX-RS REST endpoints (auto-instrumented by Quarkus)                  ║
# ║   - Vert.x outbound HTTP calls (auto-instrumented by Quarkus)            ║
# ║   - MongoDB operations (auto-instrumented by Quarkus)                     ║
# ║   - Pipeline task execution (manual spans in LifecycleManager)            ║
# ║                                                                            ║
# ║ FOR PRODUCTION: set quarkus.otel.exporter.otlp.endpoint to your           ║
# ║ collector (e.g. Jaeger at http://jaeger:4317).                            ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
quarkus.otel.service.name=eddi
quarkus.otel.exporter.otlp.endpoint=http://localhost:4317
# Disabled by default — enable via env var when a collector is present
# (docker-compose.monitoring.yml sets QUARKUS_OTEL_SDK_DISABLED=false)
quarkus.otel.sdk.disabled=true

# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║ COORDINATOR: Conversation Queue Limits                                     ║
# ║                                                                            ║
# ║ Maximum number of concurrent active conversation queues.                   ║
# ║ Prevents OOM from runaway conversation creation.                           ║
# ║ Follow-up messages to existing conversations are always accepted.          ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
eddi.coordinator.max-active-conversations=10000
# Maximum retained dead-letter entries (in-memory coordinator). Oldest are evicted
# first when exceeded. Set to -1 for unbounded, 0 to retain none.
eddi.coordinator.max-dead-letters=1000


# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║ CONNECTIONS: how an agent authenticates to a third-party system             ║
# ║                                                                            ║
# ║ One credential model across every outbound path, replacing five            ║
# ║ independently-implemented apiKey fields. Supports a static header, HTTP    ║
# ║ Basic, an OAuth service account, and OAuth per end user.                   ║
# ║                                                                            ║
# ║ RUNTIME SETTINGS — no restart. The four settings below are changed with   ║
# ║ PUT /connectionstore/settings (eddi-admin; the Manager's Connections page)║
# ║ and take effect on every instance within five seconds.                     ║
# ║                                                                            ║
# ║ They are listed COMMENTED OUT ON PURPOSE. Setting one here, or through its ║
# ║ environment variable, PINS it: the pinned value wins over the stored one, ║
# ║ and the settings endpoint refuses to change it (409). Pin a value when     ║
# ║ this deployment's operator, rather than its administrators, should own it.║
# ║ A pinned value is never copied into the store.                             ║
# ║                                                                            ║
# ║ Neither pinned nor stored, every setting fails closed: disabled, no base   ║
# ║ URL, empty credential endpoint allowlist, plaintext remote origins refused.║
# ╚══════════════════════════════════════════════════════════════════════════════╝
# Master switch. Off by default, matching the openai-compat precedent: a surface
# that stores refresh tokens is one somebody turns on deliberately.
#eddi.connections.enabled=true
# EDDI's own public origin. Becomes the OAuth redirect_uri, which the provider
# matches EXACTLY — so it is configured rather than derived from an inbound
# request, where a Host or X-Forwarded-Host header could steer it. Linking an
# account to an authorization-code connection answers 400 until it is set;
# every other connection type works without it. Must be a bare https origin
# (dev and test also accept http://localhost / http://127.0.0.1); a PINNED value
# that is not one refuses the boot, a stored one is refused at write time.
#eddi.connections.public-base-url=https://eddi.example.com
# Origins a client secret may be sent to — token and authorization endpoints,
# and only those. Comma-separated bare origins.
#
# Deliberately not settable per connection: baseUrlAllowlist on a connection says
# where its ACCESS TOKEN may go, while this says where its CLIENT SECRET may go,
# and a client secret mints new access tokens. A connection document must not be
# able to vouch for its own token endpoint, or an author who can edit one could
# point tokenUrl at a host they control and receive the vault-resolved secret.
# RFC 9728 resource-metadata discovery is not implemented; if it lands, the
# authorization server a challenge selects must be checked against this list.
#
# Empty means no OAuth connection can resolve (fail closed).
#eddi.connections.credential-endpoint-allowlist=https://auth.atlassian.com,https://oauth2.googleapis.com
# Whether a connection may send its credential over plaintext http to a host
# other than loopback. Off by default, because such a credential crosses the
# network unencrypted. While off, a remote http:// baseUrlAllowlist origin is
# refused at save time (400), refused per request (TARGET_NOT_ALLOWED) and
# reported at ERROR at boot; turn it on to accept one, with a WARN.
# http://localhost, http://127.0.0.1 and http://[::1] are always allowed.
#eddi.connections.allow-plaintext-remote-origins=false
# Not a runtime setting: whether PUT /connectionstore/settings accepts a write
# with no verified identity. @RolesAllowed is a no-op while
# authorization.enabled=false, so outside dev and test such a write is refused
# (403) unless this is true — an anonymous caller must not be able to approve a
# new credential endpoint just because OIDC is off. Pinning the values above is
# the alternative that needs no opt-out.
eddi.connections.settings.allow-unauthenticated-writes=false
