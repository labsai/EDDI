<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="%BRAND_THEME_COLOR%" />
  <link rel="icon" href="/branding/favicon.ico" />
  <title>%BRAND_PRODUCT_NAME% Chat</title>
  <meta name="description" content="%BRAND_PRODUCT_NAME% — %BRAND_TAGLINE%" />
  <meta property="og:title" content="%BRAND_PRODUCT_NAME% Chat" />
  <meta property="og:description" content="%BRAND_TAGLINE%" />
  <meta property="og:image" content="/branding/og-image" />
  <style>
    @font-face {
      font-display: swap;
      font-family: 'Noto Sans';
      font-style: normal;
      font-weight: 200;
      src: url('/fonts/noto-sans-v36-cyrillic_cyrillic-ext_devanagari_greek_greek-ext_latin_latin-ext_vietnamese-200.woff2') format('woff2'),
           url('/fonts/noto-sans-v36-cyrillic_cyrillic-ext_devanagari_greek_greek-ext_latin_latin-ext_vietnamese-200.ttf') format('truetype');
    }
    @font-face {
      font-display: swap;
      font-family: 'Noto Sans';
      font-style: normal;
      font-weight: 400;
      src: url('/fonts/noto-sans-v36-cyrillic_cyrillic-ext_devanagari_greek_greek-ext_latin_latin-ext_vietnamese-regular.woff2') format('woff2'),
           url('/fonts/noto-sans-v36-cyrillic_cyrillic-ext_devanagari_greek_greek-ext_latin_latin-ext_vietnamese-regular.ttf') format('truetype');
    }
    @font-face {
      font-display: swap;
      font-family: 'Noto Sans';
      font-style: normal;
      font-weight: 500;
      src: url('/fonts/noto-sans-v36-cyrillic_cyrillic-ext_devanagari_greek_greek-ext_latin_latin-ext_vietnamese-500.woff2') format('woff2'),
           url('/fonts/noto-sans-v36-cyrillic_cyrillic-ext_devanagari_greek_greek-ext_latin_latin-ext_vietnamese-500.ttf') format('truetype');
    }
  </style>
</head>
<body>
  <!-- First in <body>, so it comes after the stylesheet Vite injects at the end of
       <head> and the brand's colour tokens win (BrandDelivery). -->
  <link rel="stylesheet" href="/branding/brand.css" />
  <div id="root"></div>
  <!-- Operator settings the widget needs before its first request
       (window.__EDDI_CHAT__), served by the EDDI backend; see src/api/chat-config.ts. -->
  <script src="/chat/__config__.js"></script>
  <!-- The brand (window.__EDDI_BRAND__), served by the EDDI backend. -->
  <script src="/branding/__brand__.js"></script>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
