# Compose for the auth E2E tier — EDDI + MongoDB + Keycloak, with OIDC ENFORCED.
#
# The sibling integration compose files all run EDDI with
# EDDI_SECURITY_ALLOW_UNAUTHENTICATED, so @RolesAllowed is a no-op there and
# nothing in the suite ever exercised the authenticated path. This one turns
# authentication on and leaves it on.
#
# Usage: npm run infra:up:keycloak   (generates the realm first — see below)
# Then:  npm run test:e2e:auth
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    command: ["start-dev", "--import-realm"]
    ports:
      # Loopback only, and 8180 rather than 8080 because that is the port
      # application.properties already names in quarkus.oidc.auth-server-url.
      - "127.0.0.1:8180:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Pins the issuer and the discovery document's endpoints to the name EDDI
      # uses on the compose network, whatever host the request arrived on. The
      # tests fetch tokens through the published port on localhost:8180, and
      # without this pin Keycloak would derive `iss` from that request's Host
      # header — so every token would claim an issuer EDDI does not accept, and
      # the tier would report 401 for a reason that has nothing to do with the
      # code under test.
      KC_HOSTNAME: http://keycloak:8080
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    volumes:
      # Generated by scripts/make-test-realm.mjs from helm/eddi/files/eddi-realm.json,
      # the realm EDDI actually ships, plus a password for the `eddi` administrator
      # (which the shipped realm deliberately omits). Never a committed copy: the
      # one committed copy this repo had drifted until it matched nothing.
      - ./.keycloak-test-realm/eddi-realm.json:/opt/keycloak/data/import/eddi-realm.json:ro
    healthcheck:
      # The image carries no curl or wget, so this uses bash's /dev/tcp against the
      # management port that KC_HEALTH_ENABLED opens.
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  eddi:
    image: ${EDDI_IMAGE:-labsai/eddi:latest}
    ports:
      - "127.0.0.1:7070:7070"
    depends_on:
      mongodb:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      # The whole point of this file. tenant-enabled is the RUNTIME switch, and
      # application.properties ties authorization.enabled to it, so this single
      # variable is what makes @RolesAllowed real.
      QUARKUS_OIDC_TENANT_ENABLED: "true"
      QUARKUS_OIDC_AUTH_SERVER_URL: "http://keycloak:8080/realms/eddi"
      QUARKUS_OIDC_CLIENT_ID: "eddi-backend"
      # What /manage/__auth_config__.js hands the browser, so the SPA redirects to
      # a Keycloak the browser can actually reach — the container name above is
      # only resolvable inside the compose network.
      EDDI_KEYCLOAK_PUBLIC_URL: "http://localhost:8180"
      QUARKUS_HTTP_CORS_ORIGINS: "http://localhost:3000,http://localhost:5173,http://localhost:7070"
      # No EDDI_SECURITY_ALLOW_UNAUTHENTICATED here, deliberately: OIDC is
      # configured, so AuthStartupGuard is satisfied and the opt-out would only
      # switch off the thing this tier exists to test.

  mongodb:
    image: mongo:6.0
    restart: always
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - integration-keycloak-mongodb:/data/db

volumes:
  integration-keycloak-mongodb:
