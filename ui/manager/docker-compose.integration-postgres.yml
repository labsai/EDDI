# Lightweight compose for integration testing — EDDI backend + PostgreSQL.
# Usage: docker compose -f docker-compose.integration-postgres.yml up -d
# Then wait ~30s for EDDI to boot: curl http://localhost:7070/q/health
services:
  eddi:
    image: labsai/eddi:latest
    ports:
      # Loopback only. The opt-out below runs this backend with NO
      # authentication, and `7070:7070` binds every interface — which would
      # put an unauthenticated EDDI on whatever network the machine is on.
      # Tests and CI both reach it at localhost, so this costs nothing.
      - "127.0.0.1:7070:7070"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      QUARKUS_PROFILE: postgres
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/eddi
      QUARKUS_DATASOURCE_USERNAME: eddi
      QUARKUS_DATASOURCE_PASSWORD: eddi
      QUARKUS_HTTP_CORS_ORIGINS: "http://localhost:3000,http://localhost:5173"
      # EDDI refuses to boot in production mode without either OIDC configured
      # or an explicit opt-out. Without this the container exits(1) during
      # `docker compose up --wait`, before a single test runs — which is exactly
      # what had been happening: every Backend E2E run on main failed at
      # "Start backend infrastructure" for days, and the failure was invisible
      # because the log-collection step comes after the health check that never
      # ran. An unauthenticated throwaway backend is the entire point of these
      # compose files, so opting out is correct here and nowhere near production.
      EDDI_SECURITY_ALLOW_UNAUTHENTICATED: "true"

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: eddi
      POSTGRES_USER: eddi
      POSTGRES_PASSWORD: eddi
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eddi"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - integration-postgres:/var/lib/postgresql/data

volumes:
  integration-postgres:
