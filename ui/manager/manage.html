<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/branding/icon" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="%BRAND_PRODUCT_NAME% Manager — Admin dashboard for the %BRAND_PRODUCT_NAME% conversational AI platform" />
    <title>%BRAND_PRODUCT_NAME% Manager</title>
    <script src="/manage/__auth_config__.js"></script>
    <script src="/branding/__brand__.js"></script>
    <script type="module" src="/src/main.tsx"></script>
    <style>
      /* Inline loading indicator — visible until React mounts and replaces #root content */
      .app-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: #111113;
        color: #a1a1aa;
        font-family: system-ui, sans-serif;
        gap: 1.5rem;
      }
      .app-loader img {
        width: 120px;
        opacity: 0.9;
      }
      .app-loader-spinner {
        width: 32px;
        height: 32px;
        border: 3px solid #27272a;
        /* The default gold unless a brand is set: --brand-loader-accent is defined only
           by a branded /branding/brand.css (BrandDelivery). Not --color-primary,
           which the bundle CSS in <head> already defines as a different gold. */
        border-top-color: var(--brand-loader-accent, #d4a843);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      .app-loader-text {
        font-size: 0.875rem;
        letter-spacing: 0.05em;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="min-h-screen bg-background text-foreground antialiased">
    <!-- First in <body>, so it comes after the stylesheet Vite injects at the end of
         <head> and the brand's colour tokens win (BrandDelivery). -->
    <link rel="stylesheet" href="/branding/brand.css" />
    <div id="root">
      <div class="app-loader">
        <img src="/branding/logo" alt="%BRAND_PRODUCT_NAME%" />
        <div class="app-loader-spinner"></div>
        <div class="app-loader-text">Loading %BRAND_PRODUCT_NAME% Manager…</div>
      </div>
    </div>
  </body>
</html>
