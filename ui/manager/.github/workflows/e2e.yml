name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      # No `run_fullstack` input. One existed and nothing read it — the
      # full-stack step ran unconditionally in `backend-tests` regardless of what
      # the operator ticked, which is worse than having no switch at all.
      eddi_image_tag:
        description: "EDDI image tag to test against (e.g. 6.2.0-b764). Defaults to latest."
        type: string
        default: ""

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Tier 1: Fast UI tests (MSW mocks, no backend) ──────────────────
  ui-tests:
    name: UI E2E (MSW)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run UI E2E tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: ui-e2e-report
          path: playwright-report/
          retention-days: 14

  # ── Tier 2+3: Backend tests (integration + fullstack) ───────────────
  # Runs against both MongoDB and PostgreSQL via matrix strategy.
  # Only runs on push to main or manual dispatch — a PR gets the fast UI tier
  # only, because spinning up EDDI plus a database per PR is minutes of runner
  # time for a signal that main will give within the hour.
  backend-tests:
    name: Backend E2E (${{ matrix.database }})
    runs-on: ubuntu-latest
    # No `schedule` arm: this workflow declares no `schedule:` trigger, so that
    # condition could never be true.
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        database: [mongodb, postgres]
        include:
          - database: mongodb
            compose-file: docker-compose.integration.yml
          - database: postgres
            compose-file: docker-compose.integration-postgres.yml
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      # This step used to assert the image was ALREADY on the runner, which is
      # never true on a fresh one — so every push to main failed here before
      # running a single test, and the E2E badge has been red for weeks while
      # telling us nothing. `labsai/eddi` is published publicly, so pull it.
      #
      # `EDDI_IMAGE_TAG` lets a workflow_dispatch pin a specific build (e.g.
      # 6.2.0-b764) instead of tracking `latest`.
      - name: Pull EDDI backend image
        env:
          EDDI_IMAGE: labsai/eddi:${{ inputs.eddi_image_tag || 'latest' }}
        run: |
          echo "Pulling $EDDI_IMAGE"
          if ! docker pull "$EDDI_IMAGE"; then
            echo "::error::Could not pull $EDDI_IMAGE from Docker Hub."
            echo "::error::Check the tag exists: https://hub.docker.com/r/labsai/eddi/tags"
            exit 1
          fi
          # The compose files reference labsai/eddi:latest, so alias a pinned tag.
          if [ "$EDDI_IMAGE" != "labsai/eddi:latest" ]; then
            docker tag "$EDDI_IMAGE" labsai/eddi:latest
          fi
          docker image inspect labsai/eddi:latest --format 'Using {{.RepoTags}} built {{.Created}}'

      - name: Start backend infrastructure (${{ matrix.database }})
        run: docker compose -f ${{ matrix.compose-file }} up -d --wait
        timeout-minutes: 5

      - name: Wait for EDDI health
        run: |
          echo "Waiting for EDDI backend to become healthy..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:7070/q/health/live | grep -q '"UP"'; then
              echo "Backend is healthy!"
              exit 0
            fi
            echo "  Attempt $i/60 — waiting..."
            sleep 2
          done
          echo "::error::Backend did not become healthy within 120s"
          docker compose -f ${{ matrix.compose-file }} logs eddi
          exit 1

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run integration tests (${{ matrix.database }})
        run: npm run test:e2e:integration

      - name: Run full-stack tests (${{ matrix.database }})
        run: npm run test:e2e:fullstack

      - name: Collect backend logs
        if: ${{ !cancelled() }}
        run: docker compose -f ${{ matrix.compose-file }} logs > backend-logs.txt 2>&1

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: backend-e2e-report-${{ matrix.database }}
          path: |
            playwright-report/
            test-results.json
            backend-logs.txt
          retention-days: 14

      - name: Tear down infrastructure
        if: always()
        run: docker compose -f ${{ matrix.compose-file }} down -v
