name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      # No `run_fullstack` input. One existed and nothing read it — the
      # full-stack step ran unconditionally in `backend-tests` regardless of what
      # the operator ticked, which is worse than having no switch at all.
      eddi_image_tag:
        description: "EDDI image tag to test against (e.g. 6.2.0-b764). Defaults to latest."
        type: string
        default: ""

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Tier 1: Fast UI tests (MSW mocks, no backend) ──────────────────
  ui-tests:
    name: UI E2E (MSW)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run UI E2E tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: ui-e2e-report
          path: playwright-report/
          retention-days: 14

  # ── Tier 2 on PRs: API integration, one database, no browser ────────
  #
  # `backend-tests` below stays push-only: it runs the browser-driven full-stack
  # tier across two databases, which is minutes of runner time per PR. But the
  # integration tier on its own is the cheap half and the half that catches
  # contract breaks — 44 tests, `{ request }` only, no `page` anywhere, so no
  # browser download. Leaving it until after the merge meant the contract was
  # verified *after* the merge that broke it.
  #
  # It also refreshes the OpenAPI snapshot while a real backend is up, which is
  # the only place the *other* direction of drift is visible: the mock check in
  # `openapi-contract.test.ts` can see a handler inventing an endpoint, but only
  # a live instance can show the backend having changed underneath it.
  integration-tests:
    name: API Integration (mongodb)
    runs-on: ubuntu-latest
    # PRs only. On push, `backend-tests` already runs this tier across BOTH
    # databases — running it here too would just repeat the mongodb half.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      # No `eddi_image_tag` plumbing here: that input only exists on
      # workflow_dispatch, and this job is pull_request-only, so it would always
      # resolve to `latest` anyway. The pinning path lives in `backend-tests`.
      - name: Pull EDDI backend image
        run: |
          if ! docker pull labsai/eddi:latest; then
            echo "::error::Could not pull labsai/eddi:latest from Docker Hub."
            exit 1
          fi

      - name: Start backend infrastructure
        run: docker compose -f docker-compose.integration.yml up -d --wait
        timeout-minutes: 5

      - name: Wait for EDDI health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:7070/q/health/live | grep -q '"UP"'; then
              echo "Backend is healthy!"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Backend did not become healthy within 120s"
          docker compose -f docker-compose.integration.yml logs eddi
          exit 1

      - name: Install dependencies
        run: npm ci

      # Advisory here, blocking on push. The EDDI image tracks `latest`, so the
      # backend can gain an operation with no PR touching it — a hard failure
      # would then redden every open PR on a step none of them changed, fixable
      # only by someone booting a backend locally. The push-side job below
      # fails properly, which is where a red build blocks nobody review cycle.
      - name: Check the OpenAPI snapshot still matches this backend (advisory)
        continue-on-error: true
        run: |
          node .github/scripts/refresh-openapi-operations.mjs
          # Operations only, same as the push-side copy below: `eddiVersion`
          # moves on any patch release of an image that tracks `latest`, and a
          # whole-file diff would warn about an API change that did not happen.
          if ! git diff --exit-code \
               -I '"eddiVersion"' \
               -- src/test/mocks/openapi-operations.json; then
            echo "::warning::EDDI's API surface has changed and src/test/mocks/openapi-operations.json is stale."
            echo "::warning::Run: npm run openapi:refresh against a local backend, then commit the result."
            exit 1
          fi
          echo "Snapshot matches the running backend."
      # No `playwright install` — every integration spec takes `{ request }` and
      # none takes `{ page }`, so no browser is ever launched. Adding the install
      # back is ~1 minute per run for nothing; if a spec here ever needs a page,
      # add it in the same commit.
      - name: Run integration tests
        run: npm run test:e2e:integration


      - name: Collect backend logs
        if: ${{ !cancelled() }}
        run: docker compose -f docker-compose.integration.yml logs > integration-logs.txt 2>&1

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: integration-report
          path: |
            playwright-report/
            integration-logs.txt
          retention-days: 14

      - name: Tear down infrastructure
        if: always()
        run: docker compose -f docker-compose.integration.yml down -v

  # ── Tier 2+3: Backend tests (integration + fullstack) ───────────────
  # Runs against both MongoDB and PostgreSQL via matrix strategy.
  # Only runs on push to main or manual dispatch — a PR gets the fast UI tier
  # only, because spinning up EDDI plus a database per PR is minutes of runner
  # time for a signal that main will give within the hour.
  backend-tests:
    name: Backend E2E (${{ matrix.database }})
    runs-on: ubuntu-latest
    # No `schedule` arm: this workflow declares no `schedule:` trigger, so that
    # condition could never be true.
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        database: [mongodb, postgres]
        include:
          - database: mongodb
            compose-file: docker-compose.integration.yml
          - database: postgres
            compose-file: docker-compose.integration-postgres.yml
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      # This step used to assert the image was ALREADY on the runner, which is
      # never true on a fresh one — so every push to main failed here before
      # running a single test, and the E2E badge has been red for weeks while
      # telling us nothing. `labsai/eddi` is published publicly, so pull it.
      #
      # `EDDI_IMAGE_TAG` lets a workflow_dispatch pin a specific build (e.g.
      # 6.2.0-b764) instead of tracking `latest`.
      - name: Pull EDDI backend image
        env:
          EDDI_IMAGE: labsai/eddi:${{ inputs.eddi_image_tag || 'latest' }}
        run: |
          echo "Pulling $EDDI_IMAGE"
          if ! docker pull "$EDDI_IMAGE"; then
            echo "::error::Could not pull $EDDI_IMAGE from Docker Hub."
            echo "::error::Check the tag exists: https://hub.docker.com/r/labsai/eddi/tags"
            exit 1
          fi
          # The compose files reference labsai/eddi:latest, so alias a pinned tag.
          if [ "$EDDI_IMAGE" != "labsai/eddi:latest" ]; then
            docker tag "$EDDI_IMAGE" labsai/eddi:latest
          fi
          docker image inspect labsai/eddi:latest --format 'Using {{.RepoTags}} built {{.Created}}'

      - name: Start backend infrastructure (${{ matrix.database }})
        run: docker compose -f ${{ matrix.compose-file }} up -d --wait
        timeout-minutes: 5

      - name: Wait for EDDI health
        run: |
          echo "Waiting for EDDI backend to become healthy..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:7070/q/health/live | grep -q '"UP"'; then
              echo "Backend is healthy!"
              exit 0
            fi
            echo "  Attempt $i/60 — waiting..."
            sleep 2
          done
          echo "::error::Backend did not become healthy within 120s"
          docker compose -f ${{ matrix.compose-file }} logs eddi
          exit 1

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run integration tests (${{ matrix.database }})
        run: npm run test:e2e:integration

      - name: Run full-stack tests (${{ matrix.database }})
        run: npm run test:e2e:fullstack

      # AFTER the tests, and `always()`, because of what this step costs when it
      # fails. Steps stop at the first failure, so parked ahead of them a stale
      # snapshot took the integration AND full-stack tiers with it, on both
      # database legs — the entire backend signal, lost to a bookkeeping file.
      # It was put first because parked after a RED fullstack tier it never ran;
      # `if: always()` is the answer to that, not reordering.
      #
      # It compares the OPERATIONS only. The snapshot also records `eddiVersion`,
      # which the contract test asserts on (openapi-contract.test.ts) and which
      # therefore has to stay in the file — but the EDDI image tracks `latest`,
      # so a patch release with an identical API surface bumps that string and a
      # whole-file diff would report 'the EDDI API surface has changed' when it
      # provably has not.
      - name: Check the OpenAPI snapshot still matches this backend
        if: always()
        run: |
          node .github/scripts/refresh-openapi-operations.mjs
          if ! git diff --exit-code \
               -I '"eddiVersion"' \
               -- src/test/mocks/openapi-operations.json; then
            echo "::error::EDDI's API surface has changed and src/test/mocks/openapi-operations.json is stale."
            echo "::error::Run: npm run openapi:refresh against a local backend, then commit the result."
            exit 1
          fi
          echo "Snapshot operations match the running backend."


      - name: Collect backend logs
        if: ${{ !cancelled() }}
        run: docker compose -f ${{ matrix.compose-file }} logs > backend-logs.txt 2>&1

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: backend-e2e-report-${{ matrix.database }}
          path: |
            playwright-report/
            test-results.json
            backend-logs.txt
          retention-days: 14

      - name: Tear down infrastructure
        if: always()
        run: docker compose -f ${{ matrix.compose-file }} down -v
