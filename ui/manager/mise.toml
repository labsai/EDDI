[tools]
prettier = "latest"

[tasks.install]
description = "Install dependencies (at ui/, the npm workspaces root with the one lockfile)"
dir = "{{config_root}}/.."
run = "npm ci"

[tasks.dev]
description = "Start Vite dev server on http://localhost:5173"
run = "npm run dev"

[tasks.test]
description = "Run Vitest unit/component tests"
run = "npm run test"

[tasks.e2e]
description = "Run Playwright e2e tests"
run = "npm run test:e2e"

[tasks.build]
description = "Production build"
run = "npm run build"
