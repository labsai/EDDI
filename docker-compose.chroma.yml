services:
  chroma:
    image: chromadb/chroma:1.1.0
    restart: always
    # Bound to loopback: Chroma has no auth, so it must not be reachable off-box.
    # EDDI reaches it container-to-container as http://chroma:8000 regardless.
    ports:
      - "127.0.0.1:${CHROMA_PORT:-8000}:8000"
    volumes:
      - chroma-data:/chroma/chroma
    environment:
      - "ANONYMIZED_TELEMETRY=false"
      - "IS_PERSISTENT=TRUE"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v2/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  chroma-data:
