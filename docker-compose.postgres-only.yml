# EDDI with PostgreSQL (no MongoDB) — a COMPLETE stack, not an overlay.
# Used by: install.sh --db=postgres
#
#   docker compose -f docker-compose.postgres-only.yml up
#
# PostgreSQL serves as the sole database backend for all EDDI stores.
# Activated via QUARKUS_PROFILE=postgres which switches IResourceStorageFactory
# from MongoResourceStorageFactory to PostgresResourceStorageFactory.
#
# This replaces the old docker-compose.postgres.yml, which README.md documented
# as an overlay (`-f docker-compose.yml -f docker-compose.postgres.yml`). It
# could not work as one: `depends_on` is keyed by service, so the base's
# `mongodb: condition: service_healthy` merged in rather than being replaced, the
# base's MONGODB_CONNECTIONSTRING survived, and an overlay cannot un-declare a
# service in the first place — so the documented "PostgreSQL instead of MongoDB"
# command still pulled MongoDB, kept its volume, and would not start EDDI until
# mongod reported healthy. The two files were also drifted near-duplicates that
# both declared a volume called `pgdata`.

services:
  eddi:
    # Not a literal `:latest`: the old overlay hardcoded one, so an operator who
    # set EDDI_VERSION=6.2.0 to pin a release silently got latest anyway.
    image: labsai/eddi:${EDDI_VERSION:-latest}
    environment:
      QUARKUS_PROFILE: "${QUARKUS_PROFILE:-postgres}"
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/eddi
      QUARKUS_DATASOURCE_USERNAME: eddi
      # Required, with no default, like NATS_PASSWORD in docker-compose.cluster.yml:
      # this used to be the literal `eddi`, a database password shared by every
      # install that ever ran this file. The installers generate one into .env;
      # by hand: POSTGRES_PASSWORD=$(openssl rand -base64 24) docker compose ...
      QUARKUS_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD (openssl rand -base64 24)}"
      EDDI_DATASTORE_TYPE: "${EDDI_DATASTORE_TYPE:-postgres}"
      # Same defaults as docker-compose.yml, and read from the environment like
      # every other setting here: a literal "true" ignores the operator who set
      # these to "false" in .env, so the surface fails open against an explicit
      # instruction to keep it shut.
      EDDI_SECURITY_ALLOW_UNAUTHENTICATED: "${EDDI_SECURITY_ALLOW_UNAUTHENTICATED:-true}"
      EDDI_MCP_ALLOW_UNAUTHENTICATED: "${EDDI_MCP_ALLOW_UNAUTHENTICATED:-true}"
      EDDI_SECRETSTORE_ALLOW_UNAUTHENTICATED: "${EDDI_SECRETSTORE_ALLOW_UNAUTHENTICATED:-true}"
      # Host allow-list while authentication is off — see docker-compose.yml.
      EDDI_SECURITY_UNAUTHENTICATED_ALLOWED_HOSTS: "${EDDI_SECURITY_UNAUTHENTICATED_ALLOWED_HOSTS:-eddi}"
      EDDI_VAULT_MASTER_KEY: "${EDDI_VAULT_MASTER_KEY:-}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Bound to 127.0.0.1 by default, same reasoning as docker-compose.yml: EDDI
    # ships unauthenticated, so it must not be off-box reachable out of the box.
    # Set EDDI_BIND=0.0.0.0 in .env to expose it — after enabling auth.
    ports:
      - "${EDDI_BIND:-127.0.0.1}:${EDDI_PORT:-7070}:7070"
      # 7443 is Quarkus' HTTPS port. Nothing listens on it until a TLS certificate
      # is configured (docs/security.md, "TLS Directly in Quarkus") — the mapping is
      # here for that case and refuses connections otherwise.
      - "${EDDI_BIND:-127.0.0.1}:${EDDI_HTTPS_PORT:-7443}:7443"
    depends_on:
      postgres:
        condition: service_healthy
      bind-guard:
        condition: service_completed_successfully

  # Refuses to publish an UNAUTHENTICATED EDDI beyond loopback — the same
  # one-shot guard as docker-compose.yml's, which this whole stack used to lack:
  # EDDI_BIND=0.0.0.0 here published an open EDDI, MCP server and secrets vault.
  # ComposeStackTest keeps the three copies (docker-compose.yml, this file,
  # docker-compose.cluster.yml) identical apart from the image, and
  # docker-compose.auth.yml overrides it, so it must exist in every stack that
  # overlay is layered on. Runs on the postgres image this stack pulls anyway.
  bind-guard:
    image: postgres:16.15-alpine
    entrypoint: ["/bin/sh", "-c"]
    environment:
      - "EDDI_BIND=${EDDI_BIND:-127.0.0.1}"
      - "EDDI_SECURITY_ALLOW_UNAUTHENTICATED=${EDDI_SECURITY_ALLOW_UNAUTHENTICATED:-true}"
      - "EDDI_I_UNDERSTAND_PUBLIC=${EDDI_I_UNDERSTAND_PUBLIC:-false}"
    command:
      - |
        case "$$EDDI_BIND" in
          ""|127.0.0.1|localhost|::1|"[::1]") exit 0 ;;
        esac
        if [ "$$EDDI_SECURITY_ALLOW_UNAUTHENTICATED" != "true" ] || [ "$$EDDI_I_UNDERSTAND_PUBLIC" = "true" ]; then
          exit 0
        fi
        echo "" >&2
        echo "[SECURITY] Refusing to start: EDDI_BIND=$$EDDI_BIND would publish EDDI on a" >&2
        echo "  non-loopback interface while EDDI_SECURITY_ALLOW_UNAUTHENTICATED=true," >&2
        echo "  so every API endpoint — agents, conversations, the secrets vault, MCP —" >&2
        echo "  would be reachable from the network with no token at all." >&2
        echo "" >&2
        echo "  Turn authentication on first:" >&2
        echo "    EDDI_SECURITY_ALLOW_UNAUTHENTICATED=false   (in .env)" >&2
        echo "    QUARKUS_OIDC_TENANT_ENABLED=true" >&2
        echo "    docker compose -f docker-compose.yml -f docker-compose.auth.yml up" >&2
        echo "  or keep EDDI on loopback (EDDI_BIND=127.0.0.1, the default)." >&2
        echo "  To expose an UNAUTHENTICATED instance on purpose — an isolated network" >&2
        echo "  you alone can reach — set EDDI_I_UNDERSTAND_PUBLIC=true." >&2
        exit 1

  postgres:
    image: postgres:16.15-alpine
    restart: always
    environment:
      POSTGRES_DB: eddi
      POSTGRES_USER: eddi
      # Read by the postgres image at initdb only, against an empty volume — so
      # keep the value stable across runs (the installers persist it in .env).
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD (openssl rand -base64 24)}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eddi -d eddi"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
