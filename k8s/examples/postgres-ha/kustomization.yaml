# EDDI + PostgreSQL + production hardening — combined example
#
# ⚠️  This is NOT a horizontally scaled deployment. EDDI runs at exactly ONE
# replica: the per-conversation lock is JVM-local, so a second replica silently
# drops turns. See the comment on spec.replicas in k8s/base/eddi-deployment.yaml.
#
# NATS is deliberately no longer part of this example. The published
# labsai/eddi image is built without the `nats` Quarkus build profile, so the
# NATS coordinator bean does not exist in it and EDDI_MESSAGING_TYPE is read by
# no code — the component provisioned a JetStream StatefulSet with a 5Gi PVC
# that EDDI never connected to. If you build your own image with
# `-Dquarkus.profile=nats`, add `- ../../overlays/nats` under `components:`.
#
# Usage:
#   bash k8s/create-secrets.sh              # once, before the first apply
#   kubectl apply -k k8s/examples/postgres-ha/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: eddi

resources:
  # Standalone overlay — includes the base plus PostgreSQL
  - ../../overlays/postgres

components:
  # PDB, NetworkPolicy and the production resource limits.
  # NOTE: eddi-hpa.yaml is deliberately absent — see that file's header.
  - ../../overlays/production
