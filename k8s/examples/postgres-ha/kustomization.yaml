# EDDI + PostgreSQL + NATS — combined production example
#
# Production-ready: PostgreSQL backend with NATS JetStream for durable,
# ordered conversation messaging.
#
# ⚠️  This is NOT a horizontally scaled deployment. NATS gives EDDI durable
# ordering and dead-lettering, but the Callable still executes in the JVM that
# published it, and the per-conversation lock is JVM-local — so EDDI runs at
# exactly ONE replica regardless of messaging backend. See the comment on
# spec.replicas in k8s/base/eddi-deployment.yaml.
#
# Usage: kubectl apply -k k8s/examples/postgres-ha/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: eddi

resources:
  # PostgreSQL overlay (includes base + PostgreSQL)
  - ../../overlays/postgres

  # NATS for durable, ordered messaging
  - ../../overlays/nats/nats-statefulset.yaml
  - ../../overlays/nats/nats-service.yaml

  # Production hardening
  # NOTE: eddi-hpa.yaml is deliberately absent — see that file's header.
  - ../../overlays/production/eddi-pdb.yaml
  - ../../overlays/production/network-policy.yaml

patches:
  # Enable NATS messaging
  - target:
      kind: ConfigMap
      name: eddi-config
    patch: |
      - op: replace
        path: /data/EDDI_MESSAGING_TYPE
        value: "nats"
      - op: add
        path: /data/EDDI_NATS_URL
        value: "nats://nats:4222"
  # Production resource limits — scale UP, never OUT.
  - target:
      kind: Deployment
      name: eddi
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: "4"
            memory: 2Gi
      - op: replace
        path: /spec/replicas
        value: 1
