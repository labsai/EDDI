# EDDI + PostgreSQL + production hardening + cluster mode — combined example
#
# Three EDDI replicas behind the base's round-robin Service, coordinated through
# a three-node NATS JetStream cluster (../../overlays/nats): any replica serves
# any conversation, a replica can be lost or rolled without losing a turn, and
# the published image selects cluster mode at runtime. PostgreSQL itself is a
# single instance here; point EDDI at a replicated PostgreSQL for a database that
# survives a node loss too. See docs/clustering.md.
#
# Usage:
#   bash k8s/create-secrets.sh              # once, before the first apply
#   # The database password is no longer committed: create postgres-secrets
#   # with the command in k8s/overlays/postgres/postgres-secret.yaml.example.
#   kubectl apply -k k8s/examples/postgres-ha/
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: eddi

resources:
  # Standalone overlay — includes the base plus PostgreSQL
  - ../../overlays/postgres

components:
  # PDB, NetworkPolicy and the production resource limits.
  - ../../overlays/production
  # Cluster mode: NATS JetStream + 3 EDDI replicas. AFTER production, whose
  # replicas patch (1) it overrides.
  - ../../overlays/nats
