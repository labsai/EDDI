# ─────────────────────────────────────────────────────────────
# EDDI — Kubernetes Quickstart (All-in-One)
#
# Deploy EDDI + MongoDB with a single command:
#
#   kubectl apply -f https://raw.githubusercontent.com/labsai/EDDI/main/k8s/quickstart.yaml
#
# This manifest deliberately does NOT contain the eddi-secrets Secret. A Secret
# shipped here would be re-applied on every `kubectl apply -f`, overwriting the
# vault master key you generate below — and everything encrypted with the old
# key would become permanently undecryptable. So the EDDI pod stays in
# ContainerCreating until you create it, and starts by itself once it exists.
#
# Generate the vault master key. EDDI reads its secrets from a mounted FILE
# rather than environment variables (env is readable via /proc/<pid>/environ and
# leaks into crash dumps), so the Secret holds one properties file:
#
#   set -euo pipefail
#
#   # mktemp gives an unpredictable name created 0600, so another local user
#   # cannot pre-create the path or point it at a symlink.
#   secrets_file=$(mktemp "${TMPDIR:-/tmp}/eddi-secrets.XXXXXX")
#   trap 'shred -u "$secrets_file" 2>/dev/null || rm -f "$secrets_file"' EXIT
#
#   # Fail closed: an empty key would create a Secret that silently leaves the
#   # vault inert and secrets in plaintext.
#   key=$(openssl rand -base64 24)
#   [ -n "$key" ] || { echo "vault key generation failed" >&2; exit 1; }
#   printf 'eddi.vault.master-key=%s\n' "$key" > "$secrets_file"
#
#   # The Secret key must be named application-secrets.properties — that is the
#   # filename the Deployment mounts. A bare temp path would name it otherwise.
#   #
#   # --dry-run=client | kubectl apply keeps this idempotent: re-running it
#   # updates the Secret instead of failing with AlreadyExists.
#   kubectl create secret generic eddi-secrets \
#     --namespace=eddi \
#     --from-file=application-secrets.properties="$secrets_file" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# If EDDI was already running with a different key, restart it to pick the new
# one up (not needed on a first install — the pod is waiting for the Secret):
#
#   kubectl rollout restart deployment/eddi -n eddi
#
# Access EDDI:
#
#   kubectl port-forward svc/eddi 7070:7070 -n eddi
#   open http://localhost:7070
#
# ─────────────────────────────────────────────────────────────

# --- Namespace ---
apiVersion: v1
kind: Namespace
metadata:
  name: eddi
  labels:
    app.kubernetes.io/part-of: eddi

---
# --- ConfigMap ---
apiVersion: v1
kind: ConfigMap
metadata:
  name: eddi-config
  namespace: eddi
  labels:
    app.kubernetes.io/name: eddi
    app.kubernetes.io/component: server
data:
  EDDI_DATASTORE_TYPE: "mongodb"
  MONGODB_CONNECTIONSTRING: "mongodb://mongodb:27017/eddi?retryWrites=true&w=majority&connectTimeoutMS=10000&socketTimeoutMS=30000"
  EDDI_MESSAGING_TYPE: "in-memory"
  QUARKUS_HTTP_CORS_ORIGINS: "http://localhost:3000,http://localhost:7070"
  QUARKUS_OIDC_TENANT_ENABLED: "false"

  # Authentication escape hatches. OIDC is off by default in this quickstart, and
  # AuthStartupGuard refuses a production boot in that state without an explicit
  # opt-out — so these three are what make the manifest actually start. The MCP
  # endpoint and the secrets vault need their OWN opt-in on top of the first flag:
  # inheriting it must not be enough to expose agent CRUD or vault writes.
  # Set all three to "false" and QUARKUS_OIDC_TENANT_ENABLED to "true" for anything
  # reachable from outside the cluster.
  EDDI_SECURITY_ALLOW_UNAUTHENTICATED: "true"
  EDDI_MCP_ALLOW_UNAUTHENTICATED: "true"
  EDDI_SECRETSTORE_ALLOW_UNAUTHENTICATED: "true"

---
# --- EDDI Secret ---
#
# Intentionally absent. Create eddi-secrets out-of-band with the command in the
# header above; it holds one key, "application-secrets.properties", mounted at
# /etc/eddi/secrets and loaded through QUARKUS_CONFIG_LOCATIONS. Shipping it
# here would make every re-apply of this file destroy the operator's vault
# master key.

---
# --- MongoDB Service ---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: eddi
  labels:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: eddi
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/component: database
  ports:
    - name: mongo
      port: 27017
      targetPort: mongo

---
# --- MongoDB StatefulSet ---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: eddi
  labels:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: eddi
spec:
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mongodb
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mongodb
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: eddi
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: mongodb
          image: mongo:7.0
          ports:
            - containerPort: 27017
              name: mongo
          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            exec:
              command: ["mongosh", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 5
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: mongodb-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi

---
# --- EDDI Service ---
apiVersion: v1
kind: Service
metadata:
  name: eddi
  namespace: eddi
  labels:
    app.kubernetes.io/name: eddi
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: eddi
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: eddi
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: 7070
      targetPort: http

---
# --- EDDI Deployment ---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eddi
  namespace: eddi
  labels:
    app.kubernetes.io/name: eddi
    app.kubernetes.io/version: "6.3.0"
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: eddi
spec:
  # ⚠️  MUST stay 1 — EDDI serialises conversation turns with a JVM-local lock,
  # so a second replica silently loses writes. See k8s/base/eddi-deployment.yaml.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: eddi
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eddi
        app.kubernetes.io/version: "6.3.0"
        app.kubernetes.io/component: server
        app.kubernetes.io/part-of: eddi
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "7070"
        prometheus.io/path: "/q/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 185
        runAsGroup: 185
        fsGroup: 185
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      volumes:
        - name: eddi-secrets
          projected:
            defaultMode: 0400
            sources:
              - secret:
                  name: eddi-secrets
        # Writable scratch required by readOnlyRootFilesystem:
        #   /tmp             java.io.tmpdir (upload buffer, PDF extraction)
        #   /deployments/tmp agent export/import scratch
        #   /opt/eddi/data   audit ledger dead-letter file
        - name: tmp
          emptyDir: {}
        - name: deployments-tmp
          emptyDir: {}
        - name: eddi-data
          emptyDir: {}
      containers:
        - name: eddi
          # Immutable patch tag, not the mutable ":6". Append @sha256:<digest>
          # after `cosign verify`ing the release to pin exactly what CI signed.
          image: labsai/eddi:6.3.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 185
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 7070
              name: http
              protocol: TCP
          env:
            - name: QUARKUS_CONFIG_LOCATIONS
              value: /etc/eddi/secrets/application-secrets.properties
          envFrom:
            - configMapRef:
                name: eddi-config
          volumeMounts:
            - name: eddi-secrets
              mountPath: /etc/eddi/secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: deployments-tmp
              mountPath: /deployments/tmp
            - name: eddi-data
              mountPath: /opt/eddi/data
          startupProbe:
            httpGet:
              path: /q/health/ready
              port: http
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "2"
              memory: 1Gi
