# Production hardening component
# Applies: PDB, NetworkPolicy, and tighter resource limits
#
# ⚠️  This is a kustomize COMPONENT, not a standalone overlay. `kubectl apply -k`
# on this directory does not work by design. Reference it from a kustomization
# that already includes the base:
#
#   resources:
#     - ../../overlays/postgres
#   components:
#     - ../../overlays/production
#
# It used to be `kind: Kustomization`, which made the patches below silent
# no-ops: a directory under `resources:` is built as its own root first, so the
# patches targeted a resource set with no eddi Deployment in it — and kustomize
# exits 0 on a patch that matches nothing. Operators got the PDB and the
# NetworkPolicy but kept the development resource limits.
#
# No HorizontalPodAutoscaler here: with the base's in-memory messaging EDDI is
# single-replica (see the comment on spec.replicas in
# k8s/base/eddi-deployment.yaml). In cluster mode — the ../nats component, listed
# AFTER this one so its replicas patch wins — eddi-hpa.yaml in this directory
# can be added to your own kustomization's resources.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - eddi-pdb.yaml
  - network-policy.yaml

patches:
  # SSRF protection for agent-configured outbound calls (httpcalls, A2A peer
  # fetch). EDDI's own default is off so a self-hosted install can reach internal
  # APIs; a production deployment should not leave an agent config able to point
  # at loopback, the pod network or the node's metadata service. The allow-list
  # keeps the Platform Operator's calls to EDDI's own API (127.0.0.1:7070) and the
  # reference agent's (localhost:7070, matched as exact host text) working; add the
  # internal hosts your httpcalls need (host or host:port, comma-separated), or
  # set the flag to "false" if every agent author is as trusted as you are.
  # See docs/security.md, "SSRF Protection".
  - target:
      kind: ConfigMap
      name: eddi-config
    patch: |
      - op: add
        path: /data/EDDI_SECURITY_SSRF_PROTECTION_ENABLED
        value: "true"
      - op: add
        path: /data/EDDI_SECURITY_SSRF_PROTECTION_ALLOWED_HOSTS
        value: "127.0.0.1:7070,localhost:7070"
  # Bump resource limits for production
  - target:
      kind: Deployment
      name: eddi
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: "2"
            memory: 4Gi
          limits:
            cpu: "4"
            memory: 4Gi
      # Scale UP, not OUT, with in-memory messaging: its conversation lock is
      # JVM-local. The ../nats component overrides this with 3 replicas in
      # cluster mode when it is listed after this component.
      - op: replace
        path: /spec/replicas
        value: 1
