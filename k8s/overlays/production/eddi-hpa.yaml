# HorizontalPodAutoscaler for EDDI — CLUSTER MODE ONLY
#
# Not referenced by any kustomization. Add it to the `resources:` of your own
# kustomization only together with the cluster-mode component (../nats): with
# in-memory messaging EDDI serialises the turns of a conversation with a
# JVM-local lock, so a second replica would run two turns of one conversation
# at once. In cluster mode every replica coordinates through NATS JetStream and
# scaling out is safe (docs/clustering.md). Needs metrics-server.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: eddi
  labels:
    app.kubernetes.io/name: eddi
    app.kubernetes.io/part-of: eddi
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: eddi
  # At least two, so losing a pod never leaves zero replicas serving.
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
