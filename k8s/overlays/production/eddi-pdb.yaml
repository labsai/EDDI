# PodDisruptionBudget — bound voluntary disruption of EDDI
#
# maxUnavailable, NOT minAvailable: with in-memory messaging EDDI runs at
# exactly 1 replica (see k8s/base/eddi-deployment.yaml), and `minAvailable: 1`
# against a single replica means the eviction API can never succeed, so
# `kubectl drain` hangs forever and node maintenance is blocked.
# `maxUnavailable: 1` keeps the pod protected from concurrent disruption while
# still allowing a drain to proceed — and in cluster mode (../nats, 3 replicas)
# it keeps two of the three serving during a drain.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: eddi
  labels:
    app.kubernetes.io/name: eddi
    app.kubernetes.io/part-of: eddi
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: eddi
      app.kubernetes.io/component: server
