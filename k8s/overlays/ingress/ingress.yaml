# EDDI Ingress — vendor-neutral, works with nginx, Traefik, HAProxy, etc.
#
# Customize:
#   - Set your hostname in spec.rules[].host
#   - Uncomment TLS section for HTTPS
#   - Change ingressClassName to match your cluster's Ingress controller
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eddi
  labels:
    app.kubernetes.io/name: eddi
    app.kubernetes.io/part-of: eddi
  annotations:
    # nginx-ingress controller defaults (ignored by other controllers)
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
    # SSE support — required for streaming responses
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  # Uncomment and set to your Ingress controller's class name:
  # ingressClassName: nginx
  rules:
    - host: eddi.example.com
      http:
        paths:
          # The Manager UI needs no rule of its own: EDDI serves it from this
          # same Service at /manage (IRestManagerResource). There used to be a
          # commented-out rule here sending /manage to a separate eddi-manager
          # Service — following it took the real Manager, and the
          # /manage/__auth_config__.js endpoint that tells the SPA where
          # Keycloak is, off the ingress entirely.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: eddi
                port:
                  name: http
  # Uncomment for TLS:
  # tls:
  #   - hosts:
  #       - eddi.example.com
  #     secretName: eddi-tls
