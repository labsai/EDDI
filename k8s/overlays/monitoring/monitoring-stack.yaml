# Prometheus ConfigMap — scrape config for EDDI
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: eddi
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: 'eddi'
        metrics_path: '/q/metrics'
        # With authentication on (the auth component), /q/metrics answers 401
        # to an anonymous scrape and this target shows DOWN. Either give
        # Prometheus a token — uncomment ONE of the blocks below — or, with
        # /q/metrics unreachable from outside the cluster, set
        # EDDI_METRICS_HTTP_POLICY=permit on EDDI (eddi.metrics.http-policy).
        # docs/monitoring/monitoring-guide.md ("Scraping with authentication
        # on") walks through both.
        #
        # a) OAuth2 client credentials — Prometheus fetches and refreshes the
        #    token itself. The client needs a service account, the
        #    eddi-backend audience mapper and the openid scope (EDDI calls
        #    userinfo on every request):
        # oauth2:
        #   client_id: eddi-metrics
        #   client_secret_file: /etc/prometheus/secrets/client-secret
        #   token_url: http://keycloak:8080/realms/eddi/protocol/openid-connect/token
        #   scopes: [openid]
        #
        # b) A bearer token you rotate yourself:
        # authorization:
        #   credentials_file: /etc/prometheus/secrets/token
        kubernetes_sd_configs:
          - role: pod
            # own_namespace, not a literal name: kustomize's namespace
            # transformer rewrites metadata.namespace but NOT the contents of a
            # ConfigMap payload, so a hardcoded "eddi" here made Prometheus
            # scrape zero targets — silently — for anyone who changed
            # `namespace:` in their kustomization.
            namespaces:
              own_namespace: true
        relabel_configs:
          # Keep only pods with the EDDI label
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            action: keep
            regex: eddi
          # Use pod IP + Prometheus port annotation to build the scrape address.
          #
          # No `separator:` override. `separator` is the string placed BETWEEN
          # concatenated source label values and defaults to ";" — setting it to
          # ":" made the input "10.1.2.3:7070", which the regex below (which
          # requires a literal ";") could never match, so the rule was a no-op.
          # It looked like it worked only because role:pod already defaults
          # __address__ to podIP:containerPort and the single declared container
          # port happens to equal the prometheus.io/port annotation.
          - source_labels: [__meta_kubernetes_pod_ip, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            target_label: __address__
            regex: (.+);(.+)
            replacement: $1:$2
          # Use the Prometheus path annotation
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          # Only scrape pods that opt in
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: "true"
---
# Prometheus ServiceAccount — required for pod discovery via kubernetes_sd_configs
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: eddi
---
# RBAC — a namespaced Role, not a ClusterRole.
#
# The scrape config discovers pods in its OWN namespace only
# (kubernetes_sd_configs → namespaces.own_namespace), so read access to pods,
# services and endpoints cluster-wide was never used — it just meant that
# anything able to act as this ServiceAccount could enumerate every workload
# in the cluster. kustomize's namespace transformer sets metadata.namespace on
# both objects below and on the subject, so a renamed namespace keeps working.
#
# ⚠️  UPGRADING: `kubectl apply -k` does not prune, so the old cluster-scoped
# objects stay behind until you delete them:
#   kubectl delete clusterrolebinding eddi-prometheus
#   kubectl delete clusterrole eddi-prometheus
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eddi-prometheus
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: eddi
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eddi-prometheus
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: eddi
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eddi-prometheus
subjects:
  - kind: ServiceAccount
    name: prometheus
    namespace: eddi
---
# Prometheus Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: eddi
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
      app.kubernetes.io/component: monitoring
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/component: monitoring
        app.kubernetes.io/part-of: eddi
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v2.53.0
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.retention.time=30d"
          ports:
            - containerPort: 9090
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}
---
# Prometheus Service
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: monitoring
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: monitoring
  ports:
    - name: http
      port: 9090
      targetPort: http
---
# Grafana datasource provisioning
#
# Without this the component shipped half of what it advertises: a Grafana with
# no datasource at all, which an operator had to point at Prometheus by hand —
# work then destroyed by the next restart, because storage below is an emptyDir.
# Declarative provisioning survives the restart, which is why it is a ConfigMap
# rather than a PVC.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: eddi
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        # The Prometheus Service declared above, resolved in-namespace.
        url: http://prometheus:9090
        isDefault: true
        editable: false
---
# Grafana Deployment
#
# ⚠️  CREATE THE GRAFANA ADMIN SECRET FIRST — the pod does not start without it.
# GF_SECURITY_ADMIN_PASSWORD used to be the literal "admin", on a Service any
# pod in the namespace can reach:
#
#   kubectl create secret generic grafana-admin -n eddi \
#     --from-literal=password="$(openssl rand -base64 24)"
#
# Without it the pod stays in CreateContainerConfigError with
# `secret "grafana-admin" not found`.
#
# Note: Uses emptyDir for storage — dashboards created in the UI and the metric
# cache are not persistent. The datasource IS, because it is provisioned from
# the ConfigMap above; add dashboards the same way (a ConfigMap mounted at
# /etc/grafana/provisioning/dashboards) rather than reaching for a PVC.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: eddi
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
      app.kubernetes.io/component: monitoring
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/component: monitoring
        app.kubernetes.io/part-of: eddi
    spec:
      # Grafana never calls the Kubernetes API (Prometheus does — its
      # ServiceAccount keeps its token for pod discovery).
      automountServiceAccountToken: false
      containers:
        - name: grafana
          image: grafana/grafana:11.1.0
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            # No default and not optional: a missing Secret fails closed.
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-admin
                  key: password
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
          volumeMounts:
            - name: grafana-data
              mountPath: /var/lib/grafana
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: grafana-data
          emptyDir: {}
        - name: grafana-datasources
          configMap:
            name: grafana-datasources
---
# Grafana Service
apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: monitoring
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: monitoring
  ports:
    - name: http
      port: 3000
      targetPort: http
