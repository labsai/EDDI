# Monitoring component — Prometheus + Grafana
#
# ⚠️  This is a kustomize COMPONENT, not a standalone overlay. `kubectl apply -k`
# on this directory does not work by design. Reference it from a kustomization
# that already includes the base:
#
#   resources:
#     - ../../overlays/mongodb
#   components:
#     - ../../overlays/monitoring
#
# ⚠️  CREATE THE GRAFANA ADMIN SECRET FIRST — Grafana does not start without it
# (it used to run as admin/admin):
#
#   kubectl create secret generic grafana-admin -n eddi \
#     --from-literal=password="$(openssl rand -base64 24)"
#
# ⚠️  Upgrading: Prometheus now has a namespaced Role instead of a ClusterRole.
# `kubectl apply -k` does not prune, so delete the old ones by hand:
#   kubectl delete clusterrolebinding eddi-prometheus
#   kubectl delete clusterrole eddi-prometheus
#
# With the auth component, EDDI's /q/metrics needs a token — see the scrape
# config in monitoring-stack.yaml.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - monitoring-stack.yaml

# The alert rules and the dashboards, generated from copies of docs/monitoring/
# (kustomize reads no file outside this directory). Refresh the copies with
#   python scripts/sync-monitoring-assets.py
# DeploymentManifestsTest fails when they drift from docs/monitoring/.
#
# kustomize appends a content hash to each name and rewrites the references in
# monitoring-stack.yaml, so editing a rule or a dashboard rolls the pod that
# mounts it.
#
# The Full Metrics Reference ConfigMap is ~230 KB once escaped, close to the
# 256 KiB limit of the last-applied-configuration annotation that client-side
# `kubectl apply` writes. If a later dashboard pushes it over, apply with
# `kubectl apply --server-side -k`, which keeps no such annotation.
configMapGenerator:
  - name: prometheus-rules
    files:
      - eddi-alerts.yml
  - name: grafana-dashboard-operations
    files:
      - dashboards/eddi-operations-dashboard.json
  - name: grafana-dashboard-full-metrics
    files:
      - dashboards/eddi-full-metrics-dashboard.json
  - name: grafana-dashboard-observability
    files:
      - dashboards/eddi-grafana-dashboard.json
