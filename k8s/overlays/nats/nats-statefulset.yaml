# NATS JetStream — three nodes routed into one cluster, for EDDI cluster mode.
# R3 streams and buckets keep working while any one node is down. Clients and
# routes authenticate (nats-config.yaml, credentials from the `nats-auth`
# Secret); TLS is not configured here — use the Helm chart's nats.tls, or patch
# a tls {} block in, where the network itself is not trusted.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
  labels:
    app.kubernetes.io/name: nats
    app.kubernetes.io/component: messaging
    app.kubernetes.io/part-of: eddi
spec:
  serviceName: nats
  replicas: 3
  # Start all nodes at once: each waits for its routes, and an ordered start
  # would hold node 1 until node 0 is Ready, which needs a quorum it cannot
  # have alone.
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: nats
      app.kubernetes.io/component: messaging
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nats
        app.kubernetes.io/component: messaging
        app.kubernetes.io/part-of: eddi
    spec:
      # NATS never calls the Kubernetes API, so the pod does not mount the
      # service account token — nothing to steal for a process that gets in.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # One NATS pod per node, so a node failure costs at most one of the three and
      # R3 keeps quorum (a cluster with fewer than three nodes leaves a pod
      # Pending: patch this to preferredDuringScheduling for a dev cluster), and
      # spread over zones where there are any.
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: nats
                  app.kubernetes.io/component: messaging
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: nats
              app.kubernetes.io/component: messaging
      containers:
        - name: nats
          # A full patch version pinned by digest, like every third-party image
          # the repository ships.
          image: nats:2.11.17-alpine@sha256:e4bf19f15fd3218814a4e3c9e0064e1334bd8aa20d5984b9f1a0afd084f8cc00
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # Read by nats.conf ($NATS_EDDI_PASSWORD, $NATS_ROUTE_PASSWORD) and by the
            # --routes argument below. A missing Secret keeps the pod from starting.
            - name: NATS_EDDI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nats-auth
                  key: eddi-password
            - name: NATS_ROUTE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nats-auth
                  key: route-password
            # A soft heap limit below the 512Mi memory limit: the Go GC works harder
            # before the kernel OOM-kills the pod.
            - name: GOMEMLIMIT
              value: "460MiB"
          args:
            - "--config=/etc/nats/nats.conf"
            # Outgoing routes carry the route credentials (hex, so URL-safe).
            - "--routes=nats://route:$(NATS_ROUTE_PASSWORD)@nats-0.nats:6222,nats://route:$(NATS_ROUTE_PASSWORD)@nats-1.nats:6222,nats://route:$(NATS_ROUTE_PASSWORD)@nats-2.nats:6222"
          ports:
            - containerPort: 4222
              name: client
            - containerPort: 6222
              name: cluster
            - containerPort: 8222
              name: monitoring
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: nats-data
              mountPath: /data
            - name: nats-config
              mountPath: /etc/nats
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # Strict at start-up only. A rolling update restarts one NATS node at a time
          # and must not touch the next until the restarted one has caught up its R3
          # streams: readiness waits for that (js-server-only), and liveness only
          # checks that JetStream is enabled, so a node that is still catching up is
          # never killed for it.
          startupProbe:
            httpGet:
              path: /healthz
              port: monitoring
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /healthz?js-enabled-only=true
              port: monitoring
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz?js-server-only=true
              port: monitoring
            periodSeconds: 10
      volumes:
        - name: nats-config
          configMap:
            name: nats-config
  volumeClaimTemplates:
    - metadata:
        name: nats-data
        labels:
          app.kubernetes.io/name: nats
          app.kubernetes.io/component: messaging
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
