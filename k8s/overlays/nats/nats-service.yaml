# NATS headless Service: gives every node a stable name (nats-0.nats, …) for
# the client URL list and the cluster routes.
apiVersion: v1
kind: Service
metadata:
  name: nats
  labels:
    app.kubernetes.io/name: nats
    app.kubernetes.io/component: messaging
    app.kubernetes.io/part-of: eddi
spec:
  type: ClusterIP
  clusterIP: None
  # Routes must resolve before a peer is Ready, or the cluster never forms.
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: nats
    app.kubernetes.io/component: messaging
  ports:
    - name: client
      port: 4222
      targetPort: client
    - name: cluster
      port: 6222
      targetPort: cluster
    - name: monitoring
      port: 8222
      targetPort: monitoring
