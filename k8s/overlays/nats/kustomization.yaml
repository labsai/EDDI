# Cluster mode component: a three-node NATS JetStream cluster, and EDDI patched
# to run three replicas coordinated through it.
#
# ⚠️  This is a kustomize COMPONENT, not a standalone overlay. `kubectl apply -k`
# on this directory does not work by design. Reference it from a kustomization
# that already includes the base — and list it AFTER the production component,
# whose replicas patch (1) it overrides:
#
#   resources:
#     - ../../overlays/postgres
#   components:
#     - ../../overlays/production
#     - ../../overlays/nats
#
# k8s/examples/postgres-ha is exactly that composition.
#
# The published labsai/eddi image selects cluster mode at RUNTIME from
# EDDI_MESSAGING_TYPE; no special build is needed. Every replica takes a
# cluster-wide lease per conversation from NATS, so the turns of a conversation
# never overlap whichever pod receives them, and a pod that lost its lease cannot
# overwrite the turn that ran after it (fencing). The plain round-robin Service
# from the base is all the load balancing it needs. Operator guide:
# docs/clustering.md.
#
# Security: clients and routes authenticate. Create the credentials BEFORE you
# apply (the NATS pods do not start without them), hex so that they are URL-safe:
#
#   EDDI_NATS_PW=$(openssl rand -hex 24)
#   kubectl create secret generic nats-auth \
#     --from-literal=eddi-password="$EDDI_NATS_PW" \
#     --from-literal=route-password="$(openssl rand -hex 24)"
#
# and add the same EDDI password to eddi-secrets' application-secrets.properties:
#
#   eddi.nats.username=eddi
#   eddi.nats.password=<EDDI_NATS_PW>
#
# The EDDI user may touch EDDI's subjects only and never delete a stream. The
# NATS client port also accepts the EDDI pods only (NetworkPolicy), and the
# routes port only the other NATS pods. TLS is not configured by this component:
# the Helm chart does it (nats.tls), or patch a tls {} block into nats-config.
#
# Recommended for production, and set below: EDDI_CLUSTER_DEGRADED_TURNS=reject —
# while NATS is unreachable a turn is answered 409 + Retry-After rather than run
# unfenced (docs/clustering.md, "Degraded mode").
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - nats-config.yaml
  - nats-statefulset.yaml
  - nats-service.yaml
  - nats-networkpolicy.yaml
  - nats-pdb.yaml

patches:
  - target:
      kind: ConfigMap
      name: eddi-config
    patch: |
      - op: replace
        path: /data/EDDI_MESSAGING_TYPE
        value: "nats"
      # All three servers: the client fails over without waiting for DNS.
      - op: add
        path: /data/EDDI_NATS_URL
        value: "nats://nats-0.nats:4222,nats://nats-1.nats:4222,nats://nats-2.nats:4222"
      # R3 buckets and streams: they survive the loss of one NATS node.
      - op: add
        path: /data/EDDI_NATS_REPLICAS
        value: "3"
      # While NATS is unreachable, refuse turns (409 + Retry-After) rather than run
      # them unfenced.
      - op: add
        path: /data/EDDI_CLUSTER_DEGRADED_TURNS
        value: "reject"
      # A terminating pod lets its running turns finish (65 s), inside the
      # 75 s termination grace set below.
      - op: add
        path: /data/EDDI_SHUTDOWN_DRAIN_TIMEOUT_SECONDS
        value: "65"
  - target:
      kind: Deployment
      name: eddi
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
      # A rolling update is safe in cluster mode: the old and the new pod
      # coordinate through NATS like any two replicas.
      - op: replace
        path: /spec/strategy
        value:
          type: RollingUpdate
          rollingUpdate:
            maxSurge: 1
            maxUnavailable: 0
      - op: replace
        path: /spec/template/spec/terminationGracePeriodSeconds
        value: 75
      # Requests the endpoint controller has not yet steered away are still
      # served while the pod leaves the Service (5 s), then SIGTERM drains it:
      # 5 s + 3 s readiness grace + 65 s drain fit the 75 s grace.
      - op: add
        path: /spec/template/spec/containers/0/lifecycle
        value:
          preStop:
            exec:
              command: ["sleep", "5"]
      # Each replica's node id is its pod name: unique, and stable for the
      # pod's lifetime.
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: EDDI_CLUSTER_NODE_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
      - op: add
        path: /spec/template/spec/topologySpreadConstraints
        value:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: eddi
                app.kubernetes.io/component: server
