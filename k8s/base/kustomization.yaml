# EDDI — Base Kustomize configuration
# Usage: kubectl apply -k k8s/base/
#
# This deploys EDDI only (no database).
# For a complete stack, use one of the overlays:
#   kubectl apply -k k8s/overlays/mongodb/
#   kubectl apply -k k8s/overlays/postgres/
#
# ⚠️  Create the eddi-secrets Secret FIRST — `bash k8s/create-secrets.sh`.
# It is deliberately not a resource here: a Secret that kustomize reconciles
# would overwrite the operator's vault master key with a placeholder on every
# re-apply, and everything encrypted with the old key would become
# undecryptable. See eddi-secret.yaml.example.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: eddi

resources:
  - namespace.yaml
  - eddi-configmap.yaml
  - eddi-deployment.yaml
  - eddi-service.yaml

commonAnnotations:
  app.kubernetes.io/managed-by: kustomize

# The EDDI release this base deploys. This file is the only place in k8s/base
# that names it — the tag, the version label, and the two example commands just
# below — and `python scripts/bump-version.py release <version>` moves all four
# together. ReleaseVersionSourceTest fails the build if any of them disagrees
# with helm/eddi/Chart.yaml's appVersion.
#
# Pin an immutable patch version, never the mutable major tag: with ":6" +
# IfNotPresent nothing ties the running bits to the digest CI cosign-signed and
# SLSA-attested. Strongest form — resolve and pin the digest at rollout time:
#   cosign verify \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     --certificate-identity-regexp '^https://github\.com/labsai/EDDI/\.github/workflows/ci\.yml@refs/(heads/main|tags/.+)$' \
#     labsai/eddi:6.5.0
#   crane digest labsai/eddi:6.5.0   # → sha256:...
# then add it to the entry below as:  digest: sha256:<digest>
images:
  - name: labsai/eddi
    newTag: "6.5.0"

# app.kubernetes.io/version on every base resource — the Namespace, ConfigMap
# and Service as well as the Deployment and its pod template. That is on
# purpose: it is the label the Kubernetes recommended-labels scheme defines for
# "the release of the application this object belongs to", and each of these is
# EDDI's. Every upgrade relabels them, which is metadata only. Selectors are left
# alone: a Deployment selector naming the version would turn every upgrade into
# an immutable-field error, and a Service selector would stop matching the pods
# of the release being rolled out.
labels:
  - pairs:
      app.kubernetes.io/version: "6.5.0"
    includeSelectors: false
    includeTemplates: true
