# EDDI Server Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eddi
  labels:
    app.kubernetes.io/name: eddi
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: eddi
spec:
  # ⚠️  1 with the base's in-memory messaging — do NOT scale this Deployment
  # horizontally on its own.
  #
  # With EDDI_MESSAGING_TYPE=in-memory EDDI serialises the turns of a
  # conversation with a JVM-LOCAL lock, and keeps replay nonces, rate limits and
  # caches in the JVM. Two replicas would run two turns of one conversation at
  # once in different JVMs, and the slower writer would overwrite the other's
  # turn.
  #
  # To run more than one replica, add the cluster-mode component
  # (../overlays/nats): it deploys a three-node NATS JetStream cluster, switches
  # EDDI to EDDI_MESSAGING_TYPE=nats and sets 3 replicas. In cluster mode every
  # replica takes a cluster-wide lease per conversation, so any pod may serve any
  # conversation behind this plain round-robin Service. See docs/clustering.md.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: eddi
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eddi
        app.kubernetes.io/component: server
        app.kubernetes.io/part-of: eddi
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "7070"
        prometheus.io/path: "/q/metrics"
    spec:
      # EDDI never calls the Kubernetes API, so the pod does not mount the
      # service account token — nothing to steal for a process that gets in.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 185
        runAsGroup: 185
        fsGroup: 185
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      volumes:
        # Secrets are mounted as files instead of being injected as env vars:
        # environ is world-readable via /proc/<pid>/environ for anything sharing
        # the PID namespace, and env leaks into crash dumps and child processes.
        # The Secret holds ONE key, "application-secrets.properties", whose value
        # is a Quarkus properties file; QUARKUS_CONFIG_LOCATIONS below points the
        # config system at it.
        - name: eddi-secrets
          projected:
            defaultMode: 0400
            sources:
              - secret:
                  name: eddi-secrets
        # readOnlyRootFilesystem needs explicit writable scratch space.
        # What the app actually writes at runtime:
        #   /tmp                 java.io.tmpdir — Quarkus multipart upload buffer
        #                        and PdfReaderTool's Files.createTempFile
        #   /deployments/tmp     agent export/import scratch (RestExportService /
        #                        RestImportService build it under ${user.dir}/tmp)
        #   /opt/eddi/data       audit ledger dead-letter file (eddi.audit.dead-letter-path)
        - name: tmp
          emptyDir: {}
        - name: deployments-tmp
          emptyDir: {}
        - name: eddi-data
          emptyDir: {}
      containers:
        - name: eddi
          # The tag is NOT set here. kustomization.yaml's `images:` entry pins it
          # (and, optionally, the digest), so a release moves one line instead
          # of several. The placeholder is deliberately a tag that does not
          # exist: applying this file without kustomize fails with ErrImagePull
          # rather than silently running whatever `latest` happens to be.
          image: labsai/eddi:pinned-by-kustomization
          imagePullPolicy: IfNotPresent
          # Container-level hardening — without this the pod is rejected outright
          # by a namespace running the "restricted" Pod Security Standard.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 185
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 7070
              name: http
              protocol: TCP
          env:
            # Load secrets from the mounted properties file rather than env vars.
            - name: QUARKUS_CONFIG_LOCATIONS
              value: /etc/eddi/secrets/application-secrets.properties
          envFrom:
            - configMapRef:
                name: eddi-config
          volumeMounts:
            - name: eddi-secrets
              mountPath: /etc/eddi/secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: deployments-tmp
              mountPath: /deployments/tmp
            - name: eddi-data
              mountPath: /opt/eddi/data
          # Startup probe: allow up to 60s for the process to come up. It checks
          # liveness, not readiness: readiness stays false while the startup
          # migrations run, which on the first boot of an EDDI 5 database can take
          # minutes, and a startup probe on readiness killed the pod mid-migration.
          startupProbe:
            httpGet:
              path: /q/health/live
              port: http
            failureThreshold: 30
            periodSeconds: 2
          # Liveness: restart if the process is stuck
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          # Readiness: gate traffic until fully ready
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: "2"
              memory: 1Gi
