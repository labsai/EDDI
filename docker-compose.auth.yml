# Keycloak authentication overlay for EDDI
# Used by: install.sh --with-auth
#
# Usage: docker compose -f docker-compose.yml -f docker-compose.auth.yml up -d
#
# keycloak/eddi-realm.json seeds three accounts, and NONE of them has a
# password:
#   eddi    (eddi-admin + eddi-editor + eddi-viewer)
#   viewer  (eddi-viewer — read-only)
#   user    (eddi-user — end-user access)
# They used to ship as eddi/eddi, viewer/viewer and user/user — and the same
# realm file is imported into Kubernetes by k8s/overlays/auth and by the Helm
# chart, where the Keycloak Service is reachable from every pod in the
# cluster, so guessable logins were not confined to a laptop. The password grant
# on the public eddi-frontend client is off for the same reason. Set a password
# for whichever account you need after first boot (install.sh does it for
# `eddi`, and for the other two with --demo-users):
#
#   http://localhost:${KEYCLOAK_PORT:-8180}/admin → Users → eddi
#     → Credentials → Set password
#
# (log in there as the KC_BOOTSTRAP_ADMIN_USERNAME/PASSWORD pair below).

services:
  # Every base stack's bind-guard (docker-compose.yml,
  # docker-compose.postgres-only.yml — ComposeStackTest renders both with this
  # overlay) refuses a non-loopback EDDI_BIND while
  # EDDI_SECURITY_ALLOW_UNAUTHENTICATED is "true". It reads the flag from its
  # OWN environment (compose interpolation of the .env / shell value), so the
  # override on the eddi service below does not reach it — tell it here that
  # this overlay turns authentication on, or EDDI_BIND=0.0.0.0 with Keycloak
  # would be refused although it is exactly the documented way to expose EDDI.
  bind-guard:
    environment:
      EDDI_SECURITY_ALLOW_UNAUTHENTICATED: "false"

  eddi:
    environment:
      QUARKUS_OIDC_TENANT_ENABLED: "true"
      # Close the quick-start escape hatch that docker-compose.yml leaves open:
      # with this overlay every endpoint is behind Keycloak, so AuthStartupGuard
      # must not be told to tolerate an unauthenticated deployment.
      EDDI_SECURITY_ALLOW_UNAUTHENTICATED: "false"
      # Backend uses Docker-internal hostname to reach Keycloak container
      QUARKUS_OIDC_AUTH_SERVER_URL: "http://keycloak:8080/realms/eddi"
      QUARKUS_OIDC_CLIENT_ID: "eddi-backend"
      QUARKUS_OIDC_APPLICATION_TYPE: "service"
      QUARKUS_HTTP_CORS_ORIGINS: "http://localhost:3000,http://localhost:${EDDI_PORT:-7070},https://localhost:${EDDI_HTTPS_PORT:-7443}"
      # Public Keycloak URL injected into the Manager SPA via window.__EDDI_AUTH__.url
      # Must be reachable from the browser (use the externally accessible hostname)
      EDDI_KEYCLOAK_PUBLIC_URL: "http://localhost:${KEYCLOAK_PORT:-8180}"
      # Explicit token issuer override.
      # KC_HOSTNAME forces Keycloak to embed the public hostname in tokens
      # (iss: http://localhost:8180/realms/eddi), but the backend fetches the
      # OIDC discovery doc from the Docker-internal address (keycloak:8080).
      # KC_HOSTNAME_BACKCHANNEL_DYNAMIC lets the discovery doc use keycloak:8080
      # so the backend can reach the JWKS endpoint, but that makes the
      # discovery "issuer" differ from the token "iss". This config tells Quarkus
      # to validate the token's iss against the public hostname, not the
      # Docker-internal issuer from the discovery doc.
      QUARKUS_OIDC_TOKEN_ISSUER: "http://localhost:${KEYCLOAK_PORT:-8180}/realms/eddi"
      # That issuer is also what EDDI advertises to MCP clients as the place to
      # authenticate (quarkus.oidc.resource-metadata.authorization-server), which
      # is the whole reason it prefers token.issuer over the auth-server-url above.
      #
      # This stack serves EDDI over plain http on localhost, so the advertised
      # resource identifier must not be forced to https — a client would be sent
      # to fetch a URL nothing here is listening on. The scheme follows the
      # request by default since 6.6.1; this stays explicit so the stack says
      # what it needs. A deployment behind a TLS-terminating proxy sets it to
      # true or turns on forwarded-header handling (docs/mcp-server.md).
      QUARKUS_OIDC_RESOURCE_METADATA_FORCE_HTTPS_SCHEME: "false"
    depends_on:
      keycloak:
        condition: service_healthy
      keycloak-admin-rotate:
        condition: service_completed_successfully

  # One-shot guard, the same pattern as docker-compose.yml's bind-guard: it exits
  # 0 when Keycloak stays on loopback or has a real bootstrap admin password, and
  # exits 1 — so `keycloak` never starts — when KEYCLOAK_BIND publishes it on
  # another interface while KC_BOOTSTRAP_ADMIN_PASSWORD is unset (the `admin`
  # fallback below) or literally "admin". The loopback quick start needs no .env;
  # the installers and gcp/provision-vm.sh generate a password, so they pass.
  # Both values are compose interpolation of the .env / shell value with the same
  # defaults the keycloak service uses; `$$` is compose's escape for the shell.
  keycloak-guard:
    # The Keycloak image itself, which this overlay pulls anyway — so the guard
    # costs no extra image on either base stack (MongoDB or PostgreSQL).
    image: quay.io/keycloak/keycloak:26.8.0
    entrypoint: ["/bin/sh", "-c"]
    environment:
      KEYCLOAK_BIND: "${KEYCLOAK_BIND:-127.0.0.1}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KC_BOOTSTRAP_ADMIN_PASSWORD:-admin}"
    command:
      - |
        case "$$KEYCLOAK_BIND" in
          ""|127.0.0.1|localhost|::1|"[::1]") exit 0 ;;
        esac
        if [ -n "$$KC_BOOTSTRAP_ADMIN_PASSWORD" ] && [ "$$KC_BOOTSTRAP_ADMIN_PASSWORD" != "admin" ]; then
          exit 0
        fi
        echo "" >&2
        echo "[SECURITY] Refusing to start: KEYCLOAK_BIND=$$KEYCLOAK_BIND would publish Keycloak on a" >&2
        echo "  non-loopback interface while its bootstrap admin is still admin/admin, so anyone" >&2
        echo "  who can reach the port could administer the identity provider EDDI trusts." >&2
        echo "" >&2
        echo "  Set a real password first (in .env, before the first start of the keycloak-data volume):" >&2
        echo "    KC_BOOTSTRAP_ADMIN_PASSWORD=<generated, e.g. openssl rand -base64 24>" >&2
        echo "  If the volume already exists and you changed the admin password in the console," >&2
        echo "  put that password there — Keycloak only reads it on first boot." >&2
        echo "  Or keep Keycloak on loopback (KEYCLOAK_BIND=127.0.0.1, the default)." >&2
        exit 1

  # keycloak-guard can only judge the configured value: Keycloak reads
  # KC_BOOTSTRAP_ADMIN_PASSWORD only when it first creates the master realm, so a
  # keycloak-data volume first started with admin/admin keeps that login however
  # .env changes later. This one-shot runs once Keycloak is up, before EDDI starts.
  # If a password other than `admin` is configured and the stored admin account
  # still accepts `admin`, it sets the account's password to the configured one
  # through the admin API (what install.sh / install.ps1 do on a re-run). The new
  # password goes to kcadm on stdin, never on its command line. With the dev
  # default there is nothing to rotate to, and keycloak-guard already keeps that
  # case on loopback.
  keycloak-admin-rotate:
    image: quay.io/keycloak/keycloak:26.8.0
    depends_on:
      keycloak:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    environment:
      KC_ADMIN_USER: "${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KC_BOOTSTRAP_ADMIN_PASSWORD:-admin}"
    command:
      - |
        [ -z "$$KC_BOOTSTRAP_ADMIN_PASSWORD" ] || [ "$$KC_BOOTSTRAP_ADMIN_PASSWORD" = "admin" ] && exit 0
        kcadm=/opt/keycloak/bin/kcadm.sh; cfg=/tmp/kcadm.config
        if ! "$$kcadm" config credentials --config "$$cfg" --server http://keycloak:8080 --realm master \
            --user "$$KC_ADMIN_USER" --password admin >/dev/null 2>&1; then
          exit 0   # the default no longer works: the account was already changed
        fi
        id=$$("$$kcadm" get users --config "$$cfg" -r master -q exact=true -q "username=$$KC_ADMIN_USER" --fields id --format csv --noquotes) || exit 1
        pw=$${KC_BOOTSTRAP_ADMIN_PASSWORD//\\/\\\\}; pw=$${pw//\"/\\\"}
        printf '{"type":"password","temporary":false,"value":"%s"}' "$$pw" \
          | "$$kcadm" update "users/$$id/reset-password" --config "$$cfg" -r master -f - || exit 1
        echo "[SECURITY] Keycloak's admin account still accepted the default password 'admin'; it now uses KC_BOOTSTRAP_ADMIN_PASSWORD."

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: start-dev --import-realm
    depends_on:
      keycloak-guard:
        condition: service_completed_successfully
    environment:
      # admin/admin is the DEV default for the local docker-compose quick start,
      # where Keycloak is only reachable on 127.0.0.1 (see `ports:` below — the
      # bind is loopback unless KEYCLOAK_BIND says otherwise). Any deployment that exposes
      # Keycloak off-box must override these (keycloak-guard enforces it) — the GCP provisioner
      # (gcp/provision-vm.sh) generates a random KC_BOOTSTRAP_ADMIN_PASSWORD per VM
      # and exports it before `docker compose up`, so this default is never what a
      # public instance runs with. Override locally too:
      #   KC_BOOTSTRAP_ADMIN_PASSWORD="$(openssl rand -base64 24)" docker compose ... up
      # install.sh / install.ps1 --with-auth generate one and record it in .env.
      KC_BOOTSTRAP_ADMIN_USERNAME: "${KC_BOOTSTRAP_ADMIN_USERNAME:-admin}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KC_BOOTSTRAP_ADMIN_PASSWORD:-admin}"
      KC_HTTP_PORT: "8080"
      KC_HEALTH_ENABLED: "true"
      # KC_HOSTNAME must equal what browsers use to reach Keycloak.
      # Without this, Keycloak embeds the Docker-internal hostname in tokens,
      # causing iss-mismatch failures when the browser validates them.
      KC_HOSTNAME: "http://localhost:${KEYCLOAK_PORT:-8180}"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      # Substituted into eddi-realm.json's webOrigins on import
      # ("http://localhost:${EDDI_PORT:7070}"), so EDDI on a non-default port
      # can log in from the browser. Without them the SPA's token request is
      # refused by CORS and the login fails with nothing but a 401. Keycloak
      # skips the import when the realm already exists in the keycloak-data
      # volume: after changing a port, recreate that volume or add the origin
      # in the admin console.
      EDDI_PORT: "${EDDI_PORT:-7070}"
      EDDI_HTTPS_PORT: "${EDDI_HTTPS_PORT:-7443}"
    # Loopback by default, like EDDI itself (EDDI_BIND in docker-compose.yml):
    # the admin/admin default above must never be reachable off-host by accident.
    # Nothing off-box needs this port — EDDI reaches Keycloak over the compose
    # network (keycloak:8080), KC_HOSTNAME above is a localhost URL, and the GCP
    # VM's HTTPS path proxies https://auth.<ip>.sslip.io to localhost:8180 via
    # nginx. Set KEYCLOAK_BIND=0.0.0.0 only after changing the admin password —
    # keycloak-guard above refuses to start Keycloak otherwise.
    ports:
      - "${KEYCLOAK_BIND:-127.0.0.1}:${KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak:/opt/keycloak/data/import:ro
      # Custom login theme (activated via "loginTheme" in eddi-realm.json).
      # Mount the one theme directory, not ./keycloak/themes over
      # /opt/keycloak/themes. The built-in themes are NOT on that path — they
      # ship inside org.keycloak.keycloak-themes-<version>.jar, so parent theme
      # resolution is unaffected either way — but /opt/keycloak/themes is the
      # custom-theme root and also holds Keycloak's README; mounting over it
      # hides anything the image places there now or later.
      - ./keycloak/themes/eddi:/opt/keycloak/themes/eddi:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && timeout 2 cat <&3 | grep -q '200'"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 60s
    restart: unless-stopped

volumes:
  keycloak-data:
