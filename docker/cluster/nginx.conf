# Round-robin load balancer for docker-compose.cluster.yml.
#
# No session affinity: in cluster mode any replica serves any conversation.
# The upstream name is re-resolved through Docker's DNS every 10 s, so replicas
# added with `--scale eddi=N` (or replaced by a restart) are picked up without a
# reload.
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream eddi {
        zone eddi 64k;
        server eddi:7070 resolve;
    }

    server {
        listen 7070;
        client_max_body_size 32m;

        location / {
            proxy_pass http://eddi;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            # SSE (streaming turns, the coordinator /stream) must not be buffered.
            proxy_buffering off;
            proxy_read_timeout 120s;
            # A node that is draining answers 503; try the next one.
            proxy_next_upstream error timeout http_502 http_503;
        }
    }
}
