# Round-robin load balancer for docker-compose.cluster.yml.
#
# No session affinity: in cluster mode any replica serves any conversation.
# The upstream name is re-resolved through Docker's DNS every 10 s, so replicas
# added with `--scale eddi=N` (or replaced by a restart) are picked up without a
# reload.
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream eddi {
        zone eddi 64k;
        # max_fails=0: never take a node out of rotation because of what it answered.
        # EDDI answers 503 for ordinary load shedding (executor full, quota accounting
        # or NATS unavailable, degraded=reject) and a draining node answers 503 too;
        # with the default max_fails=1 one such answer per node marks every node failed
        # and the whole API answers 502 "no live upstreams" for fail_timeout. A stopped
        # replica leaves Docker's DNS within `valid=10s`, and a refused connection
        # fails over at once.
        server eddi:7070 resolve max_fails=0;
    }

    upstream eddi_mcp {
        zone eddi_mcp 64k;
        hash $remote_addr consistent;
        server eddi:7070 resolve;
    }

    server {
        listen 7070;
        client_max_body_size 32m;

        # MCP (Streamable HTTP) keeps its session on the node that answered
        # `initialize`; a request carrying that Mcp-Session-Id on another node is
        # answered 404. Route /mcp by client address so a client stays on one node.
        location /mcp {
            proxy_pass http://eddi_mcp;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 300s;
        }

        location / {
            proxy_pass http://eddi;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            # SSE (streaming turns, the coordinator /stream) must not be buffered.
            proxy_buffering off;
            proxy_read_timeout 120s;
            proxy_connect_timeout 2s;
            # A node that is draining answers 503; try the next one. When every node
            # answers 503 the client gets that answer, with its Retry-After.
            proxy_next_upstream error timeout http_502 http_503;
        }
    }
}
