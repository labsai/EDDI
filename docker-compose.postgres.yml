
services:
  eddi:
    image: labsai/eddi:latest
    # Overlaid on docker-compose.yml, whose eddi service publishes the same two
    # ports. Compose merges port lists, so a hardcoded "7070:7070" here did not
    # override the base entry -- with EDDI_PORT=7071 the container ended up
    # published on 7071 *and* 7070. Same variable, same value, one binding.
    ports:
      - "${EDDI_PORT:-7070}:7070"
    environment:
      QUARKUS_PROFILE: postgres
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/eddi
      QUARKUS_DATASOURCE_USERNAME: eddi
      QUARKUS_DATASOURCE_PASSWORD: eddi
      EDDI_DATASTORE_TYPE: postgres
      EDDI_SECURITY_ALLOW_UNAUTHENTICATED: "true"
      EDDI_VAULT_MASTER_KEY: "${EDDI_VAULT_MASTER_KEY:-}"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    # Loopback-only, matching the MongoDB binding in docker-compose.yml: this is
    # a development overlay with a hardcoded eddi/eddi password, and it has no
    # business being reachable from the network.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: eddi
      POSTGRES_USER: eddi
      POSTGRES_PASSWORD: eddi
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eddi -d eddi"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:

