apiVersion: v2
name: eddi
description: >-
  EDDI — Enterprise-grade Multi-Agent AI Orchestration Middleware.
  Orchestrate multiple AI agents, manage stateful conversations,
  and integrate with LLM providers via a unified REST API.
type: application
# The CHART's own version, independent of the app it deploys. Bump it on every
# change to anything under helm/ — including the appVersion below. Chart repos
# key on this field, so shipping two different chart contents under one version
# leaves caches and mirrors unable to tell them apart. It sat at 1.0.0 across
# three releases because nothing enforces this; nothing packages the chart yet,
# which is the only reason that was harmless.
version: 1.0.1
appVersion: "6.4.0"
home: https://eddi.labs.ai
sources:
  - https://github.com/labsai/EDDI
maintainers:
  - name: LABS.AI
    email: contact@labs.ai
    url: https://labs.ai
keywords:
  - ai
  - conversational-ai
  - llm
  - chatbot
  - multi-agent
  - quarkus
  - mcp
  - a2a
icon: https://eddi.labs.ai/img/eddi-logo.png
