# ─────────────────────────────────────────────────────────────
# EDDI Helm Chart — Default Values
# ─────────────────────────────────────────────────────────────
# Override any value with --set or a custom values.yaml file:
#   helm install eddi ./helm/eddi --set eddi.vaultMasterKey="$(openssl rand -base64 24)"
#   helm install eddi ./helm/eddi -f my-values.yaml
#
# ⚠️  The chart intentionally has NO default credentials. eddi.vaultMasterKey is
# mandatory, and postgres.password / keycloak.adminPassword are mandatory when
# those components are enabled — rendering fails with a clear message otherwise.

# ── EDDI Server ────────────────────────────────────────────

eddi:
  image:
    repository: labsai/eddi
    # Immutable patch version — never the mutable major tag "6", which lets the
    # running bits drift away from the digest CI signed and attested.
    tag: "6.3.0"
    # Strongest form: also pin the digest, so the kubelet verifies exactly what
    # cosign signed. Resolve it once per release with `crane digest`:
    #   digest: "sha256:<64 hex chars>"
    digest: ""
    pullPolicy: IfNotPresent

  # ⚠️  MUST stay 1 — the chart refuses to render anything higher.
  #
  # EDDI serialises the turns of a single conversation with a JVM-LOCAL lock
  # (InMemoryConversationCoordinator: one BlockingQueue per conversation guarded
  # by synchronized(queue)). The NATS coordinator is not an escape: JetStream is
  # only an ordering primitive and the Callable still runs in the JVM that
  # published it. Two replicas without sticky sessions means two turns of one
  # conversation run concurrently, both replaceOne() the whole conversation
  # document, and one turn is SILENTLY LOST. Replay-protection nonces are
  # in-memory too, so a replayed signed envelope that lands on another pod goes
  # undetected. Scale vertically via eddi.resources instead.
  replicas: 1

  # Vault master key — encrypts API keys and secrets. REQUIRED.
  # ⚠️  If you lose this key, encrypted secrets are UNRECOVERABLE
  # Generate: openssl rand -base64 24
  vaultMasterKey: ""

  # Database backend: "mongodb" or "postgres"
  datastoreType: mongodb

  # Bring your own database (MongoDB Atlas, RDS, Cloud SQL, …).
  #
  # Required when both mongodb.enabled and postgres.enabled are false —
  # rendering fails with an explanation otherwise. Without these the chart used
  # to emit no connection string at all and the pod fell back to the built-in
  # default mongodb://mongodb:27017/eddi, which resolves to nothing.
  # Set eddi.datastoreType to match whichever one you fill in.
  datastore:
    externalConnectionString: ""   # mongodb://user:pass@host:27017/eddi?...
    externalJdbcUrl: ""            # jdbc:postgresql://host:5432/eddi

  # Messaging. Only "in-memory" works with the published image.
  #
  # Anything else needs an EDDI image BUILT with -Dquarkus.profile=nats: the
  # NATS coordinator is gated on @IfBuildProfile("nats") and no Java code reads
  # eddi.messaging.type at runtime. The chart refuses to render otherwise —
  # see nats.buildProfileImage. Neither value changes the replica count; EDDI is
  # fixed at one replica regardless (see eddi.replicas).
  messagingType: in-memory

  # CORS origins
  corsOrigins: "http://localhost:3000,http://localhost:7070"

  # Authentication escape hatches.
  #
  # Left empty they follow oidc.enabled — OIDC off means the guards would refuse
  # to boot, so the chart opts out for you and the quickstart works. Set them
  # explicitly only for a deployment that runs without OIDC on purpose (air-gapped,
  # or a demo) and wants /mcp or /secretstore closed anyway.
  #
  # Accepts a real boolean (false / true) or its quoted string form; an explicit
  # false always wins over the value derived from oidc.enabled.
  security:
    allowUnauthenticated: ""
    allowUnauthenticatedMcp: ""
    allowUnauthenticatedSecretStore: ""

  # OIDC / Keycloak authentication
  oidc:
    enabled: false

    # The identity provider's realm URL as EDDI reaches it IN-CLUSTER.
    # REQUIRED when oidc.enabled=true and keycloak.enabled=false; ignored when
    # the chart deploys Keycloak (it uses its own Service name then).
    # No default: the old one named a bare `keycloak` Service that this chart
    # never creates, so bring-your-own-IdP installs died on a DNS error instead
    # of being told they had forgotten to set this.
    authServerUrl: ""

    clientId: "eddi-backend"

    # The identity provider URL the BROWSER uses. REQUIRED when oidc.enabled.
    #
    # It reaches the Manager SPA through window.__EDDI_AUTH__.url and the CSP
    # connect-src; without it the SPA has no authority to redirect to and the
    # browser blocks the call anyway. It cannot be derived — the in-cluster
    # Service name is not resolvable from a browser and the ingress fronts only
    # EDDI. For `kubectl port-forward svc/<release>-eddi-keycloak 8080:8080`
    # that is "http://localhost:8080".
    #
    # When the chart deploys Keycloak this also becomes KC_HOSTNAME and pins
    # QUARKUS_OIDC_TOKEN_ISSUER, so tokens and discovery agree.
    publicUrl: ""

  resources:
    requests:
      cpu: 250m
      memory: 384Mi
    limits:
      cpu: "2"
      memory: 1Gi

  service:
    type: ClusterIP
    port: 7070

  # Pod annotations (e.g., Prometheus scrape)
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "7070"
    prometheus.io/path: "/q/metrics"

# ── MongoDB ────────────────────────────────────────────────

mongodb:
  enabled: true
  image:
    repository: mongo
    tag: "7.0"
  storage:
    size: 10Gi
    # storageClassName: standard
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

# ── PostgreSQL ─────────────────────────────────────────────

postgres:
  enabled: false
  image:
    repository: postgres
    tag: "16-alpine"
  database: eddi
  username: eddi
  # REQUIRED when postgres.enabled=true — no default is shipped.
  # Generate: openssl rand -base64 24
  #
  # ⚠️  Set this BEFORE the first install. The postgres image reads
  # POSTGRES_PASSWORD only during initdb, against an empty PGDATA — and PGDATA
  # lives on the StatefulSet's volumeClaimTemplate, which survives every
  # upgrade. Changing it on a `helm upgrade` therefore rotates EDDI's half of
  # the credential while the database keeps the old one, and every datasource
  # connection fails authentication with an error that names neither. To rotate
  # afterwards, change the database first:
  #   kubectl exec -n <ns> statefulset/<release>-eddi-postgres -- \
  #     psql -U eddi -d eddi -c "ALTER ROLE eddi PASSWORD '<new>'"
  # then run the upgrade.
  password: ""
  storage:
    size: 10Gi
    # storageClassName: standard
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

# ── NATS JetStream ─────────────────────────────────────────
#
# ⚠️  Inert with the published image. NatsConversationCoordinator is gated on
# @IfBuildProfile("nats") — a BUILD-time switch — and labsai/eddi is published
# without it, while `eddi.messaging.type` is read by no Java code at runtime.
# Enabling this against a stock image provisions a JetStream StatefulSet and a
# PVC that EDDI never connects to.

nats:
  enabled: false
  # Set true ONLY if eddi.image points at an image you built with
  # -Dquarkus.profile=nats. It is what unlocks eddi.messagingType != in-memory;
  # the chart refuses to render otherwise rather than shipping a setting that
  # nothing reads.
  buildProfileImage: false
  image:
    repository: nats
    tag: "2.10-alpine"
  storage:
    size: 5Gi
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

# ── Keycloak ───────────────────────────────────────────────

keycloak:
  enabled: false
  image:
    repository: quay.io/keycloak/keycloak
    tag: "26.0"
  adminUsername: admin
  # REQUIRED when keycloak.enabled=true — no default is shipped.
  # Generate: openssl rand -base64 24
  adminPassword: ""

  # The realm in files/eddi-realm.json is imported on FIRST boot only. It ships
  # allowing redirects to localhost and to the https://eddi.example.com
  # placeholder; set publicOrigin to your own scheme+host and the placeholder is
  # substituted in both redirectUris and webOrigins. A realm that does not list
  # your host answers "Invalid parameter: redirect_uri" and login cannot finish.
  # Leave empty for the port-forward flow, which localhost already covers.
  publicOrigin: ""

  # Keycloak runs `start-dev` on its embedded H2 database. This PVC is what
  # keeps realms, clients and users across a restart — without it a rollout,
  # eviction or OOM kill wipes the identity provider. Run `start` against an
  # external database for anything past dev/demo.
  storage:
    size: 1Gi
    # storageClassName: standard

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

# ── Manager UI ─────────────────────────────────────────────
#
# No values, and no templates/manager.yaml. The Manager is bundled INTO the EDDI
# image (IRestManagerResource serves /manage, and manage.html ships in the jar),
# so it is already reachable through the eddi Service. The chart used to offer a
# `manager.*` block deploying a second Deployment from labsai/eddi-config-ui —
# a UI generation this repository no longer builds or publishes, pulled at the
# mutable `:latest` tag that every other image reference here deliberately
# avoids. Reach the Manager at http://<eddi-service>:7070/manage instead.

# ── Ingress ────────────────────────────────────────────────

ingress:
  enabled: false
  # className: nginx
  annotations: {}
    # nginx.ingress.kubernetes.io/proxy-buffering: "off"
  hosts:
    - host: eddi.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: eddi-tls
  #    hosts:
  #      - eddi.example.com

# ── Autoscaling ────────────────────────────────────────────
#
# ⚠️  NOT SUPPORTED. Setting enabled=true makes the chart FAIL to render, with
# an explanation — see eddi.replicas above for why EDDI cannot run more than one
# replica today. The knobs stay here so the shape is ready for the distributed
# conversation coordinator; min/max are pinned to 1 in the meantime.

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# ── Pod Disruption Budget ──────────────────────────────────
#
# maxUnavailable, not minAvailable: at exactly 1 replica, `minAvailable: 1`
# means the eviction API can never succeed and `kubectl drain` hangs forever.

podDisruptionBudget:
  enabled: false
  maxUnavailable: 1

# ── Network Policy ─────────────────────────────────────────
#
# Renders templates/networkpolicy.yaml: default-deny for the EDDI pod plus
# explicit ingress/egress allowances. The egress rule mirrors the application's
# own SSRF blocklist (link-local / metadata, RFC1918, loopback, CGNAT) at the
# network layer.

networkPolicy:
  enabled: false
  # Namespaces allowed to reach EDDI on 7070, by metadata.name. The release
  # namespace is always allowed. Add your ingress controller's namespace here.
  allowedIngressNamespaces: []
  # Extra destination ports opened for egress (DNS/443 and the in-chart
  # datastores are handled automatically).
  extraEgressPorts: []

# ── Monitoring ─────────────────────────────────────────────
#
# No values. The chart ships no Prometheus or Grafana templates, and a
# `monitoring.prometheus.enabled` / `monitoring.grafana.enabled` pair used to sit
# here that no template consumed — `--set monitoring.prometheus.enabled=true`
# rendered nothing and exited 0, so an operator believed metrics collection was
# deployed and had none. (Exactly the failure templates/networkpolicy.yaml was
# written to fix, left in place two values further down the file.)
#
# EDDI exposes Prometheus metrics at /q/metrics and the pod already carries the
# scrape annotations, so any cluster Prometheus picks it up. For a stack in the
# same namespace use the Kustomize component: k8s/overlays/monitoring/.

# ── Service Account ────────────────────────────────────────
#
# create=false plus a name is the bring-your-own-SA shape (EKS IRSA, GKE
# Workload Identity, AKS pod identity): the SA is provisioned and annotated
# outside the chart and the Deployment just references it.

serviceAccount:
  create: true
  name: ""
  annotations: {}

# ── Namespace ──────────────────────────────────────────────
#
# No value. Helm takes the namespace from `--namespace`; a `namespace: eddi`
# value used to sit here that no template read, so `--set namespace=foo` put the
# release somewhere else entirely without an error.
