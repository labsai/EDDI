# ─────────────────────────────────────────────────────────────
# EDDI Helm Chart — Default Values
# ─────────────────────────────────────────────────────────────
# Override any value with --set or a custom values.yaml file:
#   helm install eddi ./helm/eddi -f my-values.yaml
#
# Minimal local (port-forward, no OIDC) install — every value below is required:
#   helm install eddi ./helm/eddi \
#     --set eddi.vaultMasterKey="$(openssl rand -base64 24)" \
#     --set mongodb.rootPassword="$(openssl rand -base64 24)" \
#     --set eddi.security.allowUnauthenticatedMcp=true \
#     --set eddi.security.allowUnauthenticatedSecretStore=true
#
# ⚠️  The chart intentionally has NO default credentials. eddi.vaultMasterKey is
# mandatory, and postgres.password / keycloak.adminPassword are mandatory when
# those components are enabled — rendering fails with a clear message otherwise.

# ── EDDI Server ────────────────────────────────────────────

eddi:
  image:
    repository: labsai/eddi
    # Empty = the chart's appVersion (helm/eddi/Chart.yaml), so a release moves
    # one line, not two. If you override it, use an immutable patch version —
    # never the mutable major tag "6", which lets the running bits drift away
    # from the digest CI signed and attested.
    tag: ""
    # Strongest form: also pin the digest, so the kubelet verifies exactly what
    # cosign signed. Resolve it once per release with `crane digest`:
    #   digest: "sha256:<64 hex chars>"
    digest: ""
    pullPolicy: IfNotPresent

  # Replicas. More than 1 requires eddi.messagingType=nats (the chart refuses
  # otherwise): in cluster mode every replica takes a cluster-wide lease per
  # conversation from NATS JetStream, so turns of one conversation never overlap
  # and a node that lost its lease cannot overwrite the next turn (fencing). A
  # plain round-robin Service is all the load balancing it needs. With
  # in-memory messaging the conversation lock is JVM-local, so a second replica
  # would let two turns of one conversation run at once. See docs/clustering.md.
  replicas: 1

  # How an upgrade replaces the running pod: "", "Recreate" or "RollingUpdate" —
  # or the Deployment's own strategy object ({type: RollingUpdate, rollingUpdate:
  # {maxSurge: 1, maxUnavailable: 0}}); both shapes are accepted.
  #
  # Empty (the default) picks per messaging type. In-memory: Recreate, which stops
  # the old pod before the new one starts — each upgrade costs the time EDDI takes
  # to boot and become ready, but two EDDI JVMs never run against one database
  # (everything single-node EDDI keeps per process — the per-conversation turn
  # lock, replay-protection nonces, rate limits and cost budgets, the agent and
  # workflow caches, HITL crash recovery — would diverge between them).
  # RollingUpdate with in-memory messaging is therefore refused; use cluster mode.
  # nats: RollingUpdate (maxSurge 1, maxUnavailable 0), which is safe there — the
  # old and the new pod coordinate through NATS like any two replicas.
  updateStrategy: ""

  # Pod termination grace. Empty picks 75 s in cluster mode (it must exceed
  # the drain timeout plus the readiness grace, which the chart checks) and
  # 30 s otherwise.
  terminationGracePeriodSeconds: ""

  # Graceful-shutdown drain (EDDI_SHUTDOWN_DRAIN_TIMEOUT_SECONDS): how long a
  # terminating pod lets running turns finish. Empty: 65 s in cluster mode, the
  # application default (20 s) otherwise.
  shutdownDrainTimeoutSeconds: ""

  # Vault master key — encrypts API keys and secrets. REQUIRED, unless
  # existingSecret below supplies it.
  # ⚠️  If you lose this key, encrypted secrets are UNRECOVERABLE
  # Generate: openssl rand -base64 24
  vaultMasterKey: ""

  # Bring your own Secret instead of <release>-secrets (External Secrets
  # Operator, Sealed Secrets, a Secret you create by hand). When set, the chart
  # renders NO Secret for EDDI and the pod mounts this one instead, so neither
  # the vault master key nor a datastore password ever passes through a values
  # file or `--set`. It must hold ONE key, application-secrets.properties, with
  # the same lines <release>-secrets would carry:
  #   eddi.vault.master-key=<key>
  #   mongodb.connectionString=mongodb://user:pass@<release>-eddi-mongodb:27017/eddi?authSource=admin
  #     (in-chart MongoDB — percent-encode the password; or your external URI)
  #   quarkus.datasource.username= / quarkus.datasource.password=
  #     (external PostgreSQL only; the in-chart one has its own Secret)
  #   eddi.nats.username= / eddi.nats.password=   (in-chart NATS with auth)
  # vaultMasterKey and the external-datastore credentials are then ignored.
  existingSecret: ""

  # Database backend: exactly "mongodb" or exactly "postgres", both lowercase.
  #
  # EDDI matches this case-SENSITIVELY — DataStoreProducers.isPostgres() is
  # `"postgres".equals(datastoreType)` — so "Postgres" is not a spelling of
  # "postgres": it matches neither branch and boots the MongoDB store against
  # the baked-in mongodb://mongodb:27017/eddi. The chart refuses every other
  # spelling rather than rendering it.
  datastoreType: mongodb

  # Bring your own database (MongoDB Atlas, RDS, Cloud SQL, …).
  #
  # Required when both mongodb.enabled and postgres.enabled are false —
  # rendering fails with an explanation otherwise. Without these the chart used
  # to emit no connection string at all and the pod fell back to the built-in
  # default mongodb://mongodb:27017/eddi, which resolves to nothing.
  #
  # eddi.datastoreType must name whichever one you fill in; the chart now
  # refuses to render when it disagrees, rather than booting the other store.
  #
  # externalConnectionString and the JDBC username/password are rendered into
  # the mounted <release>-secrets FILE, never into the ConfigMap — a ConfigMap
  # is readable by anything with `get configmaps` in the namespace.
  datastore:
    externalConnectionString: ""   # mongodb://user:pass@host:27017/eddi?...
    externalJdbcUrl: ""            # jdbc:postgresql://host:5432/eddi
    # Both REQUIRED when externalJdbcUrl is set. Do NOT put credentials in the
    # JDBC URL: that value is an address and is rendered into the ConfigMap.
    externalJdbcUsername: ""
    externalJdbcPassword: ""

  # Messaging, read by EDDI at RUNTIME (the published image serves both):
  #   in-memory — a single replica, no dependencies.
  #   nats      — cluster mode: N replicas coordinated through NATS JetStream.
  #               Needs nats.enabled=true (in-chart cluster) or nats.externalUrl.
  messagingType: in-memory

  # CORS origins
  corsOrigins: "http://localhost:3000,http://localhost:7070"

  # Authentication escape hatches.
  #
  # allowUnauthenticated (the whole conversation API): left empty it follows
  # oidc.enabled, so a no-OIDC quickstart still boots the general API.
  #
  # allowUnauthenticatedMcp / allowUnauthenticatedSecretStore: these are NO LONGER
  # derived from oidc.enabled. The MCP server exposes agent CRUD, conversations,
  # memories and audit trails; /secretstore writes the vault — turning OIDC off
  # must not silently open them. Left empty they render "false", so a deployment
  # running without OIDC must opt each one in EXPLICITLY (set it to true here).
  # The chart refuses to RENDER an OIDC-off release until both are true — the
  # same condition under which HighValueSurfaceGuard would refuse to boot, caught
  # before the pod crash-loops. Enable OIDC instead wherever you can.
  #
  # Also note: with ingress.enabled=true and oidc.enabled=false the chart refuses
  # to render unless allowUnauthenticated is set explicitly — publishing an
  # unauthenticated EDDI to the network has to be a deliberate choice.
  #
  # Accepts a real boolean (false / true) or its quoted string form; an explicit
  # false always wins over the value derived from oidc.enabled.
  security:
    allowUnauthenticated: ""
    allowUnauthenticatedMcp: ""
    allowUnauthenticatedSecretStore: ""

  # OIDC / Keycloak authentication
  oidc:
    enabled: false

    # The identity provider's realm URL as EDDI reaches it IN-CLUSTER.
    # REQUIRED when oidc.enabled=true and keycloak.enabled=false; ignored when
    # the chart deploys Keycloak (it uses its own Service name then).
    # No default: the old one named a bare `keycloak` Service that this chart
    # never creates, so bring-your-own-IdP installs died on a DNS error instead
    # of being told they had forgotten to set this.
    authServerUrl: ""

    clientId: "eddi-backend"

    # The identity provider URL the BROWSER uses. REQUIRED when oidc.enabled.
    #
    # It reaches the Manager SPA through window.__EDDI_AUTH__.url and the CSP
    # connect-src; without it the SPA has no authority to redirect to and the
    # browser blocks the call anyway. It cannot be derived — the in-cluster
    # Service name is not resolvable from a browser and the ingress fronts only
    # EDDI. For `kubectl port-forward svc/<release>-eddi-keycloak 8080:8080`
    # that is "http://localhost:8080".
    #
    # When the chart deploys Keycloak this also becomes KC_HOSTNAME and pins
    # QUARKUS_OIDC_TOKEN_ISSUER, so tokens and discovery agree.
    publicUrl: ""

    # What EDDI advertises at /.well-known/oauth-protected-resource/mcp, which is
    # how an MCP client discovers where to authenticate. Both are deployment
    # facts the chart cannot infer safely — publicUrl describes Keycloak, not
    # EDDI — so they are settings rather than guesses.
    resourceMetadata:
      # The scheme in the advertised resource identifier. Unset, it follows
      # EDDI's own `ingress.tls`: https behind a TLS ingress (where the scheme
      # read from the request has already been downgraded by the proxy), http for
      # the documented `kubectl port-forward` flow, which is plain http end to
      # end and where advertising https hands a client a URL nothing serves.
      # Set it explicitly if EDDI is fronted by TLS the chart does not render.
      forceHttpsScheme: null

      # The authorization server the document names. Leave empty when the chart
      # deploys Keycloak — it already pins the public issuer. For a
      # bring-your-own IdP set the PUBLIC issuer here: EDDI otherwise falls back
      # to authServerUrl, which is the in-cluster address a client cannot reach.
      authorizationServer: ""

      # The ABSOLUTE public URL of the MCP endpoint, e.g.
      # "https://eddi.example.com/mcp". Unset, EDDI advertises a relative
      # identifier whose origin comes from each request's Host header — fine
      # for port-forward, but behind a proxy that does not pin Host a crafted
      # Host makes EDDI advertise a resource on another origin. Set it for any
      # deployment reachable by name.
      resource: ""

  # Sized for production, one node. EDDI waits on LLMs far more than it computes, so
  # memory, not CPU, decides how many conversation turns a node runs at once: the heap
  # is 75 % of the memory limit (JAVA_MAX_MEM_RATIO in the image), about 2.25 GB here,
  # and each in-flight turn holds its conversation (~1 MB for short ones). Memory request
  # equals the limit (Guaranteed QoS: not the first pod evicted under node pressure).
  # Keep a CPU limit: the JVM sizes its GC, carrier and Jlama threads from it, and
  # without one it sees every core on the node. 4 leaves headroom for bursts of JSON
  # (de)serialisation and GC; the request reserves one core. Scale up for more turns
  # per node (e.g. 6Gi) or out with cluster mode; see docs/kubernetes.md#sizing-a-node.
  resources:
    requests:
      cpu: "1"
      memory: 3Gi
    limits:
      cpu: "4"
      memory: 3Gi

  # Startup probe. It checks LIVENESS, not readiness, on purpose. Readiness is
  # false for as long as the startup migrations run, and the first boot of a
  # database migrated from EDDI 5 can take many minutes on a large or throttled
  # database. A startup probe on readiness killed the pod mid-migration after
  # 60 s, and every restart began the migration again, so it never finished.
  # Traffic is still gated by the readiness probe.
  startupProbe:
    path: /q/health/live
    failureThreshold: 30
    periodSeconds: 2

  service:
    type: ClusterIP
    port: 7070

  # Who may read /q/metrics. Empty keeps EDDI's default, "eddi-metrics-reader":
  # with OIDC on, the scrape needs a token carrying the eddi-admin or
  # eddi-metrics realm role (a Prometheus without a token gets 401, one without
  # the role 403). "authenticated" admits any token; "permit" opens this one
  # path — only where /q/metrics cannot be reached from outside the cluster
  # (the chart's ingress routes every path, /q/* included, unless you change
  # ingress.hosts[].paths). See docs/monitoring/monitoring-guide.md.
  metrics:
    httpPolicy: ""

  # OpenTelemetry trace export. Empty (the default) leaves tracing off, as the
  # image ships it (quarkus.otel.sdk.disabled=true). Set it to your collector's
  # OTLP gRPC endpoint, e.g. "http://otel-collector.observability:4317", and the
  # chart turns the SDK on and points it there. With networkPolicy.enabled the
  # EDDI pod may then also open otlpPort to networkPolicy.otlpEgressTo — without
  # that, the default-deny egress policy silently dropped every span.
  tracing:
    otlpEndpoint: ""
    otlpPort: 4317

  # Origins allowed to embed the Chat UI (/chat) in an <iframe>, space-separated,
  # e.g. "https://www.example.com https://*.example.org". Empty keeps EDDI's
  # default, 'none': no page may frame it.
  chat:
    frameAncestors: ""

  # Pod annotations (e.g., Prometheus scrape)
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "7070"
    prometheus.io/path: "/q/metrics"

# ── MongoDB ────────────────────────────────────────────────

mongodb:
  enabled: true
  image:
    repository: mongo
    tag: "7.0.43"
  # Root credentials for the in-chart MongoDB. The database runs WITH
  # authentication (--auth) and EDDI connects as this user — an unauthenticated
  # in-cluster MongoDB is reachable by any pod that can resolve its Service.
  # rootPassword is REQUIRED when mongodb.enabled=true; no default is shipped.
  # Generate: openssl rand -base64 24
  #
  # ⚠️  Set this BEFORE the first install, for the same reason as postgres.password:
  # the mongo image reads MONGO_INITDB_ROOT_PASSWORD only during first init against
  # an empty data volume, and that volume survives upgrades. Changing it on a later
  # `helm upgrade` rotates EDDI's half while the database keeps the old one and every
  # connection then fails authentication. To rotate afterwards, change the user in
  # the database first (db.changeUserPassword in the admin db), then upgrade.
  rootUsername: eddi
  rootPassword: ""
  # EDDI's own MongoDB user: readWrite + dbAdmin on the `eddi` database and no
  # role anywhere else. EDDI connects as this user, never as root; the
  # Deployment's ensure-mongodb-user init container creates it with the root
  # credentials on every start, so an existing volume needs no manual step and
  # changing appPassword rotates it. appPassword empty = derived from
  # rootPassword (sha256: stable across renders, not the root password itself).
  # Unused with existingSecret, where eddi.existingSecret carries EDDI's
  # connection string and you manage the users.
  appUsername: eddi_app
  appPassword: ""
  # Bring your own Secret instead of <release>-mongodb: it must carry the keys
  # MONGO_INITDB_ROOT_USERNAME and MONGO_INITDB_ROOT_PASSWORD, which the mongo
  # container reads at first init. rootPassword is then ignored — and because
  # the chart can no longer build EDDI's connection string without it,
  # eddi.existingSecret is REQUIRED alongside (the chart refuses to render
  # otherwise); put the full mongodb.connectionString in that Secret.
  existingSecret: ""
  # UPGRADING a release from before MongoDB authentication: its data volume is
  # already initialised, so the image will NOT create rootUsername, yet it does
  # turn --auth on. Create the user in the still-unauthenticated database first
  # (kubectl exec … mongosh admin — the exact command is in the render error and
  # in docs/kubernetes.md), then set this to true for that upgrade. A live
  # `helm upgrade` that detects such a release refuses to render until you do.
  authMigrated: false
  storage:
    size: 10Gi
    # storageClassName: standard
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

# ── PostgreSQL ─────────────────────────────────────────────

postgres:
  # ⚠️  mongodb.enabled defaults to TRUE, so turning this on does NOT turn
  # MongoDB off. The chart refuses to render with both enabled — EDDI runs one
  # store and the other would be deployed, backed up and paid for while nothing
  # writes to it — so set mongodb.enabled=false alongside this.
  enabled: false
  image:
    repository: postgres
    tag: "16.15-alpine"
  # The uid (and gid, and fsGroup) PostgreSQL runs as. 70 is `postgres` in the
  # alpine image; set 999 for a Debian-based postgres image. Running as it from
  # the start lets the container drop every capability.
  runAsUser: 70
  database: eddi
  username: eddi
  # REQUIRED when postgres.enabled=true — no default is shipped.
  # Generate: openssl rand -base64 24
  #
  # ⚠️  Set this BEFORE the first install. The postgres image reads
  # POSTGRES_PASSWORD only during initdb, against an empty PGDATA — and PGDATA
  # lives on the StatefulSet's volumeClaimTemplate, which survives every
  # upgrade. Changing it on a `helm upgrade` therefore rotates EDDI's half of
  # the credential while the database keeps the old one, and every datasource
  # connection fails authentication with an error that names neither. To rotate
  # afterwards, change the database first:
  #   kubectl exec -n <ns> statefulset/<release>-eddi-postgres -- \
  #     psql -U eddi -d eddi -c "ALTER ROLE eddi PASSWORD '<new>'"
  # then run the upgrade.
  password: ""
  # Bring your own Secret instead of <release>-postgres. It must carry the four
  # keys that Secret would: POSTGRES_DB, POSTGRES_USER and POSTGRES_PASSWORD
  # (read by the postgres container at initdb) and postgres-secrets.properties,
  # a two-line Quarkus properties file mounted into EDDI:
  #   quarkus.datasource.username=<username>
  #   quarkus.datasource.password=<password>
  # password is then ignored.
  existingSecret: ""
  storage:
    size: 10Gi
    # storageClassName: standard
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

# ── NATS JetStream ─────────────────────────────────────────
#
# Cluster mode (eddi.messagingType=nats): conversation leases and fencing
# tokens, cache-invalidation events, shared security/tool state and durable dead
# letters. See docs/clustering.md. `nats.buildProfileImage` from chart < 2.5 is
# no longer read: the published image selects cluster mode at runtime.

nats:
  # Deploy a JetStream cluster in this release. Alternatively leave false and
  # point externalUrl at your own NATS (a comma-separated list of servers).
  enabled: false
  externalUrl: ""
  # JetStream nodes. 3 gives R3 buckets and streams that survive the loss of one
  # node; 1 is a development setup.
  replicas: 3
  cluster:
    # Route the NATS nodes into one cluster (needed for replicas > 1).
    enabled: true
    # Route authentication, separate from the client user below: a route is a
    # server-to-server connection that client permissions do not restrict, so
    # without it anything that reaches port 6222 can join the cluster.
    routeUsername: route
    # REQUIRED when the in-chart NATS runs more than one node (replicas > 1 and
    # cluster.enabled) — no default is shipped. Generate: openssl rand -hex 24
    routePassword: ""
  image:
    repository: nats
    # 2.11+: KV limit markers; 2.10 works with poll-only lease takeover.
    tag: "2.11-alpine"
  auth:
    # User/password authentication for EDDI. The user may publish and subscribe
    # only to eddi.>, $JS.*, $KV.*, $O.* (the archive object store) and _INBOX.>.
    enabled: true
    username: eddi
    # REQUIRED when nats.enabled=true and auth.enabled=true — no default is
    # shipped. Generate: openssl rand -base64 24
    password: ""
  tls:
    # TLS for clients and routes from a kubernetes.io/tls Secret (tls.crt,
    # tls.key, ca.crt) you provide, e.g. from cert-manager.
    enabled: false
    secretName: ""
  storage:
    size: 5Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ── Keycloak ───────────────────────────────────────────────

keycloak:
  enabled: false
  image:
    repository: quay.io/keycloak/keycloak
    tag: "26.8.0"
  adminUsername: admin
  # REQUIRED when keycloak.enabled=true and existingSecret is empty — no default
  # is shipped. Rendered into the <release>-keycloak Secret and read by the pod
  # through secretKeyRef, never as a plain env value in the pod spec.
  # Generate: openssl rand -base64 24
  adminPassword: ""
  # Bring your own Secret instead of <release>-keycloak: it must carry the key
  # `password` (the same shape as the kustomize overlay's keycloak-admin
  # Secret). adminPassword is then ignored.
  existingSecret: ""

  # The realm in files/eddi-realm.json is imported on FIRST boot only. It ships
  # allowing redirects to localhost and to the https://eddi.example.com
  # placeholder; set publicOrigin to your own scheme+host and the placeholder is
  # substituted in both redirectUris and webOrigins. A realm that does not list
  # your host answers "Invalid parameter: redirect_uri" and login cannot finish.
  # Leave empty for the port-forward flow, which localhost already covers.
  #
  # Setting it also REMOVES the localhost entries and the `+` wildcard web
  # origin from the eddi-frontend client: a realm published under a real
  # hostname that still accepts redirects to http://localhost:* lets a page on
  # the operator's own machine, or any local port a malicious site can reach,
  # complete a login with the authorization code. The eddi-mcp client keeps its
  # loopback redirects — that is how MCP clients on a workstation sign in.
  publicOrigin: ""

  # Keycloak runs `start-dev` on its embedded H2 database. This PVC is what
  # keeps realms, clients and users across a restart — without it a rollout,
  # eviction or OOM kill wipes the identity provider. Run `start` against an
  # external database for anything past dev/demo.
  #
  # Because of that, the chart REFUSES to render keycloak.enabled=true together
  # with ingress.enabled=true: an Ingress means the deployment is reachable by
  # name, and a `start-dev` Keycloak (no production hardening, H2 on a single
  # PVC, no HA) must not be the identity provider behind it unless you say so.
  # Set devModeAcknowledged=true to render anyway (a demo or a staging cluster
  # you understand), or point eddi.oidc.authServerUrl at a Keycloak you run
  # with `start` and leave keycloak.enabled=false.
  devModeAcknowledged: false

  # Which forwarded headers Keycloak trusts (KC_PROXY_HEADERS): xforwarded,
  # forwarded, or none. Empty means automatic — `xforwarded` when
  # eddi.oidc.publicUrl is https, since the pod itself serves plain http and an
  # https public URL means something in front terminates TLS. Without it the
  # token, jwks and userinfo endpoints in Keycloak's discovery document come out
  # as http:// (KC_HOSTNAME_BACKCHANNEL_DYNAMIC derives them from the request),
  # and MCP clients such as Claude Code refuse to send credentials to them. Set
  # `none` if Keycloak is reachable directly, without a proxy that overwrites
  # those headers — trusting them then lets a client pick the scheme and host.
  proxyHeaders: ""
  storage:
    size: 1Gi
    # storageClassName: standard

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

# ── Manager UI ─────────────────────────────────────────────
#
# No values, and no templates/manager.yaml. The Manager is bundled INTO the EDDI
# image (IRestManagerResource serves /manage, and manage.html ships in the jar),
# so it is already reachable through the eddi Service. The chart used to offer a
# `manager.*` block deploying a second Deployment from labsai/eddi-config-ui —
# a UI generation this repository no longer builds or publishes, pulled at the
# mutable `:latest` tag that every other image reference here deliberately
# avoids. Reach the Manager at http://<eddi-service>:7070/manage instead.

# ── Ingress ────────────────────────────────────────────────

ingress:
  enabled: false
  # className: nginx
  annotations: {}
    # nginx.ingress.kubernetes.io/proxy-buffering: "off"
  hosts:
    - host: eddi.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: eddi-tls
  #    hosts:
  #      - eddi.example.com

# ── Autoscaling ────────────────────────────────────────────
#
# Cluster mode only (eddi.messagingType=nats); refused with in-memory messaging,
# where EDDI cannot run more than one replica. While enabled the HPA owns the
# replica count and eddi.replicas is not rendered.

#
# CPU is a weak load signal for EDDI: a node waiting on LLM answers is busy
# with hundreds of turns at little CPU, so a CPU-only HPA may never scale up
# while turns queue or are refused with 503. The signal that matches the work
# is in-flight turns per pod — eddi_runtime_executor_active{pool="turn"}
# against eddi_conversation_max_in_flight_turns — exposed to the HPA through
# a custom-metrics adapter (prometheus-adapter or KEDA) and added under
# extraMetrics. Set a target to null to drop that metric. Before raising
# maxReplicas, size the database for it: every replica opens its own pool
# (see "Sizing" in docs/clustering.md).

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80
  # Further autoscaling/v2 metric entries, appended as given. Example, with a
  # prometheus-adapter rule that exposes eddi_runtime_executor_active{pool="turn"}
  # as the pod metric eddi_turns_in_flight:
  #   - type: Pods
  #     pods:
  #       metric:
  #         name: eddi_turns_in_flight
  #       target:
  #         type: AverageValue
  #         averageValue: "700"   # ~70 % of a 3 GiB pod's ~1000 in-flight limit
  extraMetrics: []
  # autoscaling/v2 behavior (scale-up/down policies and stabilization), as given.
  behavior: {}

# ── Pod Disruption Budget ──────────────────────────────────
#
# maxUnavailable at a single replica: `minAvailable: 1` against one replica
# means the eviction API can never succeed and `kubectl drain` hangs forever.
# When the release never runs fewer than two replicas (eddi.replicas > 1, or
# autoscaling with minReplicas > 1) minAvailable is used instead, so a drain
# never takes the last serving pod.

podDisruptionBudget:
  enabled: false
  maxUnavailable: 1
  minAvailable: 1

# ── Network Policy ─────────────────────────────────────────
#
# Renders templates/networkpolicy.yaml: default-deny for the EDDI pod plus
# explicit ingress/egress allowances. The egress rule mirrors the application's
# own SSRF blocklist (link-local / metadata, RFC1918, loopback, CGNAT) at the
# network layer.

networkPolicy:
  enabled: false
  # Namespaces allowed to reach EDDI on 7070, by metadata.name. The release
  # namespace is always allowed. Add your ingress controller's namespace here.
  allowedIngressNamespaces: []
  # Extra destination ports opened for egress (DNS/443 and the in-chart
  # datastores are handled automatically).
  extraEgressPorts: []
  # Where an external NATS (nats.externalUrl) lives, as NetworkPolicyPeers, e.g.
  #   - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: nats}}
  #   - ipBlock: {cidr: 10.20.0.0/24}
  # Empty allows the URL's port to any destination. The chart opens egress to an
  # external NATS automatically; without it the replicas could not reach NATS.
  natsEgressTo: []

  # Where trace export may go when eddi.tracing.otlpEndpoint is set: a list of
  # NetworkPolicy peers, opened on eddi.tracing.otlpPort only. The default is any
  # pod in the cluster (an in-cluster collector, the usual shape). Narrow it to
  # your collector, e.g.
  #   - namespaceSelector:
  #       matchLabels: { kubernetes.io/metadata.name: observability }
  #     podSelector:
  #       matchLabels: { app.kubernetes.io/name: opentelemetry-collector }
  # A collector OUTSIDE the cluster on 443 needs nothing here: external HTTPS is
  # already allowed. On any other port (4317, 4318, …) it needs an ipBlock for
  # its address — the default namespaceSelector matches cluster pods only, so
  # without one every span is dropped:
  #   - ipBlock: { cidr: 203.0.113.10/32 }
  # An empty list allows otlpPort to EVERY destination; use it only where that
  # breadth is acceptable.
  otlpEgressTo:
    - namespaceSelector: {}

# ── Monitoring (Prometheus Operator) ───────────────────────
#
# EDDI exposes Prometheus metrics at /q/metrics and the pod carries the
# prometheus.io/* scrape annotations (eddi.podAnnotations), so an
# annotation-driven Prometheus picks it up with nothing set here. For a stack in
# the same namespace without the operator, use the Kustomize component
# k8s/overlays/monitoring/.
#
# The two switches below are for the Prometheus Operator (kube-prometheus-stack
# and friends): both render custom resources whose CRDs only exist where the
# operator is installed, so both stay off by default. They are top-level, not
# under `monitoring.*` — that key was removed in chart 2.0.0, see Chart.yaml.
#
# With OIDC on, /q/metrics needs a token (eddi.metrics.httpPolicy). Give the
# ServiceMonitor one through serviceMonitor.endpointConfig, e.g.
#   authorization: { credentials: { name: eddi-metrics-token, key: token } }
# or an `oauth2:` block — see docs/monitoring/monitoring-guide.md.

serviceMonitor:
  # Render a ServiceMonitor for the EDDI Service. It rewrites the scrape job to
  # "eddi", which the shipped alert rules and dashboards select on. If your
  # Prometheus ALSO honours the prometheus.io/* pod annotations, clear
  # eddi.podAnnotations or EDDI is scraped twice. With networkPolicy.enabled, add
  # the Prometheus namespace (kube-prometheus-stack: usually "monitoring") to
  # networkPolicy.allowedIngressNamespaces, or every scrape times out.
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  # Extra labels for the ServiceMonitor, e.g. `release: kube-prometheus-stack`
  # when your Prometheus selects ServiceMonitors by label.
  labels: {}
  # Merged into the endpoint as-is: authorization, oauth2, tlsConfig, …
  endpointConfig: {}

prometheusRule:
  # Render the shipped alert rules (helm/eddi/files/eddi-alerts.yml, a copy of
  # docs/monitoring/eddi-alerts.yml) as a PrometheusRule. Runbooks are in
  # docs/monitoring/monitoring-guide.md.
  enabled: false
  # Extra labels, e.g. `release: kube-prometheus-stack` for a Prometheus that
  # selects rules by label.
  labels: {}

# ── Service Account ────────────────────────────────────────
#
# create=false plus a name is the bring-your-own-SA shape (EKS IRSA, GKE
# Workload Identity, AKS pod identity): the SA is provisioned and annotated
# outside the chart and the Deployment just references it.

serviceAccount:
  create: true
  name: ""
  annotations: {}
  # EDDI never calls the Kubernetes API, so its pod does not mount the service
  # account token: a process that reaches the container (an RCE, a hostile
  # dependency) gets no API credential to escalate with. Set true only if you
  # add something that needs one — cloud workload identity (IRSA, GKE Workload
  # Identity) injects its own projected token and does not need this.
  automountToken: false

# ── Namespace ──────────────────────────────────────────────
#
# No value. Helm takes the namespace from `--namespace`; a `namespace: eddi`
# value used to sit here that no template read, so `--set namespace=foo` put the
# release somewhere else entirely without an error.
