{{- if .Values.autoscaling.enabled }}
{{- if ne (include "eddi.messagingType" .) "nats" }}
{{- /*
     Second gate (deployment.yaml has the first): with in-memory messaging the
     conversation lock is JVM-local, so an HPA that scales past one replica
     would run two turns of one conversation at once. Cluster mode coordinates
     every replica through NATS. See docs/clustering.md.
*/ -}}
{{- fail "autoscaling.enabled=true is not supported with eddi.messagingType=in-memory — set eddi.messagingType=nats (cluster mode). See eddi.replicas in values.yaml." }}
{{- end }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "eddi.fullname" . }}
  labels:
    {{- include "eddi.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "eddi.fullname" . }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetMemoryUtilizationPercentage }}
---
{{- end }}
{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "eddi.fullname" . }}
  labels:
    {{- include "eddi.labels" . | nindent 4 }}
spec:
  {{- if or .Values.autoscaling.enabled (gt (int .Values.eddi.replicas) 1) }}
  # More than one replica: a drain may never take the last serving pod.
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  {{- else }}
  # maxUnavailable at a single replica: `minAvailable: 1` against one replica
  # blocks the eviction API outright, so `kubectl drain` never completes.
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "eddi.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
{{- end }}
