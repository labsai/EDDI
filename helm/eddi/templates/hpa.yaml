{{- if .Values.autoscaling.enabled }}
{{- /*
     Unreachable in practice: deployment.yaml already fails rendering when
     autoscaling.enabled is true. Kept as a second gate so that lifting the
     restriction is a deliberate, reviewed edit in both places rather than an
     accidental one.

     EDDI serialises the turns of a conversation with a JVM-local lock, so an
     HPA that scales past one replica silently drops conversation turns. See
     eddi.replicas in values.yaml.
*/ -}}
{{- fail "autoscaling.enabled=true is not supported — EDDI cannot run more than one replica until a distributed conversation coordinator ships. See eddi.replicas in values.yaml." }}
{{- end }}
{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "eddi.fullname" . }}
  labels:
    {{- include "eddi.labels" . | nindent 4 }}
spec:
  # maxUnavailable, not minAvailable: EDDI runs at exactly 1 replica, and
  # `minAvailable: 1` against a single replica blocks the eviction API outright,
  # so `kubectl drain` never completes and node maintenance stalls.
  maxUnavailable: {{ .Values.podDisruptionBudget.maxUnavailable }}
  selector:
    matchLabels:
      {{- include "eddi.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
{{- end }}
