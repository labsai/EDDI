{{- if .Values.mongodb.enabled }}
{{- $mongoAuth := .Values.mongodb.auth | default dict }}
{{- if $mongoAuth.enabled }}
{{- $mongoUser := required "mongodb.auth.username is required when mongodb.auth.enabled=true." $mongoAuth.username }}
{{- $mongoPassword := required "mongodb.auth.password is required when mongodb.enabled=true and mongodb.auth.enabled=true — the in-chart MongoDB no longer runs without authentication and the chart ships no default. Generate one: openssl rand -hex 24. UPGRADING an install that ran without auth? Create the user in the running database FIRST (kubectl exec into the mongodb pod and run mongosh admin with db.createUser, roles root — the exact command is under mongodb.auth in values.yaml), then upgrade with the same password. Or set mongodb.auth.enabled=false to keep the old unauthenticated database." $mongoAuth.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "eddi.fullname" . }}-mongodb
  labels:
    {{- include "eddi.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
type: Opaque
stringData:
  # Read by the mongo container's entrypoint, which creates this root user when
  # it initialises an EMPTY data directory and starts mongod with --auth.
  MONGO_INITDB_ROOT_USERNAME: {{ $mongoUser | quote }}
  MONGO_INITDB_ROOT_PASSWORD: {{ $mongoPassword | quote }}
  # Consumed by EDDI as a mounted config FILE (see the projected volume in
  # deployment.yaml), never as an env var and never in the ConfigMap: the
  # connection string now carries the password. urlquery percent-encodes both
  # halves of the userinfo, which the driver decodes again.
  mongodb-secrets.properties: |
    mongodb.connectionString=mongodb://{{ $mongoUser | urlquery }}:{{ $mongoPassword | urlquery }}@{{ include "eddi.fullname" . }}-mongodb:27017/eddi?authSource=admin&retryWrites=true&w=majority&connectTimeoutMS=10000&socketTimeoutMS=30000
---
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "eddi.fullname" . }}-mongodb
  labels:
    {{- include "eddi.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  serviceName: {{ include "eddi.fullname" . }}-mongodb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "eddi.fullname" . }}-mongodb
      app.kubernetes.io/component: database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "eddi.fullname" . }}-mongodb
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: eddi
    spec:
      # MongoDB never talks to the Kubernetes API.
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 999
      containers:
        - name: mongodb
          image: "{{ .Values.mongodb.image.repository }}:{{ .Values.mongodb.image.tag }}"
          ports:
            - containerPort: 27017
              name: mongo
          {{- if $mongoAuth.enabled }}
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "eddi.fullname" . }}-mongodb
                  key: MONGO_INITDB_ROOT_USERNAME
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "eddi.fullname" . }}-mongodb
                  key: MONGO_INITDB_ROOT_PASSWORD
          {{- end }}
          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db
          resources:
            {{- toYaml .Values.mongodb.resources | nindent 12 }}
          readinessProbe:
            exec:
              command: ["mongosh", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 5
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: mongodb-data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.mongodb.storage.storageClassName }}
        storageClassName: {{ .Values.mongodb.storage.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.mongodb.storage.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "eddi.fullname" . }}-mongodb
  labels:
    {{- include "eddi.labels" . | nindent 4 }}
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: {{ include "eddi.fullname" . }}-mongodb
    app.kubernetes.io/component: database
  ports:
    - name: mongo
      port: 27017
      targetPort: mongo
{{- end }}
