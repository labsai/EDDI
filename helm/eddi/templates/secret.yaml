apiVersion: v1
kind: Secret
metadata:
  name: {{ include "eddi.fullname" . }}-secrets
  labels:
    {{- include "eddi.labels" . | nindent 4 }}
type: Opaque
stringData:
  # One key holding a Quarkus properties file. The Deployment mounts it as a
  # file (projected volume, mode 0400) and points QUARKUS_CONFIG_LOCATIONS at
  # it — secrets are deliberately NOT injected as environment variables.
  #
  # `required` makes rendering fail loudly instead of shipping an empty vault
  # key, which would silently disable secret encryption.
  application-secrets.properties: |
    eddi.vault.master-key={{ required "eddi.vaultMasterKey is required — the chart will not render without it. Generate one: openssl rand -base64 24. ⚠️ Losing this key makes every stored secret UNRECOVERABLE." .Values.eddi.vaultMasterKey }}
