apiVersion: v1
kind: Secret
metadata:
  name: {{ include "eddi.fullname" . }}-secrets
  labels:
    {{- include "eddi.labels" . | nindent 4 }}
type: Opaque
stringData:
  # One key holding a Quarkus properties file. The Deployment mounts it as a
  # file (projected volume, mode 0400) and points QUARKUS_CONFIG_LOCATIONS at
  # it — secrets are deliberately NOT injected as environment variables.
  #
  # `required` makes rendering fail loudly instead of shipping an empty vault
  # key, which would silently disable secret encryption.
  #
  # The external-datastore credentials ride in this same file rather than in
  # eddi-config: both are credential-bearing, and a ConfigMap is readable by
  # anything holding `get configmaps` in the namespace. Quarkus property
  # spellings, not env-var spellings — this is a properties file, and
  # PersistenceModule reads @ConfigProperty(name = "mongodb.connectionString").
  application-secrets.properties: |
    eddi.vault.master-key={{ required "eddi.vaultMasterKey is required — the chart will not render without it. Generate one: openssl rand -base64 24. ⚠️ Losing this key makes every stored secret UNRECOVERABLE." .Values.eddi.vaultMasterKey }}
    {{- if .Values.mongodb.enabled }}
    {{- /*
      The in-chart MongoDB runs with --auth, so EDDI authenticates as the root user
      the mongodb Secret created. This string carries the password, so it lives here
      (a mounted Secret file) and never in the ConfigMap. authSource=admin: the root
      user is defined in the admin database, not in `eddi`.
    */}}
    mongodb.connectionString=mongodb://{{ .Values.mongodb.rootUsername }}:{{ required "mongodb.rootPassword is required when mongodb.enabled=true" .Values.mongodb.rootPassword }}@{{ include "eddi.fullname" . }}-mongodb:27017/eddi?authSource=admin&retryWrites=true&w=majority&connectTimeoutMS=10000&socketTimeoutMS=30000
    {{- end }}
    {{- with .Values.eddi.datastore.externalConnectionString }}
    mongodb.connectionString={{ . }}
    {{- end }}
    {{- if and (not .Values.postgres.enabled) .Values.eddi.datastore.externalJdbcUrl }}
    {{- /*
      An external PostgreSQL had no credentials path at all: the chart rendered
      QUARKUS_DATASOURCE_JDBC_URL and nothing else, so the pod died on "password
      authentication failed" and the only workaround was ?user=…&password=… in
      the URL — in a ConfigMap, in plaintext. `required` on both, because a
      datasource missing either fails at runtime with an error that names
      neither the chart value nor the missing half.
    */}}
    quarkus.datasource.username={{ required "eddi.datastore.externalJdbcUsername is required when eddi.datastore.externalJdbcUrl is set: the chart renders no credentials for an external PostgreSQL otherwise, and the pod fails every connection with 'password authentication failed'. Do NOT put credentials in the JDBC URL — it is rendered into a ConfigMap." .Values.eddi.datastore.externalJdbcUsername }}
    quarkus.datasource.password={{ required "eddi.datastore.externalJdbcPassword is required when eddi.datastore.externalJdbcUrl is set: the chart renders no credentials for an external PostgreSQL otherwise, and the pod fails every connection with 'password authentication failed'. Do NOT put credentials in the JDBC URL — it is rendered into a ConfigMap." .Values.eddi.datastore.externalJdbcPassword }}
    {{- end }}
