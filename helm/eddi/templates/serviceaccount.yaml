{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "eddi.serviceAccountName" . }}
  labels:
    {{- include "eddi.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Belt and braces with the pod-level setting in deployment.yaml: a pod that
# names this account without saying otherwise does not get its token either.
automountServiceAccountToken: {{ .Values.serviceAccount.automountToken | default false }}
{{- end }}
