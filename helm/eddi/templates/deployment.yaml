{{- $clustered := eq (include "eddi.messagingType" .) "nats" }}
{{- if and .Values.autoscaling.enabled (not $clustered) }}
{{- fail "autoscaling.enabled=true is not supported with eddi.messagingType=in-memory: the conversation lock is JVM-local, so a second replica would run two turns of one conversation at once. Set eddi.messagingType=nats (cluster mode, see docs/clustering.md), or scale vertically via eddi.resources." }}
{{- end }}
{{- if and (gt (int .Values.eddi.replicas) 1) (not $clustered) }}
{{- fail "eddi.replicas must be 1 with eddi.messagingType=in-memory: the conversation lock is JVM-local, so extra replicas would run two turns of one conversation at once. Set eddi.messagingType=nats (cluster mode, see docs/clustering.md), or scale vertically via eddi.resources." }}
{{- end }}
{{- $strategy := include "eddi.updateStrategy" . }}
{{- if and (eq $strategy "RollingUpdate") (not $clustered) }}
{{- fail "eddi.updateStrategy=RollingUpdate needs eddi.messagingType=nats: a rolling update runs the old and the new pod against one database at once, and single-node (in-memory) EDDI keeps its conversation lock, nonces and caches in the JVM. Use Recreate (the in-memory default)." }}
{{- end }}
{{- $grace := include "eddi.terminationGracePeriodSeconds" . | int }}
{{- $drain := include "eddi.shutdownDrainTimeoutSeconds" . | int }}
{{- if and $drain (le $grace (add $drain 3)) }}
{{- fail (printf "eddi.terminationGracePeriodSeconds (%d) must exceed the shutdown drain (%d s) plus the readiness grace (3 s): Kubernetes kills the pod at the end of the grace period, so a longer drain is cut short and its turns are abandoned mid-write." $grace $drain) }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "eddi.fullname" . }}
  labels:
    {{- include "eddi.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  # Omitted while an HPA owns the replica count (cluster mode only).
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.eddi.replicas }}
  {{- end }}
  strategy:
    type: {{ $strategy }}
    {{- if eq $strategy "RollingUpdate" }}
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    {{- end }}
  selector:
    matchLabels:
      {{- include "eddi.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        {{- include "eddi.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: server
      annotations:
        {{- /*
          Every setting EDDI reads arrives from exactly two objects: eddi-config,
          consumed through `envFrom` below, and eddi-secrets, consumed through the
          projected volume. Neither is part of this pod template, so a
          `helm upgrade` that changed only them left this Deployment's spec
          byte-identical — no new ReplicaSet, no rollout, and the running pod kept
          the environment it started with. Enabling OIDC, moving to an external
          datastore or rotating the vault master key therefore reported a
          successful upgrade and changed nothing until somebody restarted the pod
          by hand.

          `envFrom` is the sharper half: a ConfigMap mounted as a VOLUME is at
          least refreshed in place by the kubelet, but environment variables are
          fixed at container start and no amount of waiting updates them.

          Hashing the rendered templates puts that change back INTO the pod spec,
          which is what makes the rollout happen. Rendered, not `.Values` —
          configmap.yaml derives most of what it emits (the validated datastore
          type, the derived unauthenticated flags, the trimmed public URL), so a
          hash of the inputs would miss a change that only the output shows.
        */}}
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      {{- with .Values.eddi.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      # Always rendered. Gating this on serviceAccount.create discarded
      # serviceAccount.name whenever create=false — the bring-your-own-SA shape
      # used for EKS IRSA, GKE Workload Identity and AKS pod identity — and the
      # pod then ran under the namespace's `default` ServiceAccount, so the
      # cloud IAM role bound to the named SA was never assumed and Helm printed
      # nothing. The helper returns the right name in both branches.
      serviceAccountName: {{ include "eddi.serviceAccountName" . }}
      # EDDI never calls the Kubernetes API; see serviceAccount.automountToken.
      automountServiceAccountToken: {{ .Values.serviceAccount.automountToken | default false }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 185
        runAsGroup: 185
        fsGroup: 185
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: {{ $grace }}
      {{- if $clustered }}
      # Spread replicas over nodes and zones, so one node failure takes out at
      # most one of them.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "eddi.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: server
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "eddi.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: server
      {{- end }}
      volumes:
        # Secrets arrive as FILES, never as environment variables: environ is
        # readable through /proc/<pid>/environ by anything sharing the PID
        # namespace, and it leaks into crash dumps and child processes.
        # Each Secret contributes one *.properties file; QUARKUS_CONFIG_LOCATIONS
        # below lists them for the Quarkus config system.
        - name: eddi-secrets
          projected:
            defaultMode: 0400
            sources:
              - secret:
                  name: {{ include "eddi.fullname" . }}-secrets
              {{- if .Values.postgres.enabled }}
              - secret:
                  name: {{ include "eddi.fullname" . }}-postgres
                  items:
                    - key: postgres-secrets.properties
                      path: postgres-secrets.properties
              {{- end }}
        # readOnlyRootFilesystem needs explicit writable scratch space.
        # What the app actually writes at runtime:
        #   /tmp             java.io.tmpdir — Quarkus multipart upload buffer and
        #                    PdfReaderTool's Files.createTempFile
        #   /deployments/tmp agent export/import scratch (RestExportService /
        #                    RestImportService build it under ${user.dir}/tmp)
        #   /opt/eddi/data   audit ledger dead-letter file
        - name: tmp
          emptyDir: {}
        - name: deployments-tmp
          emptyDir: {}
        - name: eddi-data
          emptyDir: {}
      containers:
        - name: eddi
          # Prefer a digest: set eddi.image.digest so the running bits are the
          # exact ones CI cosign-signed and SLSA-attested. Resolve it with
          #   cosign verify --certificate-oidc-issuer https://token.actions.githubusercontent.com \
          #     --certificate-identity-regexp '^https://github\.com/labsai/EDDI/\.github/workflows/ci\.yml@refs/(heads/main|tags/.+)$' \
          #     labsai/eddi:<tag>
          #   crane digest labsai/eddi:<tag>
          image: "{{ .Values.eddi.image.repository }}:{{ include "eddi.imageTag" . }}{{- with .Values.eddi.image.digest }}@{{ . }}{{- end }}"
          imagePullPolicy: {{ .Values.eddi.image.pullPolicy }}
          # Container-level hardening — without this the pod is rejected outright
          # by a namespace running the "restricted" Pod Security Standard.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 185
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 7070
              name: http
              protocol: TCP
          env:
            {{- if $clustered }}
            # Cluster mode: each replica's node id is its pod name (unique, stable).
            - name: EDDI_CLUSTER_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- end }}
            - name: QUARKUS_CONFIG_LOCATIONS
              value: "/etc/eddi/secrets/application-secrets.properties{{ if .Values.postgres.enabled }},/etc/eddi/secrets/postgres-secrets.properties{{ end }}"
          envFrom:
            - configMapRef:
                name: {{ include "eddi.fullname" . }}-config
          volumeMounts:
            - name: eddi-secrets
              mountPath: /etc/eddi/secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: deployments-tmp
              mountPath: /deployments/tmp
            - name: eddi-data
              mountPath: /opt/eddi/data
          {{- $startupProbe := .Values.eddi.startupProbe | default dict }}
          # Liveness, not readiness: see eddi.startupProbe in values.yaml.
          startupProbe:
            httpGet:
              path: {{ $startupProbe.path | default "/q/health/live" }}
              port: http
            failureThreshold: {{ $startupProbe.failureThreshold | default 30 }}
            periodSeconds: {{ $startupProbe.periodSeconds | default 2 }}
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.eddi.resources | nindent 12 }}
