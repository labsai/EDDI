version: 2
updates:
  # Maven dependencies
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - chore
    groups:
      # Group minor/patch Quarkus updates together
      quarkus:
        patterns:
          - "io.quarkus*"
        update-types:
          - minor
          - patch
      # Group minor/patch LangChain4j updates together
      langchain4j:
        patterns:
          - "dev.langchain4j*"
        update-types:
          - minor
          - patch
      # Group all other minor/patch updates
      minor-and-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "io.quarkus*"
          - "dev.langchain4j*"
        update-types:
          - minor
          - patch

  # Docker base image digests
  - package-ecosystem: docker
    directory: /src/main/docker
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - security
    commit-message:
      prefix: "chore(docker)"

  # MCP bridge sidecar base image digest.
  # mcp-sidecar/Dockerfile is digest-pinned and built by
  # docker-compose.mcp-sidecar.yml, but sat in no ecosystem at all, so it aged
  # silently while the published image's base was watched twice over (here and
  # by base-image-check.yml).
  - package-ecosystem: docker
    directory: /mcp-sidecar
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - security
    commit-message:
      prefix: "chore(docker)"

  # KNOWN GAP — the ten third-party images pinned across docker-compose*.yml
  # (mongo, postgres, keycloak, nats, ollama, chroma, prometheus, grafana,
  # jaeger, curl) are in NO ecosystem here. The `docker` ecosystem only reads
  # Dockerfiles, so the images every user actually runs alongside EDDI are
  # updated when a human remembers, while the published image's own base is
  # watched twice over (above, and weekly by base-image-check.yml).
  #
  # Closing it means either a `docker-compose` ecosystem entry or teaching
  # base-image-check.yml's skopeo digest comparison to iterate the `image:`
  # lines in docker-compose*.yml. Left open deliberately rather than guessed at:
  # an unrecognised package-ecosystem invalidates this WHOLE file, which would
  # silently stop the Maven and base-image updates above — a worse outcome than
  # the gap it would close.

  # ClusterFuzzLite base image digest
  - package-ecosystem: docker
    directory: /.clusterfuzzlite
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - security
    commit-message:
      prefix: "chore(docker)"

  # The two frontends under ui/. They ran Renovate in their own repos (automerge
  # of minor/patch once CI was green); the Renovate app is not installed on this
  # repository, and two bots on one repo is the one clearly wrong option.
  - package-ecosystem: npm
    directory: /ui/manager
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - chore
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # Carried over from the Manager's renovate.json: v8 folds react-router-dom
      # into react-router, so an automated major breaks every import. Minor and
      # patch bumps stay enabled — that is how a security fix arrives.
      - dependency-name: "react-router*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /ui/chat
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - chore
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # Same as the Manager: a react-router v8 major needs a manual migration.
      - dependency-name: "react-router*"
        update-types: ["version-update:semver-major"]

  # GitHub Actions versions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
