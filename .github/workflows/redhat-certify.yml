name: Red Hat Certification Release

# Publishes an already-released image to Red Hat's HOSTED certification
# registry and submits the preflight results. EDDI distributes on two
# registries: docker.io (published by ci.yml on the release tag) and Red Hat's
# catalog (published here, per release, after the fact).
#
# The certification project is a "hosted registry" project: Pyxis requires the
# certified image to live in quay.io/redhat-isv-containers/<project-id>, from
# where Red Hat serves it to customers via registry.connect.redhat.com.
# Submitting results for a docker.io-hosted image is rejected with
# "The 'container.registry' field is immutable for projects with hosted
# registry" - which is how this flow's predecessor failed.
#
# Required secrets, all from the certification project in Partner Connect:
#   REDHAT_CERT_PROJECT_ID     - the project id (also the hosted repo name)
#   REDHAT_REGISTRY_USERNAME   - the project's registry robot user
#                                (shown with the key on the "Registry key" page)
#   REDHAT_REGISTRY_KEY        - the project's registry key (the robot password)
#   REDHAT_API_TOKEN           - Pyxis API token, for --submit

on:
  # Called automatically by ci.yml on every stable release tag, and manually
  # dispatchable for re-submissions (bump `release` to 2, 3, ... - the version
  # itself never changes for a re-submission).
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      release:
        required: false
        type: string
        default: "1"
      submit:
        required: false
        type: string
        default: "true"
  workflow_dispatch:
    inputs:
      version:
        description: "EDDI version (e.g. 6.4.0)"
        required: true
        default: "6.4.0"
      release:
        description: "Release number (e.g. 1, 2, 3)"
        required: true
        default: "1"
      submit:
        description: "Submit results to Red Hat (true/false)"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]

permissions:
  contents: read

jobs:
  certify:
    name: Publish to Red Hat Registry & Certify
    runs-on: ubuntu-latest

    steps:
      # Certification runs against the image that was ALREADY published and
      # signed by ci.yml on the release tag. It deliberately does NOT rebuild:
      # a rebuild produces a different digest, is not covered by the release's
      # cosign signature or SLSA attestation, and would put bytes in Red Hat's
      # catalog that differ from what docker.io users pull.
      #
      # Inputs reach the shell through `env:`, never through ${{ }}
      # interpolation. Interpolation splices the value into the script text
      # before Bash parses it, so a crafted version/release could close the
      # quoting and run commands with the registry credentials this job holds.
      - name: Set image coordinates
        id: image
        env:
          VERSION: ${{ inputs.version }}
          RELEASE: ${{ inputs.release }}
          PROJECT_ID: ${{ secrets.REDHAT_CERT_PROJECT_ID }}
        run: |
          set -euo pipefail
          case "${VERSION}" in
            ''|*[!0-9A-Za-z._-]*)
              echo "::error::version must contain only [0-9A-Za-z._-] (got: ${VERSION})"; exit 1;;
          esac
          case "${RELEASE}" in
            ''|*[!0-9]*|0|0*)
              echo "::error::release must be a positive integer without leading zeros (got: ${RELEASE})"; exit 1;;
          esac
          if [ -z "${PROJECT_ID}" ]; then
            echo "::error::REDHAT_CERT_PROJECT_ID secret is not set"; exit 1
          fi

          {
            echo "released=docker.io/labsai/eddi:${VERSION}"
            echo "hosted=quay.io/redhat-isv-containers/${PROJECT_ID}:${VERSION}"
            echo "certified=quay.io/redhat-isv-containers/${PROJECT_ID}:${VERSION}-${RELEASE}"
          } >> "$GITHUB_OUTPUT"

      - name: Pull the published release image
        id: pull
        env:
          RELEASED: ${{ steps.image.outputs.released }}
        run: |
          set -euo pipefail
          if ! docker pull "${RELEASED}"; then
            echo "::error::${RELEASED} is not published. This workflow certifies an already-released image - release the version first, then run this."
            exit 1
          fi
          # Ask the registry, not the local cache, so the digest is what a user pulling this tag receives.
          DIGEST="$(docker buildx imagetools inspect "${RELEASED}" --format '{{.Manifest.Digest}}')"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Certifying the released digest: ${DIGEST}"

      - name: Verify Red Hat labels
        env:
          RELEASED: ${{ steps.image.outputs.released }}
        run: |
          set -euo pipefail
          echo "=== Container Labels ==="
          docker inspect "${RELEASED}" --format '{{json .Config.Labels}}' | python3 -m json.tool

      - name: Verify /licenses in container
        env:
          RELEASED: ${{ steps.image.outputs.released }}
        run: |
          set -euo pipefail
          echo "=== /licenses directory ==="
          docker run --rm --entrypoint="" "${RELEASED}" ls -la /licenses/
          echo ""
          echo "=== THIRD-PARTY.txt in container ==="
          docker run --rm --entrypoint="" "${RELEASED}" head -30 /licenses/THIRD-PARTY.txt || true

      - name: Login to the Red Hat hosted registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: quay.io
          username: ${{ secrets.REDHAT_REGISTRY_USERNAME }}
          password: ${{ secrets.REDHAT_REGISTRY_KEY }}

      # Retagging the pulled image reuses its manifest, so the hosted tags
      # carry the SAME digest as the docker.io release - a rename, not a
      # rebuild. Two tags land in the hosted repo: <version> is what the
      # catalog offers customers, <version>-<release> is the coordinate this
      # certification attempt runs against. docker.io is never pushed here.
      - name: Publish to the hosted repository
        env:
          RELEASED: ${{ steps.image.outputs.released }}
          HOSTED: ${{ steps.image.outputs.hosted }}
          CERTIFIED: ${{ steps.image.outputs.certified }}
          EXPECTED: ${{ steps.pull.outputs.digest }}
        run: |
          set -euo pipefail
          docker tag "${RELEASED}" "${HOSTED}"
          docker tag "${RELEASED}" "${CERTIFIED}"
          docker push "${HOSTED}"
          docker push "${CERTIFIED}"

          PUSHED="$(docker buildx imagetools inspect "${CERTIFIED}" --format '{{.Manifest.Digest}}')"
          if [ "${PUSHED}" != "${EXPECTED}" ]; then
            echo "::error::${CERTIFIED} resolved to ${PUSHED}, expected the released digest ${EXPECTED}. Refusing to certify an image that is not the released one."
            exit 1
          fi
          echo "OK: ${CERTIFIED} is the released digest ${EXPECTED}"

      - name: Install preflight
        env:
          PREFLIGHT_VERSION: "1.20.0"
          PREFLIGHT_SHA256: "43a8c5046c800442e58a37f583a9523d79421e81aec3a741c53c9fcffc82955b"
        run: |
          echo "Installing preflight ${PREFLIGHT_VERSION}..."
          curl -sL "https://github.com/redhat-openshift-ecosystem/openshift-preflight/releases/download/${PREFLIGHT_VERSION}/preflight-linux-amd64" \
            -o /usr/local/bin/preflight
          echo "${PREFLIGHT_SHA256}  /usr/local/bin/preflight" | sha256sum -c -
          chmod +x /usr/local/bin/preflight
          preflight --version

      - name: Run preflight check
        env:
          REDHAT_API_TOKEN: ${{ secrets.REDHAT_API_TOKEN }}
          REDHAT_CERT_PROJECT_ID: ${{ secrets.REDHAT_CERT_PROJECT_ID }}
          CERTIFIED: ${{ steps.image.outputs.certified }}
          SUBMIT: ${{ inputs.submit }}
        run: |
          # Pass credentials via preflight's native env vars (avoids process-listing exposure)
          if [ -n "$REDHAT_API_TOKEN" ] && [ -n "$REDHAT_CERT_PROJECT_ID" ]; then
            export PFLT_PYXIS_API_TOKEN="$REDHAT_API_TOKEN"
            export PFLT_CERTIFICATION_COMPONENT_ID="$REDHAT_CERT_PROJECT_ID"
          else
            echo "::warning::REDHAT_API_TOKEN or REDHAT_CERT_PROJECT_ID secret is missing"
          fi

          SUBMIT_FLAG=""
          if [ "${SUBMIT}" = "true" ]; then
            SUBMIT_FLAG="--submit"
          fi

          preflight check container \
            "${CERTIFIED}" \
            --docker-config=${HOME}/.docker/config.json \
            ${SUBMIT_FLAG} \
            2>&1 | tee preflight-results.txt
          PREFLIGHT_EXIT=${PIPESTATUS[0]}
          echo ""
          echo "=== Preflight Summary ==="
          if [ "$PREFLIGHT_EXIT" -ne 0 ] || grep -q "FAILED" preflight-results.txt; then
            echo "::error::Preflight certification check FAILED (exit code: ${PREFLIGHT_EXIT})"
            echo "The container will not pass Red Hat certification in its current state."
            exit 1
          else
            echo "✅ All preflight checks passed"
            if [ -n "$SUBMIT_FLAG" ]; then
              echo "📤 Results submitted to Red Hat Partner Connect"
            fi
          fi

      - name: Upload preflight results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: preflight-results
          path: |
            preflight-results.txt
            artifacts/
          retention-days: 30
