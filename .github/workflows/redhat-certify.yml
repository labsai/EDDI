name: Red Hat Certification Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "EDDI version (e.g. 6.3.0)"
        required: true
        default: "6.3.0"
      release:
        description: "Release number (e.g. 1, 2, 3)"
        required: true
        default: "1"
      submit:
        description: "Submit results to Red Hat (true/false)"
        required: true
        default: "true"
        type: choice
        options: ["true", "false"]
      registry:
        description: "Target registry"
        required: true
        default: "docker.io"
        type: choice
        options: ["docker.io", "quay.io"]

permissions:
  contents: read

jobs:
  certify:
    name: Certify Published Image
    runs-on: ubuntu-latest

    steps:
      # Certification runs against the image that was ALREADY published and signed
      # by ci.yml on the release tag. It deliberately does NOT rebuild: a rebuild
      # produces a different digest, is not covered by the release's cosign
      # signature or SLSA attestation, and pushing it over :<version> and :latest
      # would replace what users pull with unsigned bytes.
      #
      # Inputs reach the shell through `env:`, never through ${{ }} interpolation.
      # Interpolation splices the value into the script text before Bash parses
      # it, so a crafted version/release could close the quoting and run commands
      # with the registry credentials this job holds.
      - name: Set image coordinates
        id: image
        env:
          REGISTRY: ${{ inputs.registry }}
          VERSION: ${{ inputs.version }}
          RELEASE: ${{ inputs.release }}
        run: |
          set -euo pipefail
          case "${VERSION}" in
            ''|*[!0-9A-Za-z._-]*)
              echo "::error::version must contain only [0-9A-Za-z._-] (got: ${VERSION})"; exit 1;;
          esac
          case "${RELEASE}" in
            ''|*[!0-9]*|0|0*)
              echo "::error::release must be a positive integer without leading zeros (got: ${RELEASE})"; exit 1;;
          esac

          IMAGE="${REGISTRY}/labsai/eddi"
          {
            echo "released=${IMAGE}:${VERSION}"
            echo "certified=${IMAGE}:${VERSION}-${RELEASE}"
          } >> "$GITHUB_OUTPUT"

      - name: Login to registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ inputs.registry }}
          username: ${{ inputs.registry == 'quay.io' && secrets.QUAY_USERNAME || secrets.DOCKER_USERNAME }}
          password: ${{ inputs.registry == 'quay.io' && secrets.QUAY_PASSWORD || secrets.DOCKER_PASSWORD }}

      - name: Pull the published release image
        id: pull
        env:
          RELEASED: ${{ steps.image.outputs.released }}
        run: |
          set -euo pipefail
          if ! docker pull "${RELEASED}"; then
            echo "::error::${RELEASED} is not published. This workflow certifies an already-released image - release the version first, then run this."
            exit 1
          fi
          # Ask the registry, not the local cache, so the digest is what a user pulling this tag receives.
          DIGEST="$(docker buildx imagetools inspect "${RELEASED}" --format '{{.Manifest.Digest}}')"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Certifying the released digest: ${DIGEST}"

      - name: Verify Red Hat labels
        env:
          RELEASED: ${{ steps.image.outputs.released }}
        run: |
          set -euo pipefail
          echo "=== Container Labels ==="
          docker inspect "${RELEASED}" --format '{{json .Config.Labels}}' | python3 -m json.tool

      - name: Verify /licenses in container
        env:
          RELEASED: ${{ steps.image.outputs.released }}
        run: |
          set -euo pipefail
          echo "=== /licenses directory ==="
          docker run --rm --entrypoint="" "${RELEASED}" ls -la /licenses/
          echo ""
          echo "=== THIRD-PARTY.txt in container ==="
          docker run --rm --entrypoint="" "${RELEASED}" head -30 /licenses/THIRD-PARTY.txt || true

      # Red Hat's catalogue keys on a version-release coordinate. Retagging the
      # pulled image reuses its manifest, so this tag carries the SAME digest as
      # the released one - a rename, not a rebuild. :<version> and :latest are
      # never pushed here.
      - name: Publish the version-release coordinate
        env:
          RELEASED: ${{ steps.image.outputs.released }}
          CERTIFIED: ${{ steps.image.outputs.certified }}
          EXPECTED: ${{ steps.pull.outputs.digest }}
        run: |
          set -euo pipefail
          docker tag "${RELEASED}" "${CERTIFIED}"
          docker push "${CERTIFIED}"

          PUSHED="$(docker buildx imagetools inspect "${CERTIFIED}" --format '{{.Manifest.Digest}}')"
          if [ "${PUSHED}" != "${EXPECTED}" ]; then
            echo "::error::${CERTIFIED} resolved to ${PUSHED}, expected the released digest ${EXPECTED}. Refusing to certify an image that is not the released one."
            exit 1
          fi
          echo "OK: ${CERTIFIED} is the released digest ${EXPECTED}"

      - name: Install preflight
        env:
          PREFLIGHT_VERSION: "1.20.0"
          PREFLIGHT_SHA256: "43a8c5046c800442e58a37f583a9523d79421e81aec3a741c53c9fcffc82955b"
        run: |
          echo "Installing preflight ${PREFLIGHT_VERSION}..."
          curl -sL "https://github.com/redhat-openshift-ecosystem/openshift-preflight/releases/download/${PREFLIGHT_VERSION}/preflight-linux-amd64" \
            -o /usr/local/bin/preflight
          echo "${PREFLIGHT_SHA256}  /usr/local/bin/preflight" | sha256sum -c -
          chmod +x /usr/local/bin/preflight
          preflight --version

      - name: Run preflight check
        env:
          REDHAT_API_TOKEN: ${{ secrets.REDHAT_API_TOKEN }}
          REDHAT_CERT_PROJECT_ID: ${{ secrets.REDHAT_CERT_PROJECT_ID }}
          CERTIFIED: ${{ steps.image.outputs.certified }}
          SUBMIT: ${{ inputs.submit }}
        run: |
          # Pass credentials via preflight's native env vars (avoids process-listing exposure)
          if [ -n "$REDHAT_API_TOKEN" ] && [ -n "$REDHAT_CERT_PROJECT_ID" ]; then
            export PFLT_PYXIS_API_TOKEN="$REDHAT_API_TOKEN"
            export PFLT_CERTIFICATION_COMPONENT_ID="$REDHAT_CERT_PROJECT_ID"
          else
            echo "::warning::REDHAT_API_TOKEN or REDHAT_CERT_PROJECT_ID secret is missing"
          fi

          SUBMIT_FLAG=""
          if [ "${SUBMIT}" = "true" ]; then
            SUBMIT_FLAG="--submit"
          fi

          preflight check container \
            "${CERTIFIED}" \
            --docker-config=${HOME}/.docker/config.json \
            ${SUBMIT_FLAG} \
            2>&1 | tee preflight-results.txt
          PREFLIGHT_EXIT=${PIPESTATUS[0]}
          echo ""
          echo "=== Preflight Summary ==="
          if [ "$PREFLIGHT_EXIT" -ne 0 ] || grep -q "FAILED" preflight-results.txt; then
            echo "::error::Preflight certification check FAILED (exit code: ${PREFLIGHT_EXIT})"
            echo "The container will not pass Red Hat certification in its current state."
            exit 1
          else
            echo "✅ All preflight checks passed"
            if [ -n "$SUBMIT_FLAG" ]; then
              echo "📤 Results submitted to Red Hat Partner Connect"
            fi
          fi

      - name: Upload preflight results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: preflight-results
          path: |
            preflight-results.txt
            artifacts/
          retention-days: 30
