name: "CodeQL (Scheduled)"

# Schedule-only: weekly deep scan with latest CodeQL rules.
# Push/PR analysis is handled by the main ci.yml workflow.
on:
  schedule:
    - cron: '0 6 * * 1' # Weekly on Monday at 06:00 UTC

permissions:
  actions: read
  contents: read

jobs:
  analyze:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [ java-kotlin, javascript-typescript ]

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up JDK 25
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          languages: ${{ matrix.language }}
          # javascript-typescript (ui/manager, ui/chat) is analysed from source.
          build-mode: ${{ matrix.language == 'java-kotlin' && 'manual' || 'none' }}
          # The UI analysis scans the shipped UI sources only (see the file); the Java
          # analysis takes no config file.
          config-file: ${{ matrix.language == 'javascript-typescript' && './.github/codeql/codeql-ui.yml' || '' }}
          queries: security-extended

      - name: Set execute permission for mvnw
        if: matrix.language == 'java-kotlin'
        run: chmod +x mvnw

      - name: Build
        if: matrix.language == 'java-kotlin'
        # -DskipUi=true: compiling Java for analysis needs no npm build of the UIs.
        run: ./mvnw clean compile -DskipTests -DskipUi=true -B --no-transfer-progress

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          category: "/language:${{ matrix.language }}"
