name: CI/CD

on:
  push:
    branches: [main]
    tags: ["[0-9]*"]
  pull_request:
    branches: [main]

# Three pushes to a PR branch used to leave three full pipelines in flight —
# three `mvn clean test` runs over ~19,800 tests, three Testcontainers runs,
# three CodeQL builds — with the superseded ones never cancelled, so an older
# run could report onto a commit that is no longer the head. Pushes to main and
# tag pushes are NOT cancelled: a release must never be interrupted mid-publish.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  DOCKER_IMAGE: labsai/eddi
  JAVA_VERSION: "25"
  # Pin preflight version + hash — update both when upgrading
  PREFLIGHT_VERSION: "1.20.0"
  PREFLIGHT_SHA256: "43a8c5046c800442e58a37f583a9523d79421e81aec3a741c53c9fcffc82955b"
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

jobs:
  # ─── Job 0: Detect Changes ──────────────────────────────────────
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.result.outputs.code }}
      scripts: ${{ steps.result.outputs.scripts }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Check paths
        id: filter
        # Skipped on tag pushes — a release must run the FULL pipeline no matter
        # what the tagged commit happens to touch (see "Resolve" below).
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3
        with:
          filters: |
            # Everything the build, the image or the scanners are GOVERNED by has
            # to be here. A skipped required check still satisfies branch
            # protection (see the note on `scripts` below), so a config file that
            # is in no filter merges without a single job having evaluated it —
            # which is how a `.trivyignore` suppression or a relaxed
            # checkstyle.xml rule could land unreviewed by CI. The root-anchored
            # 'Dockerfile*' matched nothing: every Dockerfile lives under
            # src/main/docker/ or mcp-sidecar/.
            code:
              - 'src/**'
              - 'pom.xml'
              - '.github/workflows/**'
              - '**/Dockerfile*'
              - '**/.dockerignore'
              - 'docker-compose*.yml'
              - 'mcp-sidecar/**'
              - 'k8s/**'
              - 'helm/**'
              - 'mvnw*'
              - '.mvn/**'
              - 'checkstyle.xml'
              - 'eclipse-formatter.xml'
              - 'mise.toml'
              - '.trivyignore'
              - '.gitleaksignore'
              - 'licenses/**'
            # The installers are the README's headline `curl | bash` path and were
            # in NO filter at all, so a PR touching only them skipped the whole
            # pipeline — and a skipped required check still satisfies branch
            # protection. They do not need the Java build, just the shell lint.
            scripts:
              - 'install.sh'
              - 'install.ps1'
              - 'scripts/**'
              - '.githooks/**'
              - 'mvnw*'

      - name: Resolve
        id: result
        run: |
          # A tag push always counts as a code change. The docker job used to
          # bypass its own gates with always() + a tag short-circuit so that a
          # release could not be skipped by the path filter — which also meant a
          # tag published REGARDLESS of test results. Forcing code=true here lets
          # docker rely on plain `needs` success instead, so a tag on a commit
          # with failing tests builds nothing.
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "code=true" >> $GITHUB_OUTPUT
            echo "scripts=true" >> $GITHUB_OUTPUT
          else
            echo "code=${{ steps.filter.outputs.code }}" >> $GITHUB_OUTPUT
            echo "scripts=${{ steps.filter.outputs.scripts }}" >> $GITHUB_OUTPUT
          fi

      - name: Log result
        run: |
          echo "### 📊 Change Detection" >> $GITHUB_STEP_SUMMARY
          echo "- Code changed: **${{ steps.result.outputs.code }}**" >> $GITHUB_STEP_SUMMARY
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "- 🏷️ Tag push — full pipeline forced regardless of changed paths" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ steps.result.outputs.code }}" = "false" ]; then
            echo "- ⏭️ Skipping build/test/docker (docs/licenses/config-only change)" >> $GITHUB_STEP_SUMMARY
          fi

  # ─── Job 0b: Shell Lint ─────────────────────────────────────────
  # install.sh is 55 KB, install.ps1 is 40 KB, and they are what the README tells
  # people to pipe into a shell. Until this job existed nothing checked them at
  # all — not a linter, not a test, not even a syntax parse.
  shell-lint:
    name: Shell Lint
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.scripts == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Assert executable bits
        # mvnw is committed 100755 and .githooks/pre-push was committed 100644 —
        # and git runs a hook only if it is executable, so the force-push guard
        # AGENTS.md tells contributors to activate was silently ignored on Linux
        # and macOS (Windows is unaffected: core.filemode is false there, which
        # is what kept this invisible). Six jobs used to `chmod +x mvnw` on every
        # run and none of them touched the hook. One assertion replaces all six.
        run: |
          failed=0
          for f in mvnw .githooks/*; do
            [ -f "$f" ] || continue
            if [ ! -x "$f" ]; then
              echo "::error file=$f::$f is not executable in git — run: git update-index --chmod=+x $f"
              failed=1
            else
              echo "$f is executable"
            fi
          done
          exit $failed

      - name: Bash syntax check
        # Catches the class of error that makes `curl | bash` fail at the worst
        # possible moment — on a user's machine, halfway through an install.
        run: |
          for f in install.sh .githooks/*; do
            [ -f "$f" ] || continue
            head -n1 "$f" | grep -qE '^#!.*(bash|sh)' || continue
            echo "checking $f"
            bash -n "$f"
          done

      - name: ShellCheck
        # Uses the shellcheck preinstalled on ubuntu-latest rather than a
        # third-party action, so there is no extra supply-chain edge to pin.
        run: |
          shellcheck --version
          shellcheck --severity=warning --shell=bash install.sh

      - name: PowerShell syntax check
        shell: pwsh
        run: |
          # Parse-only: never dot-source or run the installer in CI.
          # Covers scripts/ too — preflight-local.ps1 is a contributor-facing
          # script and was as unchecked as the installers were.
          $ErrorActionPreference = 'Stop'
          $failed = $false
          Get-ChildItem -Path ./install.ps1, ./scripts -Filter *.ps1 -Recurse -ErrorAction SilentlyContinue |
            ForEach-Object {
              $errors = $null
              [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
              if ($errors) {
                $failed = $true
                $name = Resolve-Path -Relative $_.FullName
                $errors | ForEach-Object { Write-Host "::error file=$name,line=$($_.Extent.StartLineNumber)::$($_.Message)" }
              } else {
                Write-Host "$($_.Name) parses cleanly"
              }
            }
          if ($failed) { exit 1 }

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          # Preinstalled on the runner; installing over it only emits a
          # "currently in use" warning.
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -ErrorAction Stop
          }
          $targets = @('./install.ps1')
          if (Test-Path ./scripts) { $targets += './scripts' }
          # -Path takes ONE string, not an array — passing @(...) fails with
          # "Cannot convert 'System.Object[]' to the type 'System.String'".
          $found = @()
          foreach ($t in $targets) {
            $found += Invoke-ScriptAnalyzer -Path $t -Recurse -Severity Error,Warning
          }
          $found | Format-Table -AutoSize | Out-String | Write-Host
          if ($found | Where-Object { $_.Severity -eq 'Error' }) { exit 1 }

  # ─── Job 1: Build & Test ────────────────────────────────────────
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.code == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Build and test
        run: ./mvnw clean test -B

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results
          path: target/surefire-reports/
          retention-days: 14

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 14

      - name: Coverage summary
        if: always()
        run: |
          # Helper: write to both stdout (visible in logs) and GITHUB_STEP_SUMMARY
          out() { echo "$1"; echo "$1" >> $GITHUB_STEP_SUMMARY; }

          CSV="target/site/jacoco/jacoco.csv"
          if [ ! -f "$CSV" ]; then
            out "### ⚠️ No coverage report found"
            exit 0
          fi

          # Parse JaCoCo CSV columns:
          # $4=INSTRUCTION_MISSED, $5=INSTRUCTION_COVERED,
          # $6=BRANCH_MISSED, $7=BRANCH_COVERED, $8=LINE_MISSED, $9=LINE_COVERED,
          # $12=METHOD_MISSED, $13=METHOD_COVERED
          read IM IC LM LC BM BC MM MC <<< $(awk -F',' 'NR>1 {
            im+=$4; ic+=$5; lm+=$8; lc+=$9; bm+=$6; bc+=$7; mm+=$12; mc+=$13
          } END {
            print im, ic, lm, lc, bm, bc, mm, mc
          }' "$CSV")

          pct() { [ $(($1+$2)) -gt 0 ] && awk "BEGIN {printf \"%.1f\", ($2/($1+$2))*100}" || echo "0.0"; }
          icon() { local p=$(echo "$1" | awk '{printf "%d", $1}'); [ $p -ge 90 ] && echo "🟢" || { [ $p -ge 80 ] && echo "🟡" || echo "🔴"; }; }

          INST_PCT=$(pct $IM $IC)
          LINE_PCT=$(pct $LM $LC)
          BRANCH_PCT=$(pct $BM $BC)
          METHOD_PCT=$(pct $MM $MC)

          # Count tests from surefire reports (match only <testsuite lines)
          TOTAL_TESTS=$(grep -rh '<testsuite ' target/surefire-reports/*.xml 2>/dev/null | sed 's/.*tests="\([0-9]*\)".*/\1/' | awk '{s+=$1} END {print s+0}')

          out "### 📊 Unit Test Coverage ($TOTAL_TESTS tests)"
          out "| Metric | Covered | Total | Percentage | |"
          out "|--------|---------|-------|------------|---|"
          out "| Instruction | $IC | $((IM+IC)) | **${INST_PCT}%** | $(icon $INST_PCT) |"
          out "| Branch | $BC | $((BM+BC)) | **${BRANCH_PCT}%** | $(icon $BRANCH_PCT) |"
          out "| Line | $LC | $((LM+LC)) | **${LINE_PCT}%** | $(icon $LINE_PCT) |"
          out "| Method | $MC | $((MM+MC)) | **${METHOD_PCT}%** | $(icon $METHOD_PCT) |"
          out ""

          # Bottom 10 packages by instruction coverage (aggregated by package)
          out "<details><summary>📦 Bottom 10 packages by instruction coverage</summary>"
          out ""
          out "| Package | Instructions | Coverage |"
          out "|---------|-------------|----------|"
          awk -F',' 'NR>1 {
            im[$2]+=$4; ic[$2]+=$5
          } END {
            for (pkg in im) {
              total=im[pkg]+ic[pkg]
              if (total > 0) pct=ic[pkg]/total*100; else pct=100
              printf "| %s | %d/%d | %.1f%% |\n", pkg, ic[pkg], total, pct
            }
          }' "$CSV" | sort -t'|' -k4 -n | head -10 | while IFS= read -r line; do out "$line"; done
          out ""
          out "</details>"
          out ""
          out "> ℹ️ Unit tests only. See **Integration Tests** job for merged UT+IT coverage."

  # ─── Job 2: Integration Tests ─────────────────────────────────
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [detect-changes, build-and-test]
    if: needs.detect-changes.outputs.code == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Run integration tests
        run: ./mvnw verify -DskipITs=false -Dquarkus.bootstrap.effective-model-builder=true -B
        env:
          MAVEN_OPTS: "--enable-native-access=ALL-UNNAMED"

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: integration-test-results
          path: target/failsafe-reports/
          retention-days: 14

      - name: Upload integration coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: jacoco-it-report
          path: target/site/jacoco-it/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload merged coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: jacoco-merged-report
          path: target/site/jacoco-merged/
          if-no-files-found: ignore
          retention-days: 14

      - name: Coverage summary (UT + IT + Merged)
        if: always()
        run: |
          # Helper: write to both stdout (visible in logs) and GITHUB_STEP_SUMMARY
          out() { echo "$1"; echo "$1" >> $GITHUB_STEP_SUMMARY; }

          pct() { [ $(($1+$2)) -gt 0 ] && awk "BEGIN {printf \"%.1f\", ($2/($1+$2))*100}" || echo "0.0"; }
          icon() { local p=$(echo "$1" | awk '{printf "%d", $1}'); [ $p -ge 90 ] && echo "🟢" || { [ $p -ge 80 ] && echo "🟡" || echo "🔴"; }; }

          # Parse a JaCoCo CSV and emit a markdown table
          emit_table() {
            local csv="$1" title="$2"
            if [ ! -f "$csv" ]; then
              out "### ⚠️ ${title}: report not found"
              return
            fi
            read IM IC LM LC BM BC MM MC <<< $(awk -F',' 'NR>1 {
              im+=$4; ic+=$5; lm+=$8; lc+=$9; bm+=$6; bc+=$7; mm+=$12; mc+=$13
            } END {
              print im, ic, lm, lc, bm, bc, mm, mc
            }' "$csv")
            local INST_PCT=$(pct $IM $IC)
            local LINE_PCT=$(pct $LM $LC)
            local BRANCH_PCT=$(pct $BM $BC)
            local METHOD_PCT=$(pct $MM $MC)
            out "#### ${title}"
            out "| Metric | Covered | Total | Percentage | |"
            out "|--------|---------|-------|------------|---|"
            out "| Instruction | $IC | $((IM+IC)) | **${INST_PCT}%** | $(icon $INST_PCT) |"
            out "| Branch | $BC | $((BM+BC)) | **${BRANCH_PCT}%** | $(icon $BRANCH_PCT) |"
            out "| Line | $LC | $((LM+LC)) | **${LINE_PCT}%** | $(icon $LINE_PCT) |"
            out "| Method | $MC | $((MM+MC)) | **${METHOD_PCT}%** | $(icon $METHOD_PCT) |"
            out ""
          }

          # Count tests
          UT_COUNT=$(grep -rh '<testsuite ' target/surefire-reports/*.xml 2>/dev/null | sed 's/.*tests="\([0-9]*\)".*/\1/' | awk '{s+=$1} END {print s+0}')
          IT_COUNT=$(grep -rh '<testsuite ' target/failsafe-reports/*.xml 2>/dev/null | sed 's/.*tests="\([0-9]*\)".*/\1/' | awk '{s+=$1} END {print s+0}')
          TOTAL=$((UT_COUNT + IT_COUNT))

          out "### 📊 Test Coverage Report ($TOTAL tests: $UT_COUNT UT + $IT_COUNT IT)"
          out ""

          # Emit all three tables
          emit_table "target/site/jacoco/jacoco.csv" "Unit Tests Only"
          emit_table "target/site/jacoco-it/jacoco.csv" "Integration Tests Only"
          emit_table "target/site/jacoco-merged/jacoco.csv" "✅ Merged (UT + IT)"

          # Bottom 10 packages from merged (or UT-only fallback), aggregated by package
          BEST_CSV="target/site/jacoco-merged/jacoco.csv"
          [ ! -f "$BEST_CSV" ] && BEST_CSV="target/site/jacoco/jacoco.csv"
          if [ -f "$BEST_CSV" ]; then
            out "<details><summary>📦 Bottom 10 packages by instruction coverage</summary>"
            out ""
            out "| Package | Instructions | Coverage |"
            out "|---------|-------------|----------|"
            awk -F',' 'NR>1 {
              im[$2]+=$4; ic[$2]+=$5
            } END {
              for (pkg in im) {
                total=im[pkg]+ic[pkg]
                if (total > 0) pct=ic[pkg]/total*100; else pct=100
                printf "| %s | %d/%d | %.1f%% |\n", pkg, ic[pkg], total, pct
              }
            }' "$BEST_CSV" | sort -t'|' -k4 -n | head -10 | while IFS= read -r line; do out "$line"; done
            out ""
            out "</details>"
          fi

  # ─── Job 2b: CodeQL SAST ───────────────────────────────────────
  # Deliberately ungated: runs on every push AND every PR, including docs-only ones.
  # OpenSSF Scorecard's SAST check reads check runs on the *PR head commit*
  # (checks/raw/sast.go -> ListCheckRunsForRef(pr.HeadSHA)), so scanning main on
  # push is invisible to it — a docs-only PR that skipped CodeQL still counts as
  # an unscanned commit. Gating this on detect-changes cost us 2 of the last 30.
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          languages: java-kotlin
          queries: security-extended

      - name: Build for CodeQL
        run: ./mvnw compile -DskipTests -B --no-transfer-progress

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          category: "/language:java-kotlin"

  # ─── Job 2c: Trivy Filesystem Scan ─────────────────────────────
  trivy-scan:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.code == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true
          format: table
          trivyignores: .trivyignore

  # ─── Job 2d: Gitleaks Secret Scanning ──────────────────────────
  gitleaks:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      # The gitleaks CLI is MIT-licensed and needs no key; only the Action
      # wrapper requires a paid GITLEAKS_LICENSE for org-owned repos. GitHub
      # does not expose repository secrets to pull_request runs originating in
      # a fork, so that action failed on every outside contribution. Installed
      # from a pinned version + sha256, the same way preflight is installed.
      - name: Install gitleaks
        run: |
          set -euo pipefail
          echo "Installing gitleaks ${GITLEAKS_VERSION}..."
          curl -sSfL --retry 3 --retry-delay 2 --retry-all-errors \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks
          ./gitleaks version

      # On a pull request the checkout is the contributor's code, and that
      # includes any .gitleaksignore or .gitleaks.toml it adds. Either file can
      # switch findings off, so without this a fork could allowlist its own
      # secret in the same pull request that introduces it. Taking both from
      # the base branch means a config change takes effect once it is merged
      # and reviewed, rather than while it is still being proposed.
      - name: Take the gitleaks config from the base branch
        if: github.event_name == 'pull_request'
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          for f in .gitleaksignore .gitleaks.toml; do
            if git cat-file -e "$PR_BASE:$f" 2> /dev/null; then
              git show "$PR_BASE:$f" > "$f"
              echo "restored $f from the base branch"
            elif [ -e "$f" ]; then
              rm -f "$f"
              echo "removed $f, which this pull request adds and the base branch does not have"
            fi
          done

      # Scan only the commits this event introduces, which is what
      # gitleaks-action did. A full-depth scan reports 61 pre-existing findings
      # across 16 commits dated 2016 to 2026, most of them in files deleted
      # years ago, so scanning everything would fail the build on day one for
      # reasons no PR author can fix.
      - name: Scan commits in this event
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          ZERO=0000000000000000000000000000000000000000

          have() { git cat-file -e "$1^{commit}" 2> /dev/null; }

          if [ "$EVENT" = "pull_request" ]; then
            # Both ends must resolve. Quietly narrowing the range here would
            # turn a fetch problem into a scan that passes without looking.
            for sha in "$PR_BASE" "$PR_HEAD"; do
              if ! have "$sha"; then
                echo "::error::gitleaks: $sha is not in this checkout, so the pull request was not scanned. Check that actions/checkout still uses fetch-depth: 0."
                exit 1
              fi
            done
            LOG_OPTS="--no-merges $PR_BASE..$PR_HEAD"
            echo "scanning pull request range $PR_BASE..$PR_HEAD"
          elif [ -n "$PUSH_BEFORE" ] && [ "$PUSH_BEFORE" != "$ZERO" ] && have "$PUSH_BEFORE"; then
            LOG_OPTS="--no-merges $PUSH_BEFORE..$PUSH_AFTER"
            echo "scanning pushed range $PUSH_BEFORE..$PUSH_AFTER"
          else
            # New branch, tag, or a force-push that orphaned the old tip: there
            # is no range to diff against, so scan the tip commit and say so.
            LOG_OPTS="--no-merges -n 1"
            echo "no usable base commit for this $EVENT, scanning only $PUSH_AFTER"
          fi

          ./gitleaks git --redact=100 --no-banner --exit-code 1 --log-opts="$LOG_OPTS" .

  # ─── Job 2e: CycloneDX SBOM Generation ─────────────────────────
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Generate CycloneDX SBOM
        run: ./mvnw org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeBom -DskipTests -B --no-transfer-progress

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-cyclonedx
          path: target/bom.json
          retention-days: 90

  # ─── Job 3: Docker Build & Push ─────────────────────────────────
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    # Every gate that must hold before anything is published is a `needs`:
    #   build-and-test    unit tests
    #   integration-test  `mvnw verify` — the ONLY job that runs the JaCoCo
    #                     90/80 coverage gate, so without it the threshold could
    #                     never block a ship
    #   trivy-scan        blocking filesystem CVE scan (exit-code 1)
    #   codeql            SAST build + analysis
    #   gitleaks          secret scanning
    needs: [detect-changes, build-and-test, integration-test, trivy-scan, codeql, gitleaks]
    # NOTE: deliberately no always(). always() cancelled the implicit
    # needs-success gate, and the tag branch then short-circuited the explicit
    # one — so a tag on a commit with failing tests still built, pushed, tagged
    # :latest, cosign-signed and SLSA-attested. Tag pushes are kept unskippable
    # by forcing detect-changes to report code=true for them instead.
    if: >
      github.event_name == 'push' &&
      github.repository == 'labsai/EDDI' &&
      (startsWith(github.ref, 'refs/tags/') ||
       !contains(github.event.head_commit.message || '', '[skip docker]'))

    outputs:
      primary-tag: ${{ steps.meta.outputs.primary-tag }}
      is-release: ${{ steps.meta.outputs.is-release }}
      is-stable: ${{ steps.meta.outputs.is-stable }}

    permissions:
      contents: read       # checkout + build
      id-token: write      # Sigstore cosign keyless signing (OIDC → Fulcio)
      attestations: write  # SLSA provenance attestation

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Compute Docker tags
        id: meta
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            # Tag push: 6.0.0 or 6.0.0-RC2
            PRIMARY_TAG="${GITHUB_REF#refs/tags/}"
            IS_RELEASE="true"

            # Compute semver aliases for stable releases (no pre-release suffix)
            if [[ "$PRIMARY_TAG" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              MAJOR="${BASH_REMATCH[1]}"
              MINOR="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}"
              echo "major-tag=${MAJOR}" >> $GITHUB_OUTPUT
              echo "minor-tag=${MINOR}" >> $GITHUB_OUTPUT
              IS_STABLE="true"
            else
              IS_STABLE="false"
            fi
            echo "is-stable=${IS_STABLE}" >> $GITHUB_OUTPUT
          else
            # Branch push: version from pom.xml + build number
            POM_VERSION=$(grep -m1 '<version>' pom.xml | sed 's/.*<version>\(.*\)<\/version>.*/\1/')
            PRIMARY_TAG="${POM_VERSION}-b${{ github.run_number }}"
            IS_RELEASE="false"
            echo "is-stable=false" >> $GITHUB_OUTPUT
          fi

          echo "primary-tag=${PRIMARY_TAG}" >> $GITHUB_OUTPUT
          echo "is-release=${IS_RELEASE}" >> $GITHUB_OUTPUT

          echo "### 🐳 Docker Tags" >> $GITHUB_STEP_SUMMARY
          echo "- \`${DOCKER_IMAGE}:${PRIMARY_TAG}\`" >> $GITHUB_STEP_SUMMARY
          if [[ "${IS_STABLE:-false}" == "true" ]]; then
            echo "- \`${DOCKER_IMAGE}:${MINOR}\`" >> $GITHUB_STEP_SUMMARY
            echo "- \`${DOCKER_IMAGE}:${MAJOR}\`" >> $GITHUB_STEP_SUMMARY
          fi
          if [[ "$IS_RELEASE" == "true" ]]; then
            echo "- \`${DOCKER_IMAGE}:latest\`" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Build application
        run: ./mvnw clean package -DskipTests -Plicense-gen -B

      - name: Build Docker image
        run: |
          PRIMARY_TAG="${{ steps.meta.outputs.primary-tag }}"
          IS_RELEASE="${{ steps.meta.outputs.is-release }}"
          IS_STABLE="${{ steps.meta.outputs.is-stable }}"

          TAGS="-t ${DOCKER_IMAGE}:${PRIMARY_TAG}"
          if [[ "$IS_STABLE" == "true" ]]; then
            TAGS="${TAGS} -t ${DOCKER_IMAGE}:${{ steps.meta.outputs.minor-tag }}"
            TAGS="${TAGS} -t ${DOCKER_IMAGE}:${{ steps.meta.outputs.major-tag }}"
          fi
          if [[ "$IS_RELEASE" == "true" ]]; then
            TAGS="${TAGS} -t ${DOCKER_IMAGE}:latest"
          fi

          docker build \
            --build-arg EDDI_VERSION="${PRIMARY_TAG}" \
            --build-arg EDDI_RELEASE="${{ github.run_number }}" \
            -f src/main/docker/Dockerfile \
            ${TAGS} \
            .

      - name: Scan Docker image for vulnerabilities
        # BLOCKING, and deliberately placed before "Login to Docker Hub" so a
        # failure stops the push, the :latest retag, the cosign signature and the
        # SLSA attestation. It used to be exit-code: 0 — advisory only — which
        # meant no vulnerability scan anywhere in this workflow could stop a
        # release.
        #
        # ignore-unfixed: true keeps this actionable: only CVEs with an available
        # fix can block. When Red Hat ships a patched base image, bump the
        # @sha256 digest in src/main/docker/Dockerfile (see AGENTS.md, "Trivy CVE
        # Remediation Procedure"); base-image-check.yml watches for those digests
        # weekly. If a fix genuinely is not available yet, add the CVE to
        # .trivyignore with a written justification.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.DOCKER_IMAGE }}:${{ steps.meta.outputs.primary-tag }}
          severity: CRITICAL,HIGH
          exit-code: 1
          ignore-unfixed: true
          format: table
          trivyignores: .trivyignore

      - name: Verify the image boots
        # Until this step existed, the ONLY thing that ever started the container
        # was the smoke-test job - and that job is `needs: docker`, i.e. it runs
        # after "Push to Docker Hub" has already published the tag, the :latest
        # alias, the cosign signature and the SLSA attestation. A container that
        # exits on startup (a bad JAVA_OPTS_APPEND, a missing file in a COPY, a
        # broken /deployments layout after a Quarkus packaging change) was
        # therefore fully released before anything tried to boot it - exactly the
        # shape this workflow rejected when it deleted the ZAP job further down.
        # This runs against the image already in the local daemon, before login,
        # so a failure stops the publish. The post-push smoke test keeps the
        # signature verification, which genuinely can only run after publication.
        run: |
          set -uo pipefail
          PRIMARY_TAG="${{ steps.meta.outputs.primary-tag }}"
          MONGO_URI="mongodb://localhost:27017/eddi?retryWrites=true&w=majority&connectTimeoutMS=10000&socketTimeoutMS=30000"

          docker run -d --name eddi-boot-mongodb --network host mongo:7.0.14
          for _ in $(seq 1 30); do
            if docker exec eddi-boot-mongodb mongosh --eval "db.runCommand({ping:1})" > /dev/null 2>&1; then
              echo "MongoDB ready"
              break
            fi
            sleep 1
          done

          docker run -d --name eddi-boot --network host -e "MONGODB_CONNECTIONSTRING=${MONGO_URI}" -e "EDDI_SECURITY_ALLOW_UNAUTHENTICATED=true" -e "EDDI_MCP_ALLOW_UNAUTHENTICATED=true" -e "EDDI_SECRETSTORE_ALLOW_UNAUTHENTICATED=true" "${DOCKER_IMAGE}:${PRIMARY_TAG}"

          READY=0
          for i in $(seq 1 45); do
            if curl -sf http://localhost:7070/q/health/ready > /dev/null 2>&1; then
              echo "Image is ready after $((i * 2))s"
              READY=1
              break
            fi
            sleep 2
          done
          if [ "$READY" != "1" ]; then
            echo "::error::The built image did not become ready within 90s - refusing to publish"
            docker logs eddi-boot
            docker logs eddi-boot-mongodb
            exit 1
          fi

          # Docker's OWN verdict on the Dockerfile HEALTHCHECK, which the host
          # curl above does not exercise: it runs INSIDE the container and needs
          # curl to exist in the UBI base - an inherited property of a digest
          # Dependabot and base-image-check.yml bump every week. Nothing ran it,
          # so an image whose healthcheck can never pass would ship, report
          # `unhealthy` forever, and get restart-looped by Kubernetes and Swarm.
          STATUS=""
          for _ in $(seq 1 60); do
            STATUS=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' eddi-boot)
            if [ "$STATUS" = "healthy" ]; then
              echo "Docker HEALTHCHECK reports healthy"
              echo "### Image boots and reports healthy before publish" >> $GITHUB_STEP_SUMMARY
              exit 0
            fi
            if [ "$STATUS" = "none" ]; then
              echo "::error::The image declares no HEALTHCHECK - src/main/docker/Dockerfile should"
              exit 1
            fi
            sleep 2
          done
          echo "::error::HEALTHCHECK never reported healthy (last status: ${STATUS})"
          docker inspect --format '{{json .State.Health}}' eddi-boot
          docker logs eddi-boot
          exit 1

      - name: Stop boot-check containers
        if: always()
        run: |
          docker rm -f eddi-boot eddi-boot-mongodb 2>/dev/null || true

      - name: Login to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push to Docker Hub
        id: docker-push
        run: |
          PRIMARY_TAG="${{ steps.meta.outputs.primary-tag }}"
          IS_RELEASE="${{ steps.meta.outputs.is-release }}"
          IS_STABLE="${{ steps.meta.outputs.is-stable }}"

          docker push ${DOCKER_IMAGE}:${PRIMARY_TAG}
          if [[ "$IS_STABLE" == "true" ]]; then
            docker push ${DOCKER_IMAGE}:${{ steps.meta.outputs.minor-tag }}
            docker push ${DOCKER_IMAGE}:${{ steps.meta.outputs.major-tag }}
          fi
          if [[ "$IS_RELEASE" == "true" ]]; then
            docker push ${DOCKER_IMAGE}:latest
          fi

          # Capture the pushed image digest for provenance attestation
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' ${DOCKER_IMAGE}:${PRIMARY_TAG} | cut -d'@' -f2)
          echo "digest=${DIGEST}" >> $GITHUB_OUTPUT
          echo "### ✅ Pushed to Docker Hub" >> $GITHUB_STEP_SUMMARY
          echo "Image digest: \`${DIGEST}\`" >> $GITHUB_STEP_SUMMARY

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign Docker images (keyless)
        run: |
          PRIMARY_TAG="${{ steps.meta.outputs.primary-tag }}"
          IS_RELEASE="${{ steps.meta.outputs.is-release }}"
          IS_STABLE="${{ steps.meta.outputs.is-stable }}"

          echo "=== Signing ${DOCKER_IMAGE}:${PRIMARY_TAG} ==="
          cosign sign --yes ${DOCKER_IMAGE}:${PRIMARY_TAG}

          if [[ "$IS_STABLE" == "true" ]]; then
            echo "=== Signing semver aliases ==="
            cosign sign --yes ${DOCKER_IMAGE}:${{ steps.meta.outputs.minor-tag }}
            cosign sign --yes ${DOCKER_IMAGE}:${{ steps.meta.outputs.major-tag }}
          fi

          if [[ "$IS_RELEASE" == "true" ]]; then
            echo "=== Signing latest ==="
            cosign sign --yes ${DOCKER_IMAGE}:latest
          fi

          echo "### 🔏 Docker Images Signed (Sigstore cosign)" >> $GITHUB_STEP_SUMMARY
          echo "Keyless OIDC signing via GitHub Actions identity." >> $GITHUB_STEP_SUMMARY
          echo "Verify: \`cosign verify --certificate-oidc-issuer https://token.actions.githubusercontent.com --certificate-identity-regexp '^https://github\\.com/labsai/EDDI/\\.github/workflows/ci\\.yml@refs/(heads/main|tags/.+)$' ${DOCKER_IMAGE}:${PRIMARY_TAG}\`" >> $GITHUB_STEP_SUMMARY

      - name: Generate SLSA provenance attestation
        if: steps.docker-push.outputs.digest != ''
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: docker.io/${{ env.DOCKER_IMAGE }}
          subject-digest: ${{ steps.docker-push.outputs.digest }}
          push-to-registry: true


  # ─── Job 3b: GitHub Release (tag pushes only) ──────────────────
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: docker
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write  # Required for creating GitHub Releases
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          generate_release_notes: true
          make_latest: true
          body: |
            ## 🐳 Docker Image

            This release is distributed as a Docker image:

            ```bash
            docker pull ${{ env.DOCKER_IMAGE }}:${{ needs.docker.outputs.primary-tag }}
            ```

            ### Verify image signature

            ```bash
            cosign verify \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --certificate-identity-regexp '^https://github\.com/labsai/EDDI/\.github/workflows/ci\.yml@refs/(heads/main|tags/.+)$' \
              ${{ env.DOCKER_IMAGE }}:${{ needs.docker.outputs.primary-tag }}
            ```

            > **Note:** EDDI is distributed exclusively as a Docker image. There are no binary downloads.
            > See the [Docker Hub page](https://hub.docker.com/r/labsai/eddi) for all available tags.

  # ─── Job 4: Smoke Test ──────────────────────────────────────────
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify Docker image signature
        run: |
          PRIMARY_TAG="${{ needs.docker.outputs.primary-tag }}"
          echo "=== Verifying signature for ${DOCKER_IMAGE}:${PRIMARY_TAG} ==="
          cosign verify \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp '^https://github\.com/labsai/EDDI/\.github/workflows/ci\.yml@refs/(heads/main|tags/.+)$' \
            ${DOCKER_IMAGE}:${PRIMARY_TAG}
          echo "✅ Image signature verified"
          echo "### 🔏 Image Signature Verified" >> $GITHUB_STEP_SUMMARY

      - name: Start MongoDB
        run: |
          # Same tag as docker-compose.yml, so the release gate exercises the
          # MongoDB users actually run. It was 6.0 (EOL July 2025), which meant
          # a 7.x-specific regression could not be caught here at all.
          docker run -d --name mongodb \
            --network host \
            mongo:7.0.14
          echo "Waiting for MongoDB..."
          for i in $(seq 1 15); do
            if docker exec mongodb mongosh --eval "db.runCommand({ping:1})" > /dev/null 2>&1; then
              echo "✅ MongoDB ready"
              break
            fi
            sleep 1
          done

      - name: Start EDDI
        run: |
          PRIMARY_TAG="${{ needs.docker.outputs.primary-tag }}"
          echo "Starting ${DOCKER_IMAGE}:${PRIMARY_TAG}..."

          docker run -d --name eddi \
            --network host \
            -e "MONGODB_CONNECTIONSTRING=mongodb://localhost:27017/eddi?retryWrites=true&w=majority&connectTimeoutMS=10000&socketTimeoutMS=30000" \
            -e "EDDI_SECURITY_ALLOW_UNAUTHENTICATED=true" \
            -e "EDDI_MCP_ALLOW_UNAUTHENTICATED=true" \
            -e "EDDI_SECRETSTORE_ALLOW_UNAUTHENTICATED=true" \
            ${DOCKER_IMAGE}:${PRIMARY_TAG}

      - name: Wait for healthy
        run: |
          echo "Waiting for EDDI to start..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:7070/q/health/ready > /dev/null 2>&1; then
              echo "✅ EDDI is healthy after $((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "❌ EDDI failed to start within 60s"
          echo "=== EDDI logs ==="
          docker logs eddi
          echo "=== MongoDB logs ==="
          docker logs mongodb
          exit 1

      - name: Verify API responds
        run: |
          echo "=== Health endpoint ==="
          HEALTH_JSON=$(curl -sf http://localhost:7070/q/health/ready)
          echo "$HEALTH_JSON" | python3 -m json.tool

          echo ""
          echo "=== OpenAPI spec available ==="
          HTTP_CODE=$(curl -sf -o /dev/null -w "%{http_code}" http://localhost:7070/openapi)
          echo "HTTP ${HTTP_CODE}"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ OpenAPI endpoint returned ${HTTP_CODE}"
            exit 1
          fi

      - name: Verify security headers
        run: |
          echo "=== Security Headers Check ==="
          HEADERS=$(curl -sI http://localhost:7070/q/health/ready)
          echo "$HEADERS"
          echo ""

          MISSING=0
          check_header() {
            if echo "$HEADERS" | grep -qi "$1"; then
              echo "✅ $1 present"
            else
              echo "⚠️  $1 MISSING"
              MISSING=1
            fi
          }

          check_header "X-Content-Type-Options"
          check_header "X-Frame-Options"
          check_header "Content-Security-Policy"

          echo ""
          if [ "$MISSING" -eq 1 ]; then
            echo "### ⚠️ Security Headers" >> $GITHUB_STEP_SUMMARY
            echo "Some recommended security headers are missing — see job output for details." >> $GITHUB_STEP_SUMMARY
            echo "::warning::Recommended security headers missing — review smoke-test output"
          else
            echo "### ✅ Security Headers" >> $GITHUB_STEP_SUMMARY
            echo "All checked security headers are present." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Cleanup
        if: always()
        run: |
          docker rm -f eddi 2>/dev/null || true
          docker rm -f mongodb 2>/dev/null || true

  # ─── Job 4b: DAST — intentionally absent ────────────────────────
  #
  # A ZAP API scan used to live here. It was removed rather than kept as
  # decorative coverage, because as wired it could not catch anything:
  #   * it ran AFTER the image was pushed to Docker Hub, so a finding could not
  #     stop a release;
  #   * it scanned an instance started with EDDI_SECURITY_ALLOW_UNAUTHENTICATED,
  #     i.e. the one configuration in which the authorization layer under test
  #     is switched off, so every authenticated code path went unexercised;
  #   * it ran passive-only (-S) with fail_action: false, so it could not fail
  #     the job under any circumstance.
  #
  # Re-adding it means fixing all three at once: build the image in a job that
  # does not push, stand up Keycloak, drive an authenticated OpenAPI scan
  # against it, and gate the publish job on the result. Until that exists, do
  # not cite DAST as part of this pipeline's coverage — the active gates are
  # CodeQL (SAST), Trivy filesystem + image scans, Gitleaks, and the fuzzing in
  # clusterfuzzlite.yml, all of which now block the publish.

  # ─── Job 5: Red Hat Preflight — PR Dry-Run ──────────────────────
  preflight-check:
    name: Preflight Dry-Run (PR)
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Build application
        run: ./mvnw clean package -DskipTests -Plicense-gen -B

      - name: Build Docker image with Red Hat labels
        run: |
          # EDDI_VERSION has to be passed here exactly as the docker job passes it.
          # Without it this dry-run certifies an image labelled with the
          # Dockerfile's ARG default instead of the real version - it reported
          # `version` present and correct even when a release would have carried a
          # stale one, which is the single failure this job exists to catch.
          POM_VERSION=$(grep -m1 '<version>' pom.xml | cut -d'>' -f2 | cut -d'<' -f1)
          echo "Building with EDDI_VERSION=${POM_VERSION}"
          docker build \
            --build-arg EDDI_VERSION="${POM_VERSION}" \
            --build-arg EDDI_RELEASE="${{ github.run_number }}" \
            -f src/main/docker/Dockerfile \
            -t eddi-preflight-check:test \
            .

      - name: Verify Red Hat labels present
        run: |
          echo "=== Checking required Red Hat labels ==="
          LABELS=$(docker inspect eddi-preflight-check:test --format '{{json .Config.Labels}}')
          echo "$LABELS" | python3 -m json.tool
          MISSING=0
          for label in name vendor version release summary description; do
            if echo "$LABELS" | python3 -c "import sys,json; d=json.load(sys.stdin); assert '$label' in d" 2>/dev/null; then
              echo "✅ Label '$label' present"
            else
              echo "❌ Label '$label' MISSING"
              MISSING=1
            fi
          done
          if [ "$MISSING" -eq 1 ]; then
            echo "::error::Required Red Hat labels are missing"
            exit 1
          fi

          # Presence is not enough. The `version` label is what a Red Hat
          # certification submission is filed under, and it comes from an ARG the
          # build has to pass; the old check reported "present and correct" for
          # whatever literal the Dockerfile happened to default to, so the one
          # failure this dry-run exists to catch was the one it could not see.
          POM_VERSION=$(grep -m1 '<version>' pom.xml | cut -d'>' -f2 | cut -d'<' -f1)
          LABEL_VERSION=$(docker inspect eddi-preflight-check:test --format '{{index .Config.Labels "version"}}')
          if [ "$LABEL_VERSION" != "$POM_VERSION" ]; then
            echo "::error::version label is '${LABEL_VERSION}' but pom.xml says '${POM_VERSION}' — the build did not pass --build-arg EDDI_VERSION"
            exit 1
          fi
          echo "✅ Label 'version' matches pom.xml (${POM_VERSION})"

      - name: Verify /licenses in container
        run: |
          echo "=== /licenses directory ==="
          docker run --rm --entrypoint="" eddi-preflight-check:test ls -la /licenses/
          echo ""
          echo "=== THIRD-PARTY.txt exists ==="
          docker run --rm --entrypoint="" eddi-preflight-check:test \
            test -f /licenses/THIRD-PARTY.txt && echo "✅ THIRD-PARTY.txt found" || { echo "❌ THIRD-PARTY.txt missing"; exit 1; }

      - name: Install preflight
        run: |
          echo "Installing preflight ${PREFLIGHT_VERSION}..."
          curl -sL "https://github.com/redhat-openshift-ecosystem/openshift-preflight/releases/download/${PREFLIGHT_VERSION}/preflight-linux-amd64" \
            -o /usr/local/bin/preflight
          echo "${PREFLIGHT_SHA256}  /usr/local/bin/preflight" | sha256sum -c -
          chmod +x /usr/local/bin/preflight
          preflight --version

      # Preflight resolves images from a REGISTRY, never the local daemon. Fed a
      # daemon-only tag, it tried docker.io/library/eddi-preflight-check, errored
      # UNAUTHORIZED - and the old `|| true` plus grep-for-FAILED swallowed that,
      # so this job was green on every PR while validating nothing. A registry:2
      # container on localhost gives preflight something real to pull without
      # touching any external repository.
      - name: Push image to a job-local registry
        run: |
          set -euo pipefail
          docker run -d --name preflight-registry -p 5000:5000 \
            registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
          docker tag eddi-preflight-check:test localhost:5000/eddi-preflight-check:test
          for i in 1 2 3 4 5; do
            docker push localhost:5000/eddi-preflight-check:test && break
            [ "$i" = 5 ] && { echo "::error::local registry did not come up"; exit 1; }
            sleep 2
          done

      - name: Preflight check (local registry, no submit)
        run: |
          set -uo pipefail
          # --insecure: the job-local registry is plain HTTP; mutually exclusive
          # with --submit, which this job never uses.
          # set +e: the ambient bash -e plus pipefail would kill the script on a
          # failing pipeline before PIPESTATUS is read; capture the exit instead.
          set +e
          preflight check container \
            localhost:5000/eddi-preflight-check:test \
            --insecure \
            2>&1 | tee preflight-dryrun.txt
          PREFLIGHT_EXIT=${PIPESTATUS[0]}
          set -e
          echo ""
          echo "=== Preflight Summary ==="
          if [ "$PREFLIGHT_EXIT" -ne 0 ]; then
            echo "::error::preflight failed to execute (exit code: ${PREFLIGHT_EXIT})"
            exit 1
          fi
          if grep -q "FAILED" preflight-dryrun.txt; then
            echo "::error::Preflight verdict is FAILED - this image would not pass Red Hat certification."
            exit 1
          fi
          echo "All preflight checks passed"

      - name: Upload preflight dry-run results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: preflight-dryrun
          path: preflight-dryrun.txt
          retention-days: 14

  # ─── Job 6: Red Hat Preflight — Push Verification ───────────────
  preflight-push:
    name: Preflight Verify (Pushed Image)
    runs-on: ubuntu-latest
    needs: docker
    if: >
      github.event_name == 'push' &&
      needs.docker.result == 'success'

    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Pull pushed image
        run: |
          PRIMARY_TAG="${{ needs.docker.outputs.primary-tag }}"
          echo "Pulling ${DOCKER_IMAGE}:${PRIMARY_TAG}..."
          docker pull ${DOCKER_IMAGE}:${PRIMARY_TAG}

      - name: Verify Red Hat labels present
        run: |
          PRIMARY_TAG="${{ needs.docker.outputs.primary-tag }}"
          echo "=== Checking required Red Hat labels ==="
          LABELS=$(docker inspect ${DOCKER_IMAGE}:${PRIMARY_TAG} --format '{{json .Config.Labels}}')
          echo "$LABELS" | python3 -m json.tool
          MISSING=0
          for label in name vendor version release summary description; do
            if echo "$LABELS" | python3 -c "import sys,json; d=json.load(sys.stdin); assert '$label' in d" 2>/dev/null; then
              echo "✅ Label '$label' present"
            else
              echo "❌ Label '$label' MISSING"
              MISSING=1
            fi
          done
          if [ "$MISSING" -eq 1 ]; then
            echo "::error::Required Red Hat labels are missing on pushed image"
            exit 1
          fi

      - name: Verify /licenses in container
        run: |
          PRIMARY_TAG="${{ needs.docker.outputs.primary-tag }}"
          echo "=== /licenses directory ==="
          docker run --rm --entrypoint="" ${DOCKER_IMAGE}:${PRIMARY_TAG} ls -la /licenses/
          echo ""
          echo "=== THIRD-PARTY.txt exists ==="
          docker run --rm --entrypoint="" ${DOCKER_IMAGE}:${PRIMARY_TAG} \
            test -f /licenses/THIRD-PARTY.txt && echo "✅ THIRD-PARTY.txt found" || { echo "❌ THIRD-PARTY.txt missing"; exit 1; }

      - name: Install preflight
        run: |
          echo "Installing preflight ${PREFLIGHT_VERSION}..."
          curl -sL "https://github.com/redhat-openshift-ecosystem/openshift-preflight/releases/download/${PREFLIGHT_VERSION}/preflight-linux-amd64" \
            -o /usr/local/bin/preflight
          echo "${PREFLIGHT_SHA256}  /usr/local/bin/preflight" | sha256sum -c -
          chmod +x /usr/local/bin/preflight
          preflight --version

      - name: Preflight check (pushed image)
        env:
          PRIMARY_TAG: ${{ needs.docker.outputs.primary-tag }}
        run: |
          # Verification only - no submission. The certification project is a
          # HOSTED-registry project, and Pyxis rejects submissions for a
          # docker.io-hosted image ("The 'container.registry' field is
          # immutable for projects with hosted registry"), which reddened
          # every release tag. Submission happens exclusively in
          # redhat-certify.yml, against the hosted-registry copy.
          preflight check container \
            docker.io/${DOCKER_IMAGE}:${PRIMARY_TAG} \
            --docker-config=${HOME}/.docker/config.json \
            2>&1 | tee preflight-push-results.txt
          PREFLIGHT_EXIT=${PIPESTATUS[0]}
          echo ""
          echo "=== Preflight Summary ==="
          if [ "$PREFLIGHT_EXIT" -ne 0 ] || grep -q "FAILED" preflight-push-results.txt; then
            echo "::error::Preflight certification check FAILED on pushed image (exit code: ${PREFLIGHT_EXIT})"
            echo "The container will not pass Red Hat certification in its current state."
            exit 1
          else
            echo "✅ All preflight checks passed on pushed image"
          fi

      - name: Upload preflight results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: preflight-push-results
          path: |
            preflight-push-results.txt
            artifacts/
          retention-days: 30

  # ─── Red Hat Catalog Publish ───────────────────────────────────
  # Stable release tags only (X.Y.Z, no pre-release suffix): publishes the
  # just-released image to Red Hat's hosted certification registry and submits
  # the preflight results. Reuses redhat-certify.yml, which is also manually
  # dispatchable for re-submissions with a bumped release number.
  redhat-publish:
    name: Red Hat Catalog Publish
    needs: [docker, smoke-test]
    if: startsWith(github.ref, 'refs/tags/') && needs.docker.outputs.is-stable == 'true'
    uses: ./.github/workflows/redhat-certify.yml
    with:
      version: ${{ needs.docker.outputs.primary-tag }}
      release: "1"
      submit: "true"
    secrets: inherit

  # ─── Job 7: Slack Notification ─────────────────────────────────
  notify-slack:
    name: Slack Notification
    runs-on: ubuntu-latest
    if: always()
    needs:
      [detect-changes, build-and-test, integration-test, docker, smoke-test, codeql, trivy-scan, gitleaks, preflight-check, preflight-push]

    steps:
      - name: Send build notification
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          COMMIT_MSG_RAW: ${{ github.event.head_commit.message || github.event.pull_request.title || 'Manual run' }}
          GH_ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          # Skip if no webhook configured
          if [ -z "$SLACK_WEBHOOK" ]; then
            echo "No SLACK_WEBHOOK_URL configured, skipping"
            exit 0
          fi

          # Skip notification for docs-only changes (all jobs skipped) — but always notify on tags
          if [ "${{ needs.detect-changes.outputs.code }}" = "false" ] && [[ "$GITHUB_REF" != refs/tags/* ]]; then
            echo "### ⏭️ Docs-only change — no build notification sent" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          # Determine overall status
          BUILD="${{ needs.build-and-test.result }}"
          IT="${{ needs.integration-test.result }}"
          DOCKER="${{ needs.docker.result }}"
          SMOKE="${{ needs.smoke-test.result }}"
          CODEQL="${{ needs.codeql.result }}"
          GITLEAKS="${{ needs.gitleaks.result }}"
          TRIVY="${{ needs.trivy-scan.result }}"
          PREFLIGHT_PR="${{ needs.preflight-check.result }}"
          PREFLIGHT_PUSH="${{ needs.preflight-push.result }}"
          # Merge: whichever preflight job actually ran wins (the other is "skipped")
          if [ "$PREFLIGHT_PUSH" != "skipped" ]; then
            PREFLIGHT="$PREFLIGHT_PUSH"
          else
            PREFLIGHT="$PREFLIGHT_PR"
          fi

          # Map result to emoji
          status_icon() {
            case "$1" in
              success)  echo "✅" ;;
              failure)  echo "❌" ;;
              skipped)  echo "⏭️" ;;
              cancelled) echo "🚫" ;;
              *)        echo "❓" ;;
            esac
          }

          # Tag pushes no longer bypass the test jobs — detect-changes forces
          # code=true for them, so build-and-test and integration-test really run
          # and docker only starts if they pass. Nothing to normalise here.

          # Overall status
          # PREFLIGHT belongs in this condition, not only in the icon list below.
          # Without it a run where everything else was green but preflight failed
          # was classified "Build Passed", and the next block then exited without
          # posting anything - so the one signal saying the image would not pass
          # Red Hat certification never left GitHub. On a tag it did post, with
          # "Build Passed" in the header beside a red Red Hat Preflight field.
          if [ "$BUILD" = "success" ] && [ "$IT" != "failure" ] && [ "$DOCKER" != "failure" ] && [ "$SMOKE" != "failure" ] && [ "$GITLEAKS" != "failure" ] && [ "$TRIVY" != "failure" ] && [ "$CODEQL" != "failure" ] && [ "$PREFLIGHT" != "failure" ]; then
            OVERALL_ICON="✅"
            OVERALL_TEXT="Build Passed"
          else
            OVERALL_ICON="❌"
            OVERALL_TEXT="Build Failed"
          fi

          # Only notify on failures or release tag pushes — green branch/PR builds stay silent
          if [ "$OVERALL_TEXT" = "Build Passed" ] && [[ "$GITHUB_REF" != refs/tags/* ]]; then
            echo "### ⏭️ Build passed — skipping Slack (only failures and releases notify)" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          # Branch or tag name
          REF="${GITHUB_REF#refs/heads/}"
          REF="${REF#refs/tags/}"
          REF="${REF#refs/pull/}"

          # Sanitize commit message: first line only, truncate, sourced from env (not inline interpolation)
          COMMIT_MSG=$(printf '%s' "$COMMIT_MSG_RAW" | head -1 | cut -c1-80)

          # Build JSON payload safely with jq to prevent any injection via user-controlled values
          PAYLOAD=$(jq -n \
            --arg header "${OVERALL_ICON}  EDDI CI: ${OVERALL_TEXT}" \
            --arg branch "$REF" \
            --arg actor "$GH_ACTOR" \
            --arg commit "$COMMIT_MSG" \
            --arg build_icon "$(status_icon $BUILD)" \
            --arg it_icon "$(status_icon $IT)" \
            --arg docker_icon "$(status_icon $DOCKER)" \
            --arg smoke_icon "$(status_icon $SMOKE)" \
            --arg gitleaks_icon "$(status_icon $GITLEAKS)" \
            --arg trivy_icon "$(status_icon $TRIVY)" \
            --arg codeql_icon "$(status_icon $CODEQL)" \
            --arg preflight_icon "$(status_icon $PREFLIGHT)" \
            --arg run_url "$RUN_URL" \
            --arg run_number "$RUN_NUMBER" \
            '{
              blocks: [
                {
                  type: "header",
                  text: { type: "plain_text", text: $header, emoji: true }
                },
                {
                  type: "section",
                  text: {
                    type: "mrkdwn",
                    text: ("*Branch:* `" + $branch + "`  ·  *By:* " + $actor + "\n" + $commit)
                  }
                },
                {
                  type: "section",
                  fields: [
                    { type: "mrkdwn", text: ($build_icon + " Build & Test") },
                    { type: "mrkdwn", text: ($it_icon + " Integration Tests") },
                    { type: "mrkdwn", text: ($docker_icon + " Docker Push") },
                    { type: "mrkdwn", text: ($smoke_icon + " Smoke Test") },
                    { type: "mrkdwn", text: ($gitleaks_icon + " Secret Scan") },
                    { type: "mrkdwn", text: ($trivy_icon + " Vuln Scan") },
                    { type: "mrkdwn", text: ($codeql_icon + " CodeQL SAST") },
                    { type: "mrkdwn", text: ($preflight_icon + " Red Hat Preflight") }
                  ]
                },
                {
                  type: "context",
                  elements: [
                    { type: "mrkdwn", text: ("<" + $run_url + "|View Run #" + $run_number + ">") }
                  ]
                }
              ]
            }')

          curl -sf -X POST "$SLACK_WEBHOOK" \
            -H 'Content-type: application/json' \
            -d "$PAYLOAD"
