name: Project Metrics Tracker

on:
  schedule:
    # Every 15 min: collect metrics, push to analytics, and send whichever
    # Slack digest is due. The digests deliberately have no cron of their own —
    # GitHub delays and drops scheduled runs, so a digest tied to one 07:00
    # event was lost whenever that event was. See "Plan digests".
    - cron: '5,20,35,50 * * * *'
  workflow_dispatch:
    inputs:
      force_digest:
        description: 'Send the weekly digest now (week ending the most recent Monday)'
        type: boolean
        default: false

# Serialise runs: they share the metrics cache, push to the `metrics` branch,
# and read the digest markers there — two runs at once could both send a digest.
concurrency:
  group: project-metrics
  cancel-in-progress: false

permissions:
  contents: read   # repo metadata + traffic API

jobs:
  track:
    runs-on: ubuntu-latest
    permissions:
      # write: runs commit the metrics history and digest markers to the `metrics` branch.
      # `main` cannot be used — it requires a PR + review and enforces admins,
      # so a CI push there is impossible without weakening branch protection.
      contents: write
    steps:
      # ── Restore cached metrics ──────────────────────────────
      # Uses run_id-based key rotation to avoid needing actions:write for cache delete.
      # Save always creates a new key; restore-keys finds the latest.
      - name: Restore metrics cache
        id: cache-restore
        uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: metrics.json
          key: project-metrics-${{ github.run_id }}
          restore-keys: |
            project-metrics-

      # The cache holds only the previous run's values, for the 15-minute
      # analytics delta and the milestone marker. It is NOT where the digest
      # baselines live: the repo's Actions cache sits at its 10 GB cap and
      # evicts this entry routinely, and a miss used to reseed the week/day
      # baselines to "now" — so the next digest reported +0 across the board.
      # See "Plan digests" below.
      - name: Load previous metrics
        id: prev
        run: |
          if [ -f metrics.json ]; then
            cat metrics.json
            echo "docker_pulls=$(jq -r '.docker_pulls // 0' metrics.json)" >> "$GITHUB_OUTPUT"
            echo "stars=$(jq -r '.stars // 0' metrics.json)" >> "$GITHUB_OUTPUT"
            echo "forks=$(jq -r '.forks // 0' metrics.json)" >> "$GITHUB_OUTPUT"
            echo "last_milestone=$(jq -r '.last_milestone // 0' metrics.json)" >> "$GITHUB_OUTPUT"
            echo "has_data=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_data=false" >> "$GITHUB_OUTPUT"
            for key in docker_pulls stars forks last_milestone; do
              echo "${key}=0" >> "$GITHUB_OUTPUT"
            done
          fi

      # ── Fetch current metrics ───────────────────────────────
      - name: Fetch Docker Hub pulls
        id: docker
        env:
          PREV_PULLS: ${{ steps.prev.outputs.docker_pulls }}
        run: |
          set -uo pipefail
          # `curl -sf` prints nothing and exits non-zero on an HTTP error, and jq
          # over empty input prints nothing, so without pipefail this step used to
          # SUCCEED with an empty `pulls=` output. That empty value then reached
          # the GA4 and Umami payloads as `"docker_pulls": ,` - invalid JSON, two
          # junk POSTs - and `jq --argjson docker_pulls ""`, which aborts "Build
          # metrics snapshot" before "Save metrics cache", so the baseline was not
          # rolled forward either. Meanwhile "Compute deltas" evaluated
          # `$(( - 300000 ))` and reported a phantom milestone. Docker Hub's
          # unauthenticated endpoint is polled 96 times a day by this cron, so a
          # blip is routine rather than exceptional.
          #
          # Carrying the previous value forward is the same shape as the traffic
          # step above, and it keeps the delta at 0 instead of inventing one. The
          # digits-only guard is the one "Persist metrics history" already gets
          # right: jq prints the literal `null` for a missing field, which is
          # non-empty, so an emptiness check alone would let it through.
          #
          # ok=false marks a carried value as not fresh. "Persist metrics
          # history" then leaves the day's row to a later run: on a cache miss
          # the carried value is 0, and a 0 row would become a digest baseline.
          OK=true
          PULLS=$(curl -sf --connect-timeout 10 --max-time 30 https://hub.docker.com/v2/repositories/labsai/eddi/ | jq -r '.pull_count // empty')
          case "${PULLS:-}" in
            ''|*[!0-9]*)
              echo "::warning::Docker Hub returned no usable pull_count - carrying the previous value forward"
              OK=false
              PULLS="${PREV_PULLS:-0}"
              ;;
          esac
          case "${PULLS:-}" in
            ''|*[!0-9]*) PULLS=0 ;;
          esac
          echo "pulls=$PULLS" >> "$GITHUB_OUTPUT"
          echo "ok=$OK" >> "$GITHUB_OUTPUT"
          echo "Docker pulls: $PULLS"

      # Every tag with the time it was last pulled. pull_count alone cannot
      # tell people from bots: since 2026-10-18 something pulls all of the
      # image's tags at once every ~2 h (every tag_last_pulled within one
      # millisecond), which put ~1,800 "pulls" a day into the digest while
      # the real rate was a few. "Persist metrics history" compares these
      # timestamps with the previous run's to tell such a sweep from real
      # pulls, and which tags the real ones were.
      #
      # Fetched after pull_count on purpose, and `checked_at` is taken last:
      # a sweep landing between the two reads then shows up as tags now and
      # as count next run, which the run log's bot_debt absorbs. The
      # opposite order would count that sweep as real pulls.
      - name: Fetch Docker Hub tags
        id: tags
        run: |
          set -uo pipefail
          OK=true
          URL="https://hub.docker.com/v2/repositories/labsai/eddi/tags?page_size=100"
          : > tags.ndjson
          PAGES=0
          while [ -n "$URL" ]; do
            PAGES=$(( PAGES + 1 ))
            # 100 per page; 20 pages is far beyond the ~200 tags there are.
            if [ "$PAGES" -gt 20 ]; then OK=false; break; fi
            # A deadline per page: an accepted-but-stalled connection would
            # otherwise hold the job (and, through the concurrency group,
            # every later run) until GitHub's 6-hour job limit.
            PAGE=$(curl -sf --connect-timeout 10 --max-time 30 "$URL") || { OK=false; break; }
            printf '%s' "$PAGE" | jq -c '.results[] | {name, pulled: .tag_last_pulled}' >> tags.ndjson \
              || { OK=false; break; }
            URL=$(printf '%s' "$PAGE" | jq -r '.next // ""')
          done
          TOTAL=$(wc -l < tags.ndjson | tr -d ' ')
          [ "$TOTAL" -gt 0 ] || OK=false
          [ "$OK" = true ] || echo "::warning::Docker Hub tag list incomplete - no run-log entry this run"
          {
            echo "ok=$OK"
            echo "total=$TOTAL"
            echo "checked_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
          echo "Docker Hub tags: $TOTAL"

      - name: Fetch GitHub stats
        id: github
        env:
          GH_TOKEN: ${{ github.token }}
          PREV_STARS: ${{ steps.prev.outputs.stars }}
          PREV_FORKS: ${{ steps.prev.outputs.forks }}
        run: |
          set -uo pipefail
          # Same shape as the Docker Hub step. Unguarded, a failed call left
          # STARS empty, so "Compute deltas" evaluated `$(( - 380 ))` and the
          # analytics payloads carried `"github_stars": ,`.
          OK=true
          REPO_DATA=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/labsai/EDDI) || REPO_DATA=""
          STARS=$(printf '%s' "$REPO_DATA" | jq -r '.stargazers_count // empty' 2>/dev/null)
          FORKS=$(printf '%s' "$REPO_DATA" | jq -r '.forks_count // empty' 2>/dev/null)
          case "${STARS:-x}" in *[!0-9]*) OK=false; STARS="${PREV_STARS:-0}" ;; esac
          case "${FORKS:-x}" in *[!0-9]*) OK=false; FORKS="${PREV_FORKS:-0}" ;; esac
          [ "$OK" = true ] || echo "::warning::GitHub repo API returned no usable counts - carrying the previous values forward"
          echo "stars=$STARS" >> "$GITHUB_OUTPUT"
          echo "forks=$FORKS" >> "$GITHUB_OUTPUT"
          echo "ok=$OK" >> "$GITHUB_OUTPUT"
          echo "Stars: $STARS, Forks: $FORKS"

      - name: Fetch GitHub traffic (views + clones)
        id: traffic
        env:
          # METRICS_PAT has admin:read scope for traffic API; falls back to GITHUB_TOKEN
          GH_TOKEN: ${{ secrets.METRICS_PAT || github.token }}
        run: |
          VIEWS_DATA=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/labsai/EDDI/traffic/views)
          if echo "$VIEWS_DATA" | jq -e '.count' > /dev/null 2>&1; then
            VIEWS=$(echo "$VIEWS_DATA" | jq '.count // 0')
            UNIQUES=$(echo "$VIEWS_DATA" | jq '.uniques // 0')
          else
            echo "⚠️  Traffic API unavailable — set METRICS_PAT secret for traffic data"
            VIEWS=0; UNIQUES=0
          fi

          CLONES_DATA=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/labsai/EDDI/traffic/clones)
          if echo "$CLONES_DATA" | jq -e '.count' > /dev/null 2>&1; then
            CLONES=$(echo "$CLONES_DATA" | jq '.count // 0')
          else
            CLONES=0
          fi

          echo "views=$VIEWS" >> "$GITHUB_OUTPUT"
          echo "uniques=$UNIQUES" >> "$GITHUB_OUTPUT"
          echo "clones=$CLONES" >> "$GITHUB_OUTPUT"
          echo "Views: $VIEWS (uniques: $UNIQUES), Clones: $CLONES"

      # ── Compute deltas ──────────────────────────────────────
      - name: Compute deltas
        id: delta
        run: |
          PULL_DIFF=$(( ${{ steps.docker.outputs.pulls }} - ${{ steps.prev.outputs.docker_pulls }} ))
          STAR_DIFF=$(( ${{ steps.github.outputs.stars }} - ${{ steps.prev.outputs.stars }} ))
          FORK_DIFF=$(( ${{ steps.github.outputs.forks }} - ${{ steps.prev.outputs.forks }} ))
          echo "pull_diff=$PULL_DIFF" >> "$GITHUB_OUTPUT"
          echo "star_diff=$STAR_DIFF" >> "$GITHUB_OUTPUT"
          echo "fork_diff=$FORK_DIFF" >> "$GITHUB_OUTPUT"

          # Check for changes
          if [ "$PULL_DIFF" -ne 0 ] || [ "$STAR_DIFF" -ne 0 ] || [ "$FORK_DIFF" -ne 0 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

          # Milestone check (every 10,000 pulls)
          CURRENT=${{ steps.docker.outputs.pulls }}
          LAST_MS=${{ steps.prev.outputs.last_milestone }}
          CURRENT_MS=$(( CURRENT / 10000 * 10000 ))
          if [ "$CURRENT_MS" -gt "$LAST_MS" ] && [ "$LAST_MS" -ne 0 ]; then
            echo "milestone=$CURRENT_MS" >> "$GITHUB_OUTPUT"
          else
            echo "milestone=0" >> "$GITHUB_OUTPUT"
          fi

      # ── Push to analytics (always, if data changed) ─────────
      - name: Send to Google Analytics 4
        if: steps.delta.outputs.changed == 'true' && steps.prev.outputs.has_data == 'true'
        continue-on-error: true
        env:
          GA4_SECRET: ${{ secrets.GA4_API_SECRET }}
        run: |
          curl -sf -X POST \
            "https://www.google-analytics.com/mp/collect?measurement_id=G-L1011GL1PY&api_secret=$GA4_SECRET" \
            -H 'Content-Type: application/json' \
            -d "{
              \"client_id\": \"github-actions.metrics\",
              \"events\": [{
                \"name\": \"project_metrics\",
                \"params\": {
                  \"docker_pulls\": ${{ steps.docker.outputs.pulls }},
                  \"docker_delta\": ${{ steps.delta.outputs.pull_diff }},
                  \"github_stars\": ${{ steps.github.outputs.stars }},
                  \"github_forks\": ${{ steps.github.outputs.forks }},
                  \"github_views\": ${{ steps.traffic.outputs.views }},
                  \"github_clones\": ${{ steps.traffic.outputs.clones }},
                  \"engagement_time_msec\": 1
                }
              }]
            }"

      - name: Send to Umami Cloud
        if: steps.delta.outputs.changed == 'true' && steps.prev.outputs.has_data == 'true'
        continue-on-error: true
        run: |
          curl -sf -X POST "https://cloud.umami.is/api/send" \
            -H 'Content-Type: application/json' \
            -H 'User-Agent: EDDI-GitHub-Actions/1.0' \
            -d "{
              \"type\": \"event\",
              \"payload\": {
                \"hostname\": \"eddi.labs.ai\",
                \"language\": \"en-US\",
                \"url\": \"/project-metrics\",
                \"website\": \"06a369b1-4a64-4262-9f6e-0a987ca7122a\",
                \"name\": \"project_metrics\",
                \"data\": {
                  \"docker_pulls\": ${{ steps.docker.outputs.pulls }},
                  \"docker_delta\": ${{ steps.delta.outputs.pull_diff }},
                  \"github_stars\": ${{ steps.github.outputs.stars }},
                  \"github_forks\": ${{ steps.github.outputs.forks }},
                  \"github_views\": ${{ steps.traffic.outputs.views }},
                  \"github_clones\": ${{ steps.traffic.outputs.clones }}
                }
              }
            }"

      # ── Milestone alert (immediate) ─────────────────────────
      - name: Milestone celebration
        if: steps.delta.outputs.milestone != '0'
        continue-on-error: true
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          MS=$(printf "%'d" ${{ steps.delta.outputs.milestone }})
          curl -sf -X POST "$SLACK_WEBHOOK" \
            -H 'Content-type: application/json' \
            -d "{
              \"blocks\": [
                {
                  \"type\": \"header\",
                  \"text\": { \"type\": \"plain_text\", \"text\": \"🎉  EDDI hit ${MS} Docker pulls!\", \"emoji\": true }
                },
                {
                  \"type\": \"section\",
                  \"text\": {
                    \"type\": \"mrkdwn\",
                    \"text\": \"⭐ Stars: ${{ steps.github.outputs.stars }}  ·  🍴 Forks: ${{ steps.github.outputs.forks }}\"
                  }
                }
              ]
            }"

      # ── Save updated metrics ────────────────────────────────
      - name: Build metrics snapshot
        run: |
          CUR_PULLS=${{ steps.docker.outputs.pulls }}
          CUR_STARS=${{ steps.github.outputs.stars }}
          CUR_FORKS=${{ steps.github.outputs.forks }}

          # Current milestone marker
          CURRENT_MS=$(( CUR_PULLS / 10000 * 10000 ))

          jq -n \
            --argjson docker_pulls "$CUR_PULLS" \
            --argjson stars "$CUR_STARS" \
            --argjson forks "$CUR_FORKS" \
            --argjson last_milestone "$CURRENT_MS" \
            '{docker_pulls: $docker_pulls, stars: $stars, forks: $forks,
              last_milestone: $last_milestone}' > metrics.json

          echo "Saved metrics:"
          cat metrics.json

      - name: Save metrics cache
        uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4
        with:
          path: metrics.json
          key: project-metrics-${{ github.run_id }}

      # ── Persist history to the `metrics` branch ──────────────
      # Why this exists: the Actions cache above holds only a rolling snapshot,
      # and job logs expire after 90 days — so the series was unrecoverable
      # past that horizon. This writes one row per UTC day to an orphan branch
      # that no workflow builds from (`main` is not an option: it requires a PR
      # plus review and enforces admins, and every push there would also fire
      # scorecard.yml).
      #
      # Aggregates only. It used to also snapshot the stargazer roster (every
      # login with its starred_at) so that diffing consecutive snapshots showed
      # *who* unstarred — a per-person record GitHub deliberately does not
      # publish, kept forever, for a question the aggregate star count already
      # answers. That collection has stopped: the step removes the file from the
      # branch tip, and the branch README below says how to purge its history.
      #
      # Deliberately NOT gated on the 07:00 'daily' schedule: GitHub drops
      # scheduled runs under load (observed: ~48 min median spacing against a
      # 15 min cron, and one 9.6 h gap), and a dropped 07:00 run would lose
      # that day permanently — the values cannot be backfilled. Instead the
      # first run of each UTC day with fresh values writes the row; every later
      # run that day sees it and leaves it alone. That also makes a failed push
      # self-healing, since the next run simply retries.
      #
      # The checkout it leaves in hist/ is what the digest steps below read,
      # so it is kept even when no row is written or the push fails.
      - name: Persist metrics history
        id: history
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: metrics
          FRESH: ${{ steps.docker.outputs.ok == 'true' && steps.github.outputs.ok == 'true' }}
          PULLS: ${{ steps.docker.outputs.pulls }}
          STARS: ${{ steps.github.outputs.stars }}
          FORKS: ${{ steps.github.outputs.forks }}
          VIEWS: ${{ steps.traffic.outputs.views }}
          UNIQUES: ${{ steps.traffic.outputs.uniques }}
          CLONES: ${{ steps.traffic.outputs.clones }}
          DOCKER_OK: ${{ steps.docker.outputs.ok }}
          TAGS_OK: ${{ steps.tags.outputs.ok }}
          TAG_TOTAL: ${{ steps.tags.outputs.total }}
          CHECKED_AT: ${{ steps.tags.outputs.checked_at }}
        run: |
          set -euo pipefail

          rm -rf hist && mkdir hist && cd hist
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # Reuse the branch if it exists; otherwise start it empty (orphan).
          # --depth=1 keeps the fetch O(1) as the series grows; the remote
          # still retains full history because the pushed commit's ancestors
          # are already there.
          #
          # "Missing" and "unreachable" must not be confused: treating any
          # fetch error as a missing branch started a fresh orphan with one row.
          # Its push is rejected as non-fast-forward, so no data was lost, but
          # the digest steps would have read an empty history. ls-remote exits
          # 2 only when the ref does not exist.
          set +e
          git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null
          REMOTE_STATUS=$?
          set -e
          case "$REMOTE_STATUS" in
            0)
              git fetch -q --depth=1 origin "$BRANCH"
              git checkout -q -B "$BRANCH" FETCH_HEAD
              ;;
            2)
              echo "Branch '$BRANCH' not found — creating it"
              git checkout -q -b "$BRANCH"
              ;;
            *)
              echo "::error::Could not read branch '$BRANCH' from origin (git ls-remote exit ${REMOTE_STATUS})"
              exit 1
              ;;
          esac

          mkdir -p data
          HEADER="date,docker_pulls,stars,forks,views_14d,uniques_14d,clones_14d"
          [ -f data/metrics.csv ] || echo "$HEADER" > data/metrics.csv

          # `>>` writes at the current end of file, so a missing trailing
          # newline would splice today's row onto the previous one and corrupt
          # both. Only reachable after a hand edit or a truncated push, but
          # this branch is the only durable copy — cheap to prevent, costly to
          # repair.
          if [ -s data/metrics.csv ] && [ -n "$(tail -c1 data/metrics.csv)" ]; then
            echo >> data/metrics.csv
          fi

          # The history is readable from here on, whatever happens below.
          echo "ready=true" >> "$GITHUB_OUTPUT"

          # Never commit a malformed row: a gap is visible, a bad value is not.
          # Must test for digits, not just non-emptiness — jq prints the
          # literal `null` for a missing field, which is non-empty. A value
          # carried forward after a failed fetch (FRESH=false) is refused too:
          # on a cache miss it is 0, and a 0 row would later serve as a digest
          # baseline ("+400,871 pulls this week"). A later run writes the row.
          append_today() {
            local name value
            if grep -q "^${TODAY}," data/metrics.csv; then
              echo "Row for ${TODAY} already present"
              return 1
            fi
            if [ "$FRESH" != "true" ]; then
              echo "::warning::A metrics fetch failed this run — leaving the ${TODAY} row to a later run"
              return 1
            fi
            for name in PULLS STARS FORKS VIEWS UNIQUES CLONES; do
              value="${!name:-}"
              case "$value" in
                ''|*[!0-9]*)
                  echo "::warning::Metric ${name} is not a number ('${value}') — not writing the ${TODAY} row"
                  return 1
                  ;;
              esac
            done
            echo "${TODAY},${PULLS},${STARS},${FORKS},${VIEWS},${UNIQUES},${CLONES}" >> data/metrics.csv
            echo "Appended row for ${TODAY}"
          }

          TODAY=$(date -u +%F)
          ROW_ADDED=false
          if append_today; then ROW_ADDED=true; fi

          # ── Run log: one line per run, for the real-pull estimate ──
          # pull_count counts a bot sweep of every tag the same as a person.
          # Each line covers the interval since the previous line and splits
          # its pull_count increase three ways:
          #
          #   bot   ≥ SWEEP_MIN_TAGS tags pulled in the interval: a sweep, and
          #         each sweep costs one pull per tag. A long gap (GitHub
          #         drops runs) can hold several; the timestamps keep only
          #         the last, so their number is estimated as delta / tags.
          #   ci    otherwise, each `-b<N>` build tag pulled once — ci.yml's
          #         post-push check pulls every build it publishes.
          #   real  the rest. real_tags names the other tags pulled, i.e.
          #         which versions people use; a sweep overwrites every
          #         timestamp, so sweep intervals name none.
          #
          # bot_debt: Docker Hub can show a sweep's tag timestamps before its
          # pull_count catches up, so a sweep can land in the count one or
          # more runs after its timestamps. What could not be subtracted yet
          # is carried, and always applied to the next interval — which holds
          # the late count however long that interval is. A remainder is
          # carried further only while it is younger than DEBT_MAX_AGE (from
          # debt_since): an expected pull that never arrives must not eat real
          # pulls for ever. The two errors are not symmetric — dropping debt
          # too early books a whole sweep (~200) as real, keeping it too long
          # hides a few real pulls — hence a generous age.
          #
          # The previous line is the baseline, so this needs no cache. A run
          # with a failed fetch writes nothing and the next interval is
          # simply longer; a failed push heals the same way. A malformed last
          # line starts a new baseline rather than blocking the log for good.
          RUNS=data/runs.csv
          RUNS_HEADER="checked_at,docker_pulls,tags,tags_pulled,sweeps,bot_pulls,ci_pulls,real_pulls,real_total,bot_debt,debt_since,real_tags"
          SWEEP_MIN_TAGS=20
          DEBT_MAX_AGE=7200
          [ -f "$RUNS" ] || echo "$RUNS_HEADER" > "$RUNS"
          if [ -s "$RUNS" ] && [ -n "$(tail -c1 "$RUNS")" ]; then
            echo >> "$RUNS"
          fi

          append_run() {
            local last p_at p_pulls p_total p_debt p_debt_since x delta counts pulled ci_tags real_tags
            local sweeps=0 bot=0 ci=0 avail old_left=0 new_left=0 real debt debt_since=""
            local iso='^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$'
            if [ "$DOCKER_OK" != "true" ] || [ "$TAGS_OK" != "true" ]; then
              echo "::warning::Docker Hub fetch incomplete — no run-log line this run"
              return 1
            fi
            for x in "$PULLS" "$TAG_TOTAL"; do
              case "$x" in ''|*[!0-9]*) echo "::warning::Run log: non-numeric input '${x}'"; return 1 ;; esac
            done
            if [[ ! "$CHECKED_AT" =~ $iso ]]; then
              echo "::warning::Run log: bad check time '${CHECKED_AT}'"
              return 1
            fi

            last=$(tail -n1 "$RUNS")
            if [ "$last" != "$RUNS_HEADER" ]; then
              IFS=, read -r p_at p_pulls _ _ _ _ _ _ p_total p_debt p_debt_since _ <<< "$last"
              for x in "$p_pulls" "$p_total" "$p_debt"; do
                case "$x" in ''|*[!0-9]*) p_at="" ;; esac
              done
              if [[ ! "$p_at" =~ $iso ]] || { [ -n "$p_debt_since" ] && [[ ! "$p_debt_since" =~ $iso ]]; }; then
                echo "::warning::Last line of ${RUNS} is malformed — starting a new baseline: ${last}"
                last=$RUNS_HEADER
              fi
            fi
            if [ "$last" = "$RUNS_HEADER" ]; then
              # A baseline only: its interval is unknown, so it counts nothing.
              echo "${CHECKED_AT},${PULLS},${TAG_TOTAL},0,0,0,0,0,0,0,," >> "$RUNS"
              echo "Run log baseline at ${CHECKED_AT}"
              return 0
            fi
            if [[ ! "$CHECKED_AT" > "$p_at" ]]; then
              echo "::warning::Run log already has a line at or after ${CHECKED_AT}"
              return 1
            fi

            delta=$(( PULLS - p_pulls ))
            if [ "$delta" -lt 0 ]; then delta=0; fi

            # Tags pulled in (p_at, CHECKED_AT]: count, build tags, the others.
            # Fractional seconds are dropped so fromdateiso8601 accepts them.
            counts=$(jq -rs --arg from "$p_at" --arg to "$CHECKED_AT" '
              def epoch: sub("\\.[0-9]+"; "") | fromdateiso8601;
              ($from | epoch) as $f | ($to | epoch) as $t
              | [ .[] | select(.pulled != null and ((.pulled | epoch) as $e | $e > $f and $e <= $t)) ] as $p
              | ($p | map(select(.name | test("-b[0-9]+$")))) as $ci
              | [ ($p | length), ($ci | length),
                  ($p | map(select(.name | test("-b[0-9]+$") | not) | .name) | sort | join(";")) ]
              | map(tostring) | join(",")' ../tags.ndjson)
            IFS=, read -r pulled ci_tags real_tags <<< "$counts"
            # set -e does not reach inside a function called as `f || true`.
            for x in "$pulled" "$ci_tags"; do
              case "$x" in ''|*[!0-9]*) echo "::warning::Run log: could not read the tag list"; return 1 ;; esac
            done

            # The carried debt is paid first: its count arrives before this
            # interval's. What it leaves unpaid stays only while young enough.
            avail=$(( delta - p_debt ))
            if [ "$avail" -lt 0 ]; then
              old_left=$(( -avail )); avail=0
              if [ $(( $(date -u -d "$CHECKED_AT" +%s) - $(date -u -d "$p_debt_since" +%s) )) -ge "$DEBT_MAX_AGE" ]; then
                echo "Run log: dropping ${old_left} expected pulls that never arrived (owed since ${p_debt_since})"
                old_left=0
              fi
            fi

            # Sweeps from what is left once the debt is paid, so a late count
            # in the same interval as a new sweep is not taken for a second one.
            if [ "$pulled" -ge "$SWEEP_MIN_TAGS" ]; then
              sweeps=$(( avail / pulled ))
              if [ "$sweeps" -lt 1 ]; then sweeps=1; fi
              bot=$(( sweeps * pulled ))
              real_tags=""
            else
              ci=$ci_tags
            fi

            if [ "$avail" -ge $(( bot + ci )) ]; then
              real=$(( avail - bot - ci ))
            else
              real=0; new_left=$(( bot + ci - avail ))
            fi
            debt=$(( old_left + new_left ))
            if [ "$old_left" -gt 0 ]; then debt_since=$p_debt_since
            elif [ "$new_left" -gt 0 ]; then debt_since=$CHECKED_AT
            fi

            echo "${CHECKED_AT},${PULLS},${TAG_TOTAL},${pulled},${sweeps},${bot},${ci},${real},$(( p_total + real )),${debt},${debt_since},${real_tags}" >> "$RUNS"
            echo "Run log: +${delta} pulls since ${p_at} = ${bot} bot (${sweeps} sweeps) + ${ci} ci + ${real} real${real_tags:+ (${real_tags})}, ${debt} owed"
          }
          append_run || true

          # Data minimisation: the per-person stargazer roster is no longer
          # collected, and a copy left at the branch tip by an older run is
          # removed (its past commits remain; see the README's purge recipe).
          if [ -f data/stargazers.csv ]; then
            git rm -q data/stargazers.csv
            echo "Removed data/stargazers.csv (per-person data is no longer collected)"
          fi

          # Orient anyone who lands on the branch; it is machine-written and
          # has no source tree, which is otherwise confusing.
          # Rewritten every run (a no-op when unchanged), so a branch created by
          # an older version of this step loses its stale description too.
          cat > README.md <<'MD'
          # EDDI project metrics history

          Machine-generated by the `Project Metrics Tracker` workflow. Do not
          edit by hand and do not merge into `main` — this is an orphan branch
          with no source tree.

          - `data/metrics.csv` — one row per UTC day: Docker pulls, stars,
            forks, and GitHub's rolling 14-day views/clones. Aggregate counts
            only; nothing here identifies a person.
          - `data/runs.csv` — one line per workflow run (~every 15-60 min):
            how much pull_count rose since the previous line, split into bot
            sweeps of every tag, this repo's own CI pulls of `-b<N>` build
            tags, and the rest ("real"), plus which other tags those real
            pulls were. Estimates, from tag pull timestamps; the workflow's
            "Persist metrics history" step documents the method.
          - `data/digests.json` — the last daily and weekly Slack digest
            sent, by window end date. Deleting it re-sends both.

          ## Personal data

          None is collected. Until 2026-10 this branch also kept
          `data/stargazers.csv` — every stargazer's GitHub login and star
          time, re-snapshotted daily so its commit history recorded who
          unstarred and when. That collection was stopped as data
          minimisation (the aggregate star count answers the project-health
          question) and the file was removed from the branch tip, but the
          snapshots remain in this branch's history.

          To purge them, rewrite the branch on a fresh clone. Nothing builds
          from `metrics`, so force-pushing it is safe — but force-push
          `metrics` only:

              git clone --single-branch -b metrics <repo-url> purge
              cd purge
              git filter-repo --force --refs metrics --path data/stargazers.csv --invert-paths
              git push --force origin metrics

          The pre-rewrite commits survive in existing clones and stay
          reachable on GitHub until it garbage-collects them — ask GitHub
          Support to expire them if the removal has to be complete.
          MD

          git add data README.md
          if git diff --quiet --cached; then
            echo "Nothing changed"
          else
            if [ "$ROW_ADDED" = true ]; then
              git commit -q -m "chore(metrics): ${TODAY} — ${PULLS} pulls, ${STARS} stars"
            else
              git commit -q -m "chore(metrics): run ${CHECKED_AT:-$TODAY}"
            fi
            git push -q origin "$BRANCH"
            echo "Pushed to '$BRANCH'"
          fi

      # ── Plan digests ─────────────────────────────────────────
      # Decides which Slack digest is due and computes it, from the `metrics`
      # branch alone (hist/, checked out above):
      #
      #   daily   due from 07:00 UTC — yesterday's row → today's row
      #   weekly  due from Monday 07:00 UTC — the previous Monday's row → this
      #           Monday's row
      #
      # Both used to hang off their own 07:00 cron and keep their baselines in
      # the Actions cache. That failed twice over. The cache is evicted
      # routinely and a miss reseeded the baseline to "now": on 2026-09-28 a
      # cold-start run at 14:55 did exactly that, the Monday run GitHub had
      # delayed to 15:03 found an eight-minute-old baseline, and every metric
      # read "(0)". And GitHub drops scheduled runs, so a dropped 07:00 event
      # lost that day's or week's digest outright.
      #
      # Now any run may send a digest once it is due, and data/digests.json
      # records the window end date of the last one of each kind, so each goes
      # out exactly once, however late the first run after 07:00 arrives.
      # Rows are first-run-of-the-day snapshots, so consecutive windows are
      # contiguous and a re-run computes the same numbers. A day without a row
      # falls back to the latest row up to two days earlier; the message names
      # the dates it actually compares. With no usable row the digest is
      # skipped and recorded rather than posted with made-up numbers, unless
      # the missing row is today's, which a later run still writes.
      #
      # A daily digest not sent by midnight UTC is superseded by the next
      # day's rather than sent late; that takes 17 hours without a single run.
      - name: Plan digests
        id: plan
        if: steps.history.outputs.ready == 'true'
        env:
          FORCE: ${{ github.event.inputs.force_digest == 'true' }}
          SLACK_CONFIGURED: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
        run: |
          set -uo pipefail
          # Without a webhook nothing can be delivered, so plan nothing: a
          # claimed-but-unpostable digest would either be recorded as sent and
          # never arrive, or be claimed and released on every run. Left
          # unplanned, both digests stay due and go out once the secret is set.
          if [ "$SLACK_CONFIGURED" != "true" ]; then
            echo "::warning::SLACK_WEBHOOK_URL is not configured — no digest planned"
            exit 0
          fi

          CSV=hist/data/metrics.csv
          RUNS_CSV=hist/data/runs.csv
          MARKERS=hist/data/digests.json
          DUE_HOUR=7
          read -r TODAY HOUR DOW <<< "$(date -u '+%F %H %u')"
          HOUR=$(( 10#$HOUR ))
          MONDAY=$(date -u -d "$TODAY -$(( DOW - 1 )) days" +%F)

          out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }

          # An unreadable marker file would read as "never sent" and make both
          # digests due on every run, so refuse it outright.
          if [ -f "$MARKERS" ] && ! jq -e 'type == "object"' "$MARKERS" > /dev/null; then
            echo "::error::${MARKERS#hist/} on the metrics branch is not a JSON object — sending no digest until it is fixed"
            exit 1
          fi

          last_sent() {
            if [ -f "$MARKERS" ]; then jq -r --arg k "$1" '.[$k] // ""' "$MARKERS"; fi
          }

          # Latest usable row dated within [target - 2 days, target]. ISO dates
          # compare correctly as strings, and rows are appended in date order.
          pick() {
            local oldest row
            oldest=$(date -u -d "$1 -2 days" +%F)
            while IFS= read -r row; do
              usable "$row" && { echo "$row"; return; }
            done < <(awk -F, -v t="$1" -v o="$oldest" \
              'NR > 1 && $1 <= t && $1 >= o { r[++n] = $0 } END { while (n) print r[n--] }' "$CSV")
          }

          # A date and six counters. Docker pulls are never 0 for this image,
          # so a 0 there is a failed fetch that reached the history (rows
          # written before "Persist" refused carried values can hold one).
          usable() {
            local p s f v u c x
            IFS=, read -r _ p s f v u c <<< "$1"
            for x in "$p" "$s" "$f" "$v" "$u" "$c"; do
              case "$x" in ''|*[!0-9]*) return 1 ;; esac
            done
            [ "$p" -gt 0 ]
          }

          signed() { if [ "$1" -gt 0 ]; then echo "+$1"; else echo "$1"; fi; }

          plan() {
            local kind=$1 end_target=$2 days=$3 start_target end start
            local ed ep es ef ev eu ec sd sp ss sf sv sc view_delta="" clone_delta=""
            start_target=$(date -u -d "$end_target -$days days" +%F)
            end=$(pick "$end_target")
            start=$(pick "$start_target")
            # A window ending today needs today's row itself: falling back to
            # yesterday's would end the window early and, for the daily digest,
            # compare a row with itself and record "no activity".
            if [ "$end_target" = "$TODAY" ] && [ "${end%%,*}" != "$TODAY" ]; then
              end=""
            fi

            if ! usable "$end"; then
              if [ "$end_target" = "$TODAY" ]; then
                echo "::warning::${kind} digest: no usable row for ${TODAY} yet — a later run will retry"
              else
                echo "::warning::${kind} digest: no usable row near ${end_target} — skipping it"
                out "${kind}_record" true
              fi
              return
            fi
            if ! usable "$start"; then
              echo "::warning::${kind} digest: no usable baseline row near ${start_target} — skipping it"
              out "${kind}_record" true
              return
            fi

            IFS=, read -r ed ep es ef ev eu ec <<< "$end"
            IFS=, read -r sd sp ss sf sv _ sc <<< "$start"
            echo "${kind} digest: ${start} → ${end}"

            if [ "$kind" = daily ] && [ "$ep" -eq "$sp" ] && [ "$es" -eq "$ss" ] && [ "$ef" -eq "$sf" ]; then
              echo "daily digest: no activity — nothing to send"
              out "${kind}_record" true
              return
            fi

            # 0 is what the traffic step writes when that API is unavailable,
            # so a delta against it would be noise, not a change.
            if [ "$sv" -gt 0 ] && [ "$ev" -gt 0 ]; then view_delta=$(signed $(( ev - sv ))); fi
            if [ "$sc" -gt 0 ] && [ "$ec" -gt 0 ]; then clone_delta=$(signed $(( ec - sc ))); fi

            # The run log's estimate for the same span as the delta above.
            # Rows are first-run-of-the-day snapshots, so that span runs from
            # the first run on the `from` day to the first run on the `to` day.
            # Each log line covers (previous run, its run], so the window is
            # every line after the first one dated `from`, up to and including
            # the first one dated `to`. Consecutive windows therefore share no
            # line and miss none — an interval crossing midnight lands in
            # exactly one, as the row delta does. A log that starts inside the
            # window gives a partial figure labelled with when it starts; none
            # at all gives no line. Neither does a log with no line on the
            # `from` day: the first line it has is past the window, so the
            # window is empty rather than borrowing an interval after it.
            local real="" sweeps="" real_since="" versions="" summary window
            # Lines that are not timestamped (a damaged line the run log then
            # restarted after) are skipped: "g…" sorts after any date and
            # would otherwise close the window early.
            # shellcheck disable=SC2016  # an awk program: its $1 is awk's
            window='
              $1 !~ /^[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]T/ { next }
              first == "" { first = $1 }
              state == 2 { next }
              state == 0 { if ($1 >= from) state = ($1 >= to ? 2 : 1); next }
              $1 >= to { state = 2 }'
            if [ -f "$RUNS_CSV" ]; then
              summary=$(awk -F, -v from="${sd}T00:00:00Z" -v to="${ed}T00:00:00Z" "$window"'
                { real += $8; sweeps += $5; n++ }
                END { if (n) printf "%d,%d,%s", real, sweeps, (first >= from ? first : "") }' "$RUNS_CSV")
              if [ -n "$summary" ]; then
                IFS=, read -r real sweeps real_since <<< "$summary"
                real=$(signed "$real")
                # Each tag with the number of intervals it was pulled in —
                # not a pull count, which Docker Hub does not publish per tag.
                versions=$(awk -F, -v from="${sd}T00:00:00Z" -v to="${ed}T00:00:00Z" "$window"'
                  $12 != "" { n = split($12, t, ";"); for (i = 1; i <= n; i++) print t[i] }' "$RUNS_CSV" \
                  | sort | uniq -c | sort -k1,1nr -k2,2 | head -n 5 \
                  | awk '{ printf "%s%s ×%d", sep, $2, $1; sep = ", " }')
              fi
            fi

            {
              echo "${kind}_real=$real"
              echo "${kind}_sweeps=$sweeps"
              echo "${kind}_real_since=$real_since"
              echo "${kind}_versions=$versions"
              echo "${kind}_send=true"
              echo "${kind}_from=$sd"
              echo "${kind}_to=$ed"
              echo "${kind}_pulls=$ep"
              echo "${kind}_stars=$es"
              echo "${kind}_forks=$ef"
              echo "${kind}_views=$ev"
              echo "${kind}_uniques=$eu"
              echo "${kind}_clones=$ec"
              echo "${kind}_pull_delta=$(signed $(( ep - sp )))"
              echo "${kind}_star_delta=$(signed $(( es - ss )))"
              echo "${kind}_fork_delta=$(signed $(( ef - sf )))"
              echo "${kind}_view_delta=$view_delta"
              echo "${kind}_clone_delta=$clone_delta"
            } >> "$GITHUB_OUTPUT"
          }

          DAILY_LAST=$(last_sent daily)
          WEEKLY_LAST=$(last_sent weekly)
          out daily_window "$TODAY"
          out daily_prev "$DAILY_LAST"
          out weekly_window "$MONDAY"
          out weekly_prev "$WEEKLY_LAST"

          if [ "$HOUR" -ge "$DUE_HOUR" ] && [[ "$DAILY_LAST" < "$TODAY" ]]; then
            plan daily "$TODAY" 1
          else
            echo "daily digest: not due (last sent for '${DAILY_LAST}', ${HOUR}:xx UTC)"
          fi

          if [ "$FORCE" = "true" ]; then
            echo "weekly digest: forced"
            plan weekly "$MONDAY" 7
          elif { [[ "$TODAY" > "$MONDAY" ]] || [ "$HOUR" -ge "$DUE_HOUR" ]; } \
               && [[ "$WEEKLY_LAST" < "$MONDAY" ]]; then
            plan weekly "$MONDAY" 7
          else
            echo "weekly digest: not due (last sent for '${WEEKLY_LAST}')"
          fi

      # ── Claim, send, release ─────────────────────────────────
      # A digest is recorded and pushed BEFORE it is posted, and un-recorded
      # if the post fails. Recording it afterwards would re-post it every 15
      # minutes for as long as the push kept failing. This way a failed push
      # sends nothing, a failed post is retried by the next run, and only a
      # failed post followed by a failed release loses a digest.
      - name: Claim digests
        id: claim
        if: >-
          steps.plan.outputs.daily_send == 'true' || steps.plan.outputs.daily_record == 'true'
          || steps.plan.outputs.weekly_send == 'true' || steps.plan.outputs.weekly_record == 'true'
        continue-on-error: true
        env:
          BRANCH: metrics
          DAILY: >-
            ${{ (steps.plan.outputs.daily_send == 'true' || steps.plan.outputs.daily_record == 'true')
            && steps.plan.outputs.daily_window || '' }}
          WEEKLY: >-
            ${{ (steps.plan.outputs.weekly_send == 'true' || steps.plan.outputs.weekly_record == 'true')
            && steps.plan.outputs.weekly_window || '' }}
        run: |
          set -euo pipefail
          cd hist
          [ -f data/digests.json ] || echo '{}' > data/digests.json
          jq --arg d "$DAILY" --arg w "$WEEKLY" '
            (if $d != "" then .daily = $d else . end)
            | (if $w != "" then .weekly = $w else . end)' \
            data/digests.json > data/digests.json.new
          mv data/digests.json.new data/digests.json

          git add data/digests.json
          if git diff --quiet --cached; then
            echo "Markers already up to date"
          else
            git commit -q -m "chore(metrics): record digests (daily ${DAILY:-unchanged}, weekly ${WEEKLY:-unchanged})"
            git push -q origin "$BRANCH"
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Weekly digest
        id: weekly
        if: steps.plan.outputs.weekly_send == 'true' && steps.claim.outputs.ok == 'true'
        continue-on-error: true
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          FROM: ${{ steps.plan.outputs.weekly_from }}
          TO: ${{ steps.plan.outputs.weekly_to }}
          PULLS: ${{ steps.plan.outputs.weekly_pulls }}
          STARS: ${{ steps.plan.outputs.weekly_stars }}
          FORKS: ${{ steps.plan.outputs.weekly_forks }}
          VIEWS: ${{ steps.plan.outputs.weekly_views }}
          UNIQUES: ${{ steps.plan.outputs.weekly_uniques }}
          CLONES: ${{ steps.plan.outputs.weekly_clones }}
          PULL_DELTA: ${{ steps.plan.outputs.weekly_pull_delta }}
          STAR_DELTA: ${{ steps.plan.outputs.weekly_star_delta }}
          FORK_DELTA: ${{ steps.plan.outputs.weekly_fork_delta }}
          VIEW_DELTA: ${{ steps.plan.outputs.weekly_view_delta }}
          CLONE_DELTA: ${{ steps.plan.outputs.weekly_clone_delta }}
          REAL: ${{ steps.plan.outputs.weekly_real }}
          SWEEPS: ${{ steps.plan.outputs.weekly_sweeps }}
          REAL_SINCE: ${{ steps.plan.outputs.weekly_real_since }}
          VERSIONS: ${{ steps.plan.outputs.weekly_versions }}
        run: |
          set -uo pipefail
          if [ -z "$SLACK_WEBHOOK" ]; then
            # Unreachable while "Plan digests" gates on the secret; failing
            # keeps it safe anyway, since the release step then un-records it.
            echo "::error::No SLACK_WEBHOOK_URL configured"
            exit 1
          fi

          view_delta="";  [ -z "$VIEW_DELTA" ]  || view_delta=", ${VIEW_DELTA}"
          clone_delta=""; [ -z "$CLONE_DELTA" ] || clone_delta=" (${CLONE_DELTA})"

          # Estimates from the run log (see "Persist metrics history"); left
          # out until the log covers part of the window.
          real_text=""
          if [ -n "$REAL" ]; then
            real_text="$REAL"
            [ "${SWEEPS:-0}" = 0 ] || real_text="${real_text}, ${SWEEPS} bot sweeps of every tag filtered out"
            [ -z "$REAL_SINCE" ] || real_text="${real_text} (counted since ${REAL_SINCE})"
          fi
          extra_fields=""
          [ -z "$real_text" ] || extra_fields="${extra_fields},
                    { \"type\": \"mrkdwn\", \"text\": \"*🧑‍💻 Likely Real Pulls*\n${real_text}\" }"
          [ -z "$VERSIONS" ] || extra_fields="${extra_fields},
                    { \"type\": \"mrkdwn\", \"text\": \"*🏷️ Versions Pulled (runs seen in)*\n${VERSIONS}\" }"

          curl -sf -X POST "$SLACK_WEBHOOK" \
            -H 'Content-type: application/json' \
            -d "{
              \"blocks\": [
                {
                  \"type\": \"header\",
                  \"text\": { \"type\": \"plain_text\", \"text\": \"📊  EDDI Weekly Digest\", \"emoji\": true }
                },
                {
                  \"type\": \"section\",
                  \"fields\": [
                    { \"type\": \"mrkdwn\", \"text\": \"*🐳 Docker Pulls*\n${PULLS} (${PULL_DELTA})\" },
                    { \"type\": \"mrkdwn\", \"text\": \"*⭐ GitHub Stars*\n${STARS} (${STAR_DELTA})\" },
                    { \"type\": \"mrkdwn\", \"text\": \"*🍴 Forks*\n${FORKS} (${FORK_DELTA})\" },
                    { \"type\": \"mrkdwn\", \"text\": \"*👀 Repo Views (14d)*\n${VIEWS} (${UNIQUES} unique${view_delta})\" },
                    { \"type\": \"mrkdwn\", \"text\": \"*📥 Git Clones (14d)*\n${CLONES}${clone_delta}\" }${extra_fields}
                  ]
                },
                {
                  \"type\": \"context\",
                  \"elements\": [
                    { \"type\": \"mrkdwn\", \"text\": \"${FROM} → ${TO} · <https://hub.docker.com/r/labsai/eddi|Docker Hub> · <https://github.com/labsai/EDDI|GitHub> · <https://eddi.labs.ai|Website>\" }
                  ]
                }
              ]
            }"

      - name: Daily digest
        id: daily
        if: steps.plan.outputs.daily_send == 'true' && steps.claim.outputs.ok == 'true'
        continue-on-error: true
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          FROM: ${{ steps.plan.outputs.daily_from }}
          TO: ${{ steps.plan.outputs.daily_to }}
          PULLS: ${{ steps.plan.outputs.daily_pulls }}
          STARS: ${{ steps.plan.outputs.daily_stars }}
          FORKS: ${{ steps.plan.outputs.daily_forks }}
          VIEWS: ${{ steps.plan.outputs.daily_views }}
          CLONES: ${{ steps.plan.outputs.daily_clones }}
          PULL_DELTA: ${{ steps.plan.outputs.daily_pull_delta }}
          STAR_DELTA: ${{ steps.plan.outputs.daily_star_delta }}
          FORK_DELTA: ${{ steps.plan.outputs.daily_fork_delta }}
          VIEW_DELTA: ${{ steps.plan.outputs.daily_view_delta }}
          CLONE_DELTA: ${{ steps.plan.outputs.daily_clone_delta }}
          REAL: ${{ steps.plan.outputs.daily_real }}
          SWEEPS: ${{ steps.plan.outputs.daily_sweeps }}
          REAL_SINCE: ${{ steps.plan.outputs.daily_real_since }}
          VERSIONS: ${{ steps.plan.outputs.daily_versions }}
        run: |
          set -uo pipefail
          if [ -z "$SLACK_WEBHOOK" ]; then
            # Unreachable while "Plan digests" gates on the secret; failing
            # keeps it safe anyway, since the release step then un-records it.
            echo "::error::No SLACK_WEBHOOK_URL configured"
            exit 1
          fi

          view_delta="";  [ -z "$VIEW_DELTA" ]  || view_delta=" (${VIEW_DELTA})"
          clone_delta=""; [ -z "$CLONE_DELTA" ] || clone_delta=" (${CLONE_DELTA})"

          # Same estimate as the weekly digest; see there.
          real_text=""
          if [ -n "$REAL" ]; then
            real_text="$REAL"
            [ "${SWEEPS:-0}" = 0 ] || real_text="${real_text}, ${SWEEPS} bot sweeps of every tag filtered out"
            [ -z "$REAL_SINCE" ] || real_text="${real_text} (counted since ${REAL_SINCE})"
          fi
          extra=""
          [ -z "$real_text" ] || extra="${extra}\n🧑‍💻 *Likely real pulls:* ${real_text}"
          [ -z "$VERSIONS" ] || extra="${extra}\n🏷️ *Versions pulled (runs seen in):* ${VERSIONS}"

          curl -sf -X POST "$SLACK_WEBHOOK" \
            -H 'Content-type: application/json' \
            -d "{
              \"blocks\": [
                {
                  \"type\": \"header\",
                  \"text\": { \"type\": \"plain_text\", \"text\": \"📈  EDDI Daily Update\", \"emoji\": true }
                },
                {
                  \"type\": \"section\",
                  \"text\": {
                    \"type\": \"mrkdwn\",
                    \"text\": \"🐳 *Pulls:* ${PULLS} (${PULL_DELTA})  ·  ⭐ *Stars:* ${STARS} (${STAR_DELTA})  ·  🍴 *Forks:* ${FORKS} (${FORK_DELTA})${extra}\"
                  }
                },
                {
                  \"type\": \"context\",
                  \"elements\": [
                    { \"type\": \"mrkdwn\", \"text\": \"👀 Views (14d): ${VIEWS}${view_delta} · 📥 Clones (14d): ${CLONES}${clone_delta} · ${FROM} → ${TO} · <https://github.com/labsai/EDDI|GitHub>\" }
                  ]
                }
              ]
            }"

      # Not continue-on-error: if this fails, a claimed digest was never
      # posted, and a red run is the only place that shows.
      - name: Release unsent digests
        if: >-
          steps.claim.outputs.ok == 'true'
          && ((steps.plan.outputs.daily_send == 'true' && steps.daily.outcome != 'success')
          || (steps.plan.outputs.weekly_send == 'true' && steps.weekly.outcome != 'success'))
        env:
          BRANCH: metrics
          RELEASE_DAILY: ${{ steps.plan.outputs.daily_send == 'true' && steps.daily.outcome != 'success' }}
          RELEASE_WEEKLY: ${{ steps.plan.outputs.weekly_send == 'true' && steps.weekly.outcome != 'success' }}
          DAILY_PREV: ${{ steps.plan.outputs.daily_prev }}
          WEEKLY_PREV: ${{ steps.plan.outputs.weekly_prev }}
        run: |
          set -euo pipefail
          cd hist
          jq --arg rd "$RELEASE_DAILY" --arg dp "$DAILY_PREV" \
             --arg rw "$RELEASE_WEEKLY" --arg wp "$WEEKLY_PREV" '
            def restore(k; p): if p == "" then del(.[k]) else .[k] = p end;
            (if $rd == "true" then restore("daily"; $dp) else . end)
            | (if $rw == "true" then restore("weekly"; $wp) else . end)' \
            data/digests.json > data/digests.json.new
          mv data/digests.json.new data/digests.json
          git add data/digests.json
          git commit -q -m "chore(metrics): release unsent digests so the next run retries"
          git push -q origin "$BRANCH"
          echo "::warning::Slack post failed — released the claim; the next run retries (daily=${RELEASE_DAILY}, weekly=${RELEASE_WEEKLY})"
