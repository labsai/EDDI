# Round-robin load balancer of the cluster load test (docker-compose.cluster.yml).
# Same rules as docker/cluster/nginx.conf (no affinity, max_fails=0, a POST is never re-sent),
# sized for thousands of concurrent turns, and with one addition: every response names the
# replica that answered it (X-Loadtest-Upstream), which is how k6 splits latency per node.
worker_processes 4;

events {
    worker_connections 16384;
}

http {
    resolver 127.0.0.11 valid=5s ipv6=off;
    access_log off;

    upstream eddi {
        zone eddi 64k;
        server eddi:7070 resolve max_fails=0;
        keepalive 512;
    }

    server {
        listen 7070;
        client_max_body_size 32m;

        location / {
            proxy_pass http://eddi;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 180s;
            proxy_connect_timeout 2s;
            # Only a refused connection moves on; a 503 or 409 goes back to k6 so it is counted.
            proxy_next_upstream error;
            add_header X-Loadtest-Upstream $upstream_addr always;
        }
    }
}
