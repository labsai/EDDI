# PostgreSQL for the load-test stack (`loadtest.py up --db postgres`).
# pg_stat_statements is preloaded so that the driver can count statements per turn, the
# PostgreSQL counterpart of MongoDB's opcounters.
services:
  postgres:
    image: postgres:16.15-alpine
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.track=all",
              "-c", "max_connections=400"]
    environment:
      - "POSTGRES_DB=eddi"
      - "POSTGRES_USER=eddi"
      - "POSTGRES_PASSWORD=eddi"
    ports:
      - "127.0.0.1:${LOADTEST_POSTGRES_PORT:-54370}:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "eddi", "-d", "eddi"]
      interval: 5s
      timeout: 5s
      retries: 20

  eddi:
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - "QUARKUS_PROFILE=postgres"
      - "EDDI_DATASTORE_TYPE=postgres"
      - "QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://postgres:5432/eddi"
      - "QUARKUS_DATASOURCE_USERNAME=eddi"
      - "QUARKUS_DATASOURCE_PASSWORD=eddi"
