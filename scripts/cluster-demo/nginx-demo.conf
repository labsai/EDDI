# Round-robin over the three demo nodes (scripts/cluster-demo/demo.py).
# No affinity: any node serves any conversation.
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream eddi {
        zone eddi 64k;
        # max_fails=0: an answer of 503 (load shedding, draining, NATS unavailable)
        # must not take a node out of rotation; with the default every node was marked
        # failed at once and the whole API answered 502 for 10 s.
        server p11-eddi-1:7070 resolve max_fails=0;
        server p11-eddi-2:7070 resolve max_fails=0;
        server p11-eddi-3:7070 resolve max_fails=0;
    }

    upstream eddi_mcp {
        zone eddi_mcp 64k;
        hash $remote_addr consistent;
        server p11-eddi-1:7070 resolve;
        server p11-eddi-2:7070 resolve;
        server p11-eddi-3:7070 resolve;
    }

    server {
        listen 7230;
        client_max_body_size 32m;

        # MCP (Streamable HTTP) keeps its session on the node that answered
        # `initialize`; a request carrying that Mcp-Session-Id on another node is
        # answered 404. Route /mcp by client address so a client stays on one node.
        location /mcp {
            proxy_pass http://eddi_mcp;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 300s;
        }

        location / {
            proxy_pass http://eddi;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 150s;
            proxy_connect_timeout 2s;
            # A stopped or draining node: try the next one (also for POST — the
            # turn never reached a node that refused the connection or answered 503).
            proxy_next_upstream error timeout http_502 http_503 non_idempotent;
        }
    }
}
